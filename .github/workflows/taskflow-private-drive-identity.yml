name: TF private attachment repair accurate release identity
on:
  push:
    branches: ['review/tf-private-drive-final-identity-20261110']
    paths: ['.github/workflows/taskflow-private-drive-identity.yml']
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.prepare.outputs.backend }}
      web: ${{ steps.prepare.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare exact accepted repair baselines without merging unrelated work
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          test "$(git rev-parse origin/main)" = 65d731967994048ed7e1e5c95b158ddc170ec130
          printf '%s' '' | base64 -d > /tmp/prepare-identity.py
          git switch --detach 8f6e32390431e3530313804a0a989282cd1070ce
          python3 /tmp/prepare-identity.py 20261110-2012
          git diff --check
          node --test tests/release-consistency.test.js tests/release-governance.test.js
          git add version.json shared app docs index.html status-classic.html modules labs
          git commit -m 'Synchronize private attachment repair release identity and native backend build identity'
          git push origin HEAD:refs/heads/review/tf-drive-identity-backend-20261110
          echo "backend=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git switch --detach ad56f78ae6b14e7f378ca24e3d64d8a1c2bbce49
          python3 /tmp/prepare-identity.py 20261110-2012
          git diff --check
          node --test tests/release-consistency.test.js tests/release-governance.test.js
          git add version.json shared app docs index.html status-classic.html modules labs
          git commit -m 'Synchronize private attachment repair release identity and native web build identity'
          git push origin HEAD:refs/heads/review/tf-drive-identity-web-20261110
          echo "web=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  exact-image:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            sha: ${{ needs.source.outputs.backend }}
          - image: web
            sha: ${{ needs.source.outputs.web }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
      - name: Verify exact source, release identity and overlay contracts
        env:
          SOURCE_SHA: ${{ matrix.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          node --test tests/release-consistency.test.js tests/release-governance.test.js
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s labs/taskflow/tests -v
      - name: Build actual deployable image and execute native gates
        env:
          IMAGE: ${{ matrix.image }}
          SOURCE_SHA: ${{ matrix.sha }}
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain --build-arg RENDER_GIT_COMMIT="$SOURCE_SHA" -f "labs/taskflow/Dockerfile.$IMAGE" -t "tf-drive-identity-$IMAGE:qualification" . 2>&1 | tee image-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-drive-identity-${{ matrix.image }}
          path: image-build.log
