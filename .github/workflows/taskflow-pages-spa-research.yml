name: TaskFlow Pages Client Research Gate (NO DEPLOY)
on:
  push:
    branches:
      - feature/gh-pages-taskflow-spa-feasibility-20261016-1335
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-of-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify auth and native API transport without live credentials
        run: |
          node --test tests/taskflow-pages-client-api.test.mjs tests/taskflow-pages-login-return.test.mjs tests/taskflow-pages-feasibility.test.js
          node --check labs/taskflow/pages-client/taskflow-api.mjs
          node --check labs/taskflow/pages-client/app.mjs
      - name: Install Playwright test fixture dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Browser QA for real API contract and unchanged URL
        run: |
          BROWSER_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" node --test tests/taskflow-pages-client-browser.test.mjs
      - name: Probe official Render API CORS (read-only; no credentials)
        run: |
          node labs/taskflow/pages-client/cors-probe.mjs
      - name: Verify canonical homepage is the real native TaskFlow read-only client
        run: |
          node --test tests/pages-public-home-routing.test.js
          node tools/taskflow-pages-feasibility.js --require-home-code
          node -e "const r=require('./tools/taskflow-pages-feasibility.js').assess();if(r.status!=='HOME_CANDIDATE_READY_FOR_RUNTIME_QA'||r.deploymentAllowed||r.githubAppAllowed)process.exit(1)"
