name: TF private Drive canonical preview qualification
on:
  push:
    branches: ['review/tf-drive-inline-qualification-20261110']
    paths: ['.github/workflows/taskflow-private-drive-inline.yml']
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.compose.outputs.backend }}
      web: ${{ steps.compose.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compose generic canonical preview repair on exact accepted baselines
        id: compose
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch --detach 9f30c7a06d781f0ae8ad9a196b9103435059d751
          python3 - <<'PYCODE'
          import base64,json
          from pathlib import Path
          files=json.loads(base64.b64decode(''))
          for name,value in files.items():
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(value)
          PYCODE
          git diff --check
          git add labs/taskflow
          git commit -m 'Mark private Drive preview responses without changing stored references'
          git push origin HEAD:refs/heads/review/tf-drive-private-inline-api-20261110
          echo "backend=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git switch --detach 65d731967994048ed7e1e5c95b158ddc170ec130
          python3 - <<'PYCODE'
          import base64,json
          from pathlib import Path
          files=json.loads(base64.b64decode(''))
          for name,value in files.items():
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(value)
          PYCODE
          git diff --check
          git add labs/taskflow
          git commit -m 'Use authenticated canonical preview for private Drive attachments'
          git push origin HEAD:refs/heads/review/tf-drive-private-inline-web-20261110
          echo "web=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  image:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            sha: ${{ needs.source.outputs.backend }}
          - image: web
            sha: ${{ needs.source.outputs.web }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
      - name: Verify generic overlay contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s labs/taskflow/tests -v
      - name: Build actual image and execute native gates without deployment or private credentials
        env:
          IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain -f "labs/taskflow/Dockerfile.$IMAGE" -t "tf-drive-inline-$IMAGE:qualification" . 2>&1 | tee image-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drive-inline-${{ matrix.image }}
          path: image-build.log
