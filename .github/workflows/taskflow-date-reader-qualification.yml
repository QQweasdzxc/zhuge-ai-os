name: TaskFlow Date Reader Release Qualification
on:
  push:
    branches: [review/tf-date-hours-bootstrap-20261113]
    paths: [.github/workflows/taskflow-date-reader-qualification.yml]
permissions:
  contents: read
jobs:
  role-helper:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compose only staged date SQL and production-role tests
        run: |
          set -euo pipefail
          test "$(sha256sum 2-tf-date-hours-role-helper-v2.patch | cut -d' ' -f1)" = 4959fb964fecbde084e428e9116534a06279d11b4ef9f282703e711340d7a0a9
          cp 2-tf-date-hours-role-helper-v2.patch /tmp/role-helper.patch
          git switch --detach d0591a6f6a74eca64a5d57b1bae9ed1324a3453b
          git apply --check /tmp/role-helper.patch
          git apply /tmp/role-helper.patch
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:worklog
      - name: Production-like split ownership, blocked writes, tenant, replay and rollback
        run: |
          npm ci --ignore-scripts --prefix labs/taskflow/tests/worklog-server
          cd labs/taskflow/tests/worklog-server
          node sql-check.mjs
          node date-hours-check.mjs
      - name: Preserve source-only SQL candidate without deployment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/worklog/native/server/date-hours*.sql labs/taskflow/tests/worklog-server/date-hours-check.mjs
          git commit -m 'Stage narrow date SQL helpers under separate existing owners'
          git push origin HEAD:refs/heads/review/tf-date-hours-role-helper-v2-20261113
