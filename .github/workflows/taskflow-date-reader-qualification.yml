name: TaskFlow Date Reader Release Qualification
on:
  push:
    branches: [review/tf-date-hours-bootstrap-20261113]
    paths: [.github/workflows/taskflow-date-reader-qualification.yml]
permissions:
  contents: read
jobs:
  guard-readers:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - surface: web
            base: d0591a6f6a74eca64a5d57b1bae9ed1324a3453b
            branch: review/tf-date-hours-web-release-20261113
            oldbuild: 20261113-0651
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compose date-only identity guards on exact reader baseline
        env:
          BASE: ${{ matrix.base }}
          OLD_BUILD: ${{ matrix.oldbuild }}
        run: |
          set -euo pipefail
          test "$(sha256sum 1-tf-date-legacy-guard.patch | cut -d' ' -f1)" = cc9cb4a352608e9f678f2334c8f59ad45aea20e93db491932ed0dc053ef27dce
          cp 1-tf-date-legacy-guard.patch /tmp/guard.patch
          git switch --detach "$BASE"
          git apply --check /tmp/guard.patch
          git apply /tmp/guard.patch
          git grep -l "$OLD_BUILD" | xargs sed -i "s/$OLD_BUILD/20261113-0729/g"
          if [ "${{ matrix.surface }}" = web ]; then sed -i s/20261110-2012/20261113-0729/g docs/index.html docs/status-classic.html; fi
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Core, guard, source, release and entry regression
        run: |
          if [ "${{ matrix.surface }}" = web ]; then npm run test:worklog; fi
          node --test tests/worklog-date-hours-compat.test.js tests/shared-navigation.test.js tests/taskflow-entry.test.js tests/taskflow-cli-sso.test.js
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s labs/taskflow/tests -v
      - name: Publish source-only reviewed candidate
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git commit -m 'Guard date-only source identity before legacy assistant normalization'
          git push origin HEAD:refs/heads/$TARGET_BRANCH
      - name: Qualify exact Web image without deploy
        if: matrix.surface == 'web'
        run: |
          set -o pipefail
          docker build --pull --progress=plain -f labs/taskflow/Dockerfile.web -t taskflow-date-hours-guard:parity . 2>&1 | tee /tmp/web-build.log
          grep -F 'TASKFLOW_SOURCE_MODE=vendored SHA=8db6cfe19ae6fd5c35ec71bd8fea42a3ef3861ec; upstream application source clone=disabled' /tmp/web-build.log
