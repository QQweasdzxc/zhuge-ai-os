name: P0 TaskFlow Home and Curated Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - review/p0-home-apps-pages-20261015
      - review/pixel-office-homepage-20261018
      - review/pixel-office-furnishings-p1-20261018
      - review/pixel-office-roles-p2-20261018
      - review/navigation-only-release-20261023

permissions:
  contents: read

concurrency:
  group: canonical-site-pages-release
  cancel-in-progress: false

jobs:
  overlay-contract:
    name: Overlay and route contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check patch whitespace
        run: git diff HEAD^ HEAD --check
      - name: Verify TaskFlow overlays fail closed
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s labs/taskflow/tests -v
      - name: Verify navigation and P0 entry routes
        run: node --test tests/shared-navigation.test.js tests/taskflow-entry.test.js tests/taskflow-cli-sso.test.js

  backend-image:
    name: TaskFlow backend build parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build TaskFlow backend from repository-root context
        shell: bash
        run: |
          set -o pipefail
          docker build --pull --progress=plain \
            -f labs/taskflow/Dockerfile.backend \
            -t taskflow-multica-backend:parity . 2>&1 | tee /tmp/taskflow-backend-build.log
          if grep -Eiq 'git clone https://github.com/multica-ai/multica([.]git)?' /tmp/taskflow-backend-build.log; then
            echo "Unexpected Multica application-source clone in backend build log" >&2
            exit 1
          fi
          grep -F "TASKFLOW_SOURCE_MODE=vendored SHA=8db6cfe19ae6fd5c35ec71bd8fea42a3ef3861ec; upstream application source clone=disabled" /tmp/taskflow-backend-build.log

  web-image:
    name: TaskFlow web build parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build TaskFlow web from repository-root context
        shell: bash
        run: |
          set -o pipefail
          docker build --pull --progress=plain \
            -f labs/taskflow/Dockerfile.web \
            -t taskflow-multica-web:parity . 2>&1 | tee /tmp/taskflow-web-build.log
          if grep -Eiq 'git clone https://github.com/multica-ai/multica([.]git)?' /tmp/taskflow-web-build.log; then
            echo "Unexpected Multica application-source clone in web build log" >&2
            exit 1
          fi
          grep -F "TASKFLOW_SOURCE_MODE=vendored SHA=8db6cfe19ae6fd5c35ec71bd8fea42a3ef3861ec; upstream application source clone=disabled" /tmp/taskflow-web-build.log

  browser:
    name: Chromium desktop and mobile browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install pinned browser-test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Export CI Chromium path
        run: echo "BROWSER_EXECUTABLE=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Run browser regression
        run: npm run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-browser-evidence-${{ github.sha }}
          path: tests/evidence/
          if-no-files-found: ignore
          retention-days: 14

  pages-artifact:
    name: Curated Pages artifact validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 980e505dfdaad7334dc8df43f397ecb1f176ac0b
          path: hub-source
      - uses: actions/checkout@v4
        with:
          ref: 47061d8b1a63629335e4c722baa1a9b4d0eda150
          path: chengyu-source
      - uses: actions/checkout@v4
        with:
          ref: dc1248d90cafa7fa1bf6c5590ee64cced5e7bc99
          path: vocab-source
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assemble curated tracked AI OS Pages routes
        run: node tools/build-pages-site.js "$RUNNER_TEMP/pages-site"
      - name: Build pinned MIT Habblaud Pixel Office into the ACTUAL Pages artifact
        run: |
          git init "$RUNNER_TEMP/zhuge-habblaud"
          git -C "$RUNNER_TEMP/zhuge-habblaud" remote add origin https://github.com/marmottajr/habblaud.git
          git -C "$RUNNER_TEMP/zhuge-habblaud" fetch --depth=1 origin faa1a012b5fbf632c66dc6801c5383e53a542406
          git -C "$RUNNER_TEMP/zhuge-habblaud" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/zhuge-habblaud" rev-parse HEAD)" = "faa1a012b5fbf632c66dc6801c5383e53a542406"
          npm ci --prefix "$RUNNER_TEMP/zhuge-habblaud" --ignore-scripts --no-audit --no-fund
          node integrations/habblaud/build.mjs "$RUNNER_TEMP/zhuge-habblaud" "$RUNNER_TEMP/pages-site"
          test -s "$RUNNER_TEMP/pages-site/pixel-office/index.html"
          test -s "$RUNNER_TEMP/pages-site/docs/pixel-office/index.html"
          test -s "$RUNNER_TEMP/pages-site/pixel-office/LICENSE.txt"
      - name: Add exact current illustrated islands and newest phrase audio
        run: |
          mkdir -p "$RUNNER_TEMP/pages-site/learning/chengyu" "$RUNNER_TEMP/pages-site/learning/vocab"
          cp -a hub-source/apps/learning-archipelago/site/. "$RUNNER_TEMP/pages-site/learning/"
          cp -a chengyu-source/apps/chengyu-quest/site/. "$RUNNER_TEMP/pages-site/learning/chengyu/"
          cp -a vocab-source/apps/vocab-quest/site/. "$RUNNER_TEMP/pages-site/learning/vocab/"
          python3 - <<'PY'
          import pathlib,os,json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'pages-site'/'learning'
          replacements={'https://learning-archipelago-family.onrender.com/':'https://qqweasdzxc.github.io/zhuge-ai-os/learning/','https://chengyu-quest-family.onrender.com/':'https://qqweasdzxc.github.io/zhuge-ai-os/learning/chengyu/','https://vocab-quest-family.onrender.com/':'https://qqweasdzxc.github.io/zhuge-ai-os/learning/vocab/'}
          for p in root.rglob('*'):
            if p.suffix not in ['.html','.js','.json','.css']:continue
            s=p.read_text()
            for a,b in replacements.items():s=s.replace(a,b)
            guard="!['learning-archipelago-family.onrender.com','chengyu-quest-family.onrender.com','vocab-quest-family.onrender.com'].includes(parsed.hostname)"
            new="!(['learning-archipelago-family.onrender.com','chengyu-quest-family.onrender.com','vocab-quest-family.onrender.com'].includes(parsed.hostname)||(parsed.hostname==='qqweasdzxc.github.io'&&/^\\/zhuge-ai-os\\/learning\\/(?:$|index\\.html$|(?:chengyu|vocab)\\/(?:index\\.html)?$)/.test(parsed.pathname)))"
            p.write_text(s.replace(guard,new))
          # Approved 2026-11-16 island-name update only; game names, rules and IDs stay unchanged.
          for p in root.rglob('*'):
            if p.suffix not in ['.html','.js','.json','.css']:continue
            s=p.read_text().replace('成語島','字裡乾坤')
            s=s.replace('5-archipelago-four-20261116-q85.webp','1-zili-landscape.webp').replace('2-archipelago-four-portrait-20261116.webp','2-zili-portrait.webp')
            s=s.replace('主島直達 · 成語 / 英文 / 金銀 / Office','主島直達 · 字裡乾坤 / 英文 / 金銀 / Office')
            s=s.replace('island-world.js?v=20261116-four','island-world.js?v=20261116-zili')
            if p==root/'chengyu/index.html':
              s=s.replace('成語闖關王','字裡乾坤').replace("idiom?'成語練習'","idiom?'字裡乾坤'")
              s=s.replace('<title>字裡乾坤｜隨機測驗・語音解析</title>','<title>字裡乾坤｜成語闖關・字音字形・組詞</title>')
            p.write_text(s)
          for name in ['5-archipelago-four-20261116-q85.webp','2-archipelago-four-portrait-20261116.webp']:
            (root/name).unlink()
          assert (root/'1-zili-landscape.webp').stat().st_size==293236
          assert (root/'2-zili-portrait.webp').stat().st_size==316816
          # Prevent retired cards from painting while the actual scene script loads.
          p=root/'index.html'
          shell='<style id="archipelago-first-paint">\n/* The real map is built progressively. Never paint the retired six-card scaffold. */\n.world:not(.expedition-world){visibility:hidden;min-height:100dvh}\nbody:has(.world:not(.expedition-world))::before{content:"";position:fixed;inset:0;background:#183d51 url(\'./1-zili-landscape.webp\') center/contain no-repeat;z-index:29;pointer-events:none}\n@media(max-width:690px){body:has(.world:not(.expedition-world))::before{background-image:url(\'./2-zili-portrait.webp\');background-size:cover}}\n</style>\n'
          p.write_text(p.read_text().replace('</head>',shell+'</head>'))
          # Remove the redundant visible direct-destination strip; island hit targets remain.
          world=root/'island-world.js'
          world.write_text(world.read_text()+"\n;(()=>{const s=document.createElement('style');s.id='direct-route-strip-removed';s.textContent='.four-journeys{display:none!important}';document.head.appendChild(s)})();\n")
          vocab=root/'vocab'
          import re
          html=(vocab/'index.html').read_text()
          maps=re.findall(r'var (?:phrase|sentence)AudioFiles=(\{.*?\});',html)
          assert len(maps)==2
          keep={url.split('?')[0].removeprefix('./') for mapping in maps for url in json.loads(mapping).values()}
          assert len(keep)==142
          for asset in vocab.glob('*.mp3'):
            if asset.name not in keep:asset.unlink()
          assert {p.name for p in vocab.glob('*.mp3')}==keep
          assert json.loads((root/'vocab/release.json').read_text())['version']=='2.9.15'
          assert (root/'index.html').exists() and (root/'chengyu/index.html').exists()
          PY
      - name: Restore canonical learning release and verify every scoped file
        run: |
          python3 - <<'PYRELEASE'
          import pathlib,os,json,gzip,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'pages-site'/'learning'
          release=json.loads(gzip.decompress(pathlib.Path('.github/1-1-learning-release-20261117-watch-tower.json.gz').read_bytes()))
          assert release['release']=='learning-20261117-watch-tower'
          for name,text in release['files'].items():
            dest=root/name
            assert dest.resolve().is_relative_to(root.resolve())
            assert hashlib.sha256(text.encode()).hexdigest()==release['sha256'][name]
            dest.parent.mkdir(parents=True,exist_ok=True)
            dest.write_text(text)
          for name,digest in release['sha256'].items():
            assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          for page in ['index.html','chengyu/index.html','vocab/index.html']:
            text=(root/page).read_text()
            assert 'maximum-scale=1, user-scalable=no' in text
            assert 'learning-mobile-gestures' in text and 'manifest.json?v=20261117-mobile' in text
          for page in ['chengyu/index.html','vocab/index.html']:
            assert "nav.textContent='‹ 返回群島'" in (root/page).read_text()
          assert '>關閉解析</button>' in (root/'chengyu/index.html').read_text()
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['scope']==manifest['start_url']=='/zhuge-ai-os/learning/'
          assert manifest['display']=='standalone'
          assert 'unified-daily-task-cards' in (root/'index.html').read_text()
          html=(root/'index.html').read_text()
          assert 'previewEntry' in html and 'discardInvalidEntry' in html
          assert 'entry-identity.js?v=2' in html and 'island-world.js?v=20261116-zili' in html
          assert 'direct-route-strip-removed' in (root/'island-world.js').read_text()
          assert (root/'1-zili-landscape.webp').stat().st_size==293236
          assert (root/'2-zili-portrait.webp').stat().st_size==316816
          (root/'release-manifest.json').write_text(json.dumps({'release':release['release'],'sha256':release['sha256']},indent=2))
          print('Canonical learning source and SHA256 gate passed:',len(release['files']))
          PYRELEASE
      - name: Validate P0 routes and excluded source payload
        run: node tests/pages-publish-artifact.test.js "$RUNNER_TEMP/pages-site"
      - name: Upload candidate artifact without deploying
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site
          retention-days: 1

  review-package:
    name: Create verified source review bundle
    if: startsWith(github.ref, 'refs/heads/review/p0-home-apps-pages-20261015')
    needs:
      - overlay-contract
      - backend-image
      - web-image
      - browser
      - pages-artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read formal main baseline
        run: git fetch origin main
      - name: Check candidate source and release identity
        run: |
          git diff origin/main...HEAD --check
          node --test tests/release-consistency.test.js tests/release-governance.test.js
          node tools/release-governance.js preflight
      - name: Package reviewed candidate from exact clean SHA
        run: |
          node tools/release-governance.js package \
            --type review \
            --description P0-TaskFlow-Home-Apps-Pages \
            --regression-json '{"governance":"PASS","checklist":"PASS","full":"PASS","gitDiffCheck":"PASS","browser":"PASS"}' \
            --output-dir "$RUNNER_TEMP/p0-review-package"
      - name: Upload FullSource review package
        uses: actions/upload-artifact@v4
        with:
          name: p0-fullsource-review-${{ github.sha }}
          path: ${{ runner.temp }}/p0-review-package/*
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    name: Publish curated site to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs:
      - overlay-contract
      - backend-image
      - web-image
      - browser
      - pages-artifact
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Reject superseded main commits before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$GITHUB_SHA"
      - name: Deploy the verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
