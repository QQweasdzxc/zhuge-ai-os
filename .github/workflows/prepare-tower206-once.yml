name: Prepare reviewed tower206 branch
on:
  push:
    branches: [fix/tower-single-source-20261117]
    paths: [.github/workflows/prepare-tower206-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exactly reviewed public files and remove preparation inputs
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,gzip,json,base64
          root=pathlib.Path('.')
          blob=(root/'3-tower206-exact-files.json.gz').read_bytes()
          assert hashlib.sha256(blob).hexdigest()=='46a21dabc70f3696c800ddff4d7c16cfc9372c651bae35712b7ea9ebc88ea63c'
          files=json.loads(gzip.decompress(blob))
          assert len(files)==30
          assert set(files)==set(json.loads('[".github/1-1-learning-release-20261117-watch-tower.json.gz", "app/Board/ai/index.html", "app/Board/investment/index.html", "app/Board/procurement/index.html", "app/Board/template-preview/index.html", "app/Board/worktodo/index.html", "app/dashboard/index.html", "app/dashboard/zhuge-dashboard.js", "bridge-site/_redirects", "bridge-site/index.html", "docs/index.html", "docs/qa/watch-tower-single-source-20261117.md", "docs/status-classic.html", "index.html", "labs/investment/app.js", "labs/investment/index.html", "labs/investment/src/portfolio/view.mjs", "labs/investment/version.json", "labs/taskflow/index.html", "modules/investment/index.html", "modules/investment/version.json", "modules/skyeye/index.html", "modules/worklog/chat/index.html", "modules/worklog/index.html", "modules/worklog/version.json", "shared/app-config.js", "shared/config/template-release.js", "shared/config/version.js", "status-classic.html", "version.json"]'))
          for name,data in files.items():
            dest=root/name
            assert dest.resolve().is_relative_to(root.resolve())
            dest.parent.mkdir(parents=True,exist_ok=True)
            dest.write_bytes(base64.b64decode(data,validate=True))
          (root/'1-version.json').unlink(missing_ok=True)
          (root/'.github/workflows/.github/workflows/prepare-tower206-once.yml').unlink(missing_ok=True)
          (root/'3-tower206-exact-files.json.gz').unlink()
          (root/'.github/workflows/prepare-tower206-once.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Apply exactly reviewed tower single-source release .206'
          git push
