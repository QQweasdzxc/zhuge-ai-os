name: Zhuge Canonical Pages Entry Release Gate

on:
  push:
    branches:
      - fix/pages-root-navigation-20261016
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-identity:
    name: Identity, Overlay, and source regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify formal main baseline and source diff
        run: |
          git fetch --no-tags origin main
          git diff --check origin/main...HEAD
          node tools/release-governance.js preflight
      - name: Verify native TaskFlow overlay and fail-closed dispatch
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s labs/taskflow/tests -v
          node --test tests/shared-navigation.test.js tests/taskflow-entry.test.js tests/taskflow-cli-sso.test.js
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Export CI Chromium path
        run: echo "BROWSER_EXECUTABLE=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Assemble and verify curated GitHub Pages site
        run: |
          node tools/build-pages-site.js "$RUNNER_TEMP/pages-site"
      - name: Build pinned MIT Habblaud Pixel Office into the ACTUAL Pages artifact
        run: |
          git init "$RUNNER_TEMP/zhuge-habblaud"
          git -C "$RUNNER_TEMP/zhuge-habblaud" remote add origin https://github.com/marmottajr/habblaud.git
          git -C "$RUNNER_TEMP/zhuge-habblaud" fetch --depth=1 origin faa1a012b5fbf632c66dc6801c5383e53a542406
          git -C "$RUNNER_TEMP/zhuge-habblaud" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/zhuge-habblaud" rev-parse HEAD)" = "faa1a012b5fbf632c66dc6801c5383e53a542406"
          npm ci --prefix "$RUNNER_TEMP/zhuge-habblaud" --ignore-scripts --no-audit --no-fund
          node integrations/habblaud/build.mjs "$RUNNER_TEMP/zhuge-habblaud" "$RUNNER_TEMP/pages-site"
          test -s "$RUNNER_TEMP/pages-site/pixel-office/index.html"
          test -s "$RUNNER_TEMP/pages-site/docs/pixel-office/index.html"
          test -s "$RUNNER_TEMP/pages-site/pixel-office/LICENSE.txt"
      - name: Verify complete curated artifact
        run: node tests/pages-publish-artifact.test.js "$RUNNER_TEMP/pages-site"
      - name: Run root source regression suite
        shell: bash
        run: |
          mapfile -d '' tests < <(find tests -maxdepth 1 -type f -name '*.test.js' ! -name 'pages-publish-artifact.test.js' -print0)
          if [ "${#tests[@]}" -eq 0 ]; then echo 'No root regression tests'; exit 1; fi
          node --test "${tests[@]}"

  browser:
    name: Desktop and Mobile browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Export CI Chromium path
        run: echo "BROWSER_EXECUTABLE=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - run: npm run test:browser

  fullsource:
    name: Governed FullSource package (no deploy)
    needs: [source-identity, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact clean source and verify archive
        run: |
          git fetch --no-tags origin main
          node tools/release-governance.js preflight
          node tools/release-governance.js package --type candidate --description Canonical-GitHub-Pages-TaskFlow-Entry --regression-json '{"governance":"PASS","checklist":"PASS","full":"PASS","gitDiffCheck":"PASS","browser":"PASS"}' --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: zhuge-pages-home-fullsource
          path: |
            dist/*FullSource-Candidate.zip
            dist/*FullSource-Candidate.zip.manifest.json
            dist/*FullSource-Candidate.zip.sha256
          if-no-files-found: error
          retention-days: 30
