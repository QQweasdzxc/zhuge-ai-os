name: Browser Regression

on:
  push:
    branches: [main, 'codex/**', 'review/navigation-only-release-20261023']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Playwright Chromium Desktop + Mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install pinned browser test dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Export CI Chromium path
        run: echo "BROWSER_EXECUTABLE=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Verify ZG-71 access migration on disposable PostgreSQL (no production calls)
        run: node --test tests/zg71-app-access-sql.test.js tests/zg71-rollback.test.cjs tests/app-access-phase1.test.js

      - name: Run all browser tests with no skip fallback
        run: npm run test:browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-evidence-${{ github.sha }}
          path: tests/evidence/
          if-no-files-found: ignore
          retention-days: 14

  edge-access:
    name: User JWT Edge Access (isolated fake RPC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/zg71-edge-enforcement.test.cjs tests/zg71-taskflow-boundary.test.cjs tests/zg71-live-compat-gates.test.js
