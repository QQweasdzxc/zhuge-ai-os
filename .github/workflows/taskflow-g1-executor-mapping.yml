name: TaskFlow G1 executor-mapping candidate (SUSPENDED)

# No secrets, environment, database connection, or candidate execution.
# The prior draft incorrectly targeted a protected schema. Existing gates
# rejected it before production execution. Replacement requires live
# taskflow schema compatibility, provenance-safe rollback and passing tests.
on:
  workflow_dispatch:

permissions: {}

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse all G1 execution pending corrected verification
        run: |
          echo 'G1_SUSPENDED: corrected schema and rollback verification required; no DB contact'
          exit 1
