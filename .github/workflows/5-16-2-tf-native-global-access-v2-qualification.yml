name: TF Native Global Access v2 Qualification
on:
  push:
    branches: ['review/tq6-native-qualification-20261111']
    paths: ['.github/workflows/*tf-native-global-access-v2-qualification.yml']
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.source.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compose exact live-base web candidate, no deploy
        id: source
        run: |
          set -euo pipefail
          test "$(sha256sum 3-16-1-tf-native-global-access-v2.patch | cut -d' ' -f1)" = 80966cfd949bc4022a16eec3aafca5d0aa35484a355e7c65ff3d511c93d82b32
          cp 3-16-1-tf-native-global-access-v2.patch /tmp/order.patch
          git switch --detach 41c535363845f5e72b1a8b4e845e8a183e3d0b6c
          git apply --check /tmp/order.patch
          git apply /tmp/order.patch
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/worklog/native labs/taskflow
          git commit -m 'Add native single global approval cards preserving current decisions'
          git push origin HEAD:refs/heads/review/tf-native-global-access-v2-candidate-20261113
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.compose.outputs.candidate }}
      - name: All TaskFlow overlay and boundary contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s labs/taskflow/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: WorkLog connection and service regressions
        run: node --test labs/taskflow/overrides/taskflow-access-service.test.mjs && npm ci && npm run test:worklog && node labs/taskflow/tests/worklog-server/statistics-check.mjs
      - name: Worker SQL and build safety
        working-directory: labs/taskflow/tests/worklog-server
        run: npm ci && npm run test:sql && npm run test:bundle
      - name: WorkLog view types
        working-directory: labs/taskflow/tests/worklog-browser
        run: npm ci && npx tsc --noEmit
  web:
    needs: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.compose.outputs.candidate }}
      - name: Full native Web build and existing regressions, no deployment
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain -f labs/taskflow/Dockerfile.web -t tf-order-web:qualification . 2>&1 | tee web-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tf-project-order-web-build
          path: web-build.log
  browser:
    needs: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.compose.outputs.candidate }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Direct add, retained reads, learning, queued sync and mutation regression on synthetic data
        working-directory: labs/taskflow/tests/worklog-browser
        shell: bash
        env:
          TQ6_TEST_CALENDAR_ENABLED: 'true'
        run: |
          set -euo pipefail
          npm ci
          npm run dev > /tmp/vite.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:4177/native.html > /tmp/fixture.html; then break; fi; sleep 1; done
          node access-native.cjs
          node task-dates.cjs
          node inline-calendar.cjs
          node mobile-suggestions.cjs
          node linked-delete.cjs
          node repeat-overtime.cjs
          node visible-range.cjs
          node direct-add.cjs
          node retained-read.cjs
          node background-sync.cjs
          node native-calendar.cjs
          node learning-parity.cjs
          node mutations.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tq6-direct-add-browser
          path: /downloads/*.png

  api-compose:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.api.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact live API base plus scalar whole-site lookup only
        id: api
        run: |
          set -euo pipefail
          test "$(sha256sum 4-17-1-tf-global-allow-api.patch | cut -d' ' -f1)" = f888c71a0cd0b01a6b0f787965132832d0310626325218bb5ff53b1e814243e4
          cp 4-17-1-tf-global-allow-api.patch /tmp/api.patch
          git switch --detach 044172fab110118d759aafc8bdd86903c457e49b
          git apply --check /tmp/api.patch
          git apply /tmp/api.patch
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labs/taskflow
          git commit -m 'Wire existing single global allow decision preserving live API features'
          git push origin HEAD:refs/heads/review/tf-global-allow-api-candidate-20261113
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  api:
    needs: api-compose
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.api-compose.outputs.candidate }}
      - name: Full backend contracts including eight whole-site allowance tests
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain -f labs/taskflow/Dockerfile.backend -t tf-global-allow-api:qualification . 2>&1 | tee api-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tf-global-allow-api-build
          path: api-build.log
