name: TQ6 Session Recovery Qualification
on:
  push:
    branches: ['review/tq6-native-qualification-20261111']
    paths: ['.github/workflows/*tq6-session-recovery-qualification.yml']
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.source.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compose exact live-base web candidate, no deploy
        id: source
        run: |
          set -euo pipefail
          test "$(sha256sum 2-1-tq6-session-recovery-v11.patch | cut -d' ' -f1)" = 4be343fe8b8a01418b72ece18b6a0cbf174a6fe47b59e01a62a0c6d8974a28ba
          cp 2-1-tq6-session-recovery-v11.patch /tmp/order.patch
          git switch --detach 0aa9219e8c16d360111bcdcf7d0ad57a94e4c7d1
          git apply --check /tmp/order.patch
          git apply /tmp/order.patch
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/worklog/native
          git commit -m 'Preserve WorkLog sessions through transient errors and serialize token refresh'
          git push origin HEAD:refs/heads/review/tq6-session-recovery-candidate-20261112
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.compose.outputs.candidate }}
      - name: All TaskFlow overlay and boundary contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s labs/taskflow/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: WorkLog connection and service regressions
        run: npm ci && npm run test:worklog
      - name: WorkLog view types
        working-directory: labs/taskflow/tests/worklog-browser
        run: npm ci && npx tsc --noEmit
  web:
    needs: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.compose.outputs.candidate }}
      - name: Full native Web build and existing regressions, no deployment
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain -f labs/taskflow/Dockerfile.web -t tf-order-web:qualification . 2>&1 | tee web-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tf-project-order-web-build
          path: web-build.log
