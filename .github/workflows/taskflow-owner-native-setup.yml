name: TF narrow owner native setup qualification
on:
  push:
    branches: ['review/tf-drive-qualification-20261110']
    paths: ['.github/workflows/taskflow-owner-native-setup.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      backend: ${{ steps.compose.outputs.backend }}
      web: ${{ steps.compose.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compose only approved setup-operation recognition
        id: compose
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch --detach 6cf2c9c0340d2bde64dd4226301db9489af4c7fb
          python3 - <<'PYCODE'
          import base64,json
          from pathlib import Path
          files=json.loads(base64.b64decode(''))
          for name,value in files.items():
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(value)
          PYCODE
          git diff --check
          git add labs/taskflow/patches
          git commit -m 'Allow explicitly gated same-origin native owner session for Drive setup only'
          git push origin HEAD:refs/heads/review/tf-drive-owner-native-api-20261110
          echo "backend=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git switch --detach 50ae08876f421b50b8866177db0b2e6ea507652e
          python3 - <<'PYCODE'
          import base64
          from pathlib import Path
          Path('labs/taskflow/overrides/taskflow-drive-connect-page.tsx').write_bytes(base64.b64decode(''))
          PYCODE
          git diff --check
          node labs/taskflow/tests/test-drive-owner-setup-page.cjs labs/taskflow/overrides/taskflow-drive-connect-page.tsx
          git add labs/taskflow/overrides/taskflow-drive-connect-page.tsx labs/taskflow/tests/test-drive-owner-setup-page.cjs
          git commit -m 'Use existing owner native login only for explicit Drive setup initiation'
          git push origin HEAD:refs/heads/review/tf-drive-owner-native-web-20261110
          echo "web=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  image:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            sha: ${{ needs.source.outputs.backend }}
          - image: web
            sha: ${{ needs.source.outputs.web }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
      - name: Build and execute native image gates without deployment or private credentials
        env:
          IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain -f "labs/taskflow/Dockerfile.$IMAGE" -t "tf-owner-$IMAGE:qualification" . 2>&1 | tee image-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-native-${{ matrix.image }}
          path: image-build.log
