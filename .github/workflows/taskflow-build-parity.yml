name: TaskFlow Build Parity

on:
  push:
    branches:
      - main
      - review/taskflow-issue-40-20261011
      - review/taskflow-desktop-login-20261012
      - review/taskflow-sidebar-project-nav-20261012
      - review/taskflow-issues-42-44-20261013
      - review/taskflow-issue-44-20261014
      - review/taskflow-issue-45-integrated-20261014
      - release/taskflow-ai-visible-20261016
      - review/dm00-dm03-taskflow-dispatch-20261020
      - review/dm00-dm03-core-runtime-20261020
      - review/dm00-dm03-phase2-dispatch-runtime-20261020
      - review/dm00-dm03-phase2-runtime-advance-20261020
      - review/dm00-dm03-phase2-runtime-hardening-20261020
      - review/co01-phase2-integration-20261020
      - review/issue-115-live-dispatch-20261021
      - review/p0-three-lane-integration-20261022
    paths:
      - "third_party/multica/**"
      - "labs/taskflow/**"
      - "shared/components/zhuge-navigation.js"
      - "tests/shared-navigation.test.js"
      - "tests/taskflow-entry*.test.js"
      - "tests/taskflow-cli-sso.test.js"
      - ".github/workflows/taskflow-build-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlay-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check patch whitespace
        run: git diff HEAD^ HEAD --check
      - name: Verify TaskFlow overlay and fail-closed patch contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s labs/taskflow/tests -v
      - name: Verify TaskFlow navigation and authenticated entry contract
        run: node --test tests/shared-navigation.test.js tests/taskflow-entry.test.js tests/taskflow-cli-sso.test.js
      - name: Verify Phase 2 runtime contracts
        run: node --test tests/taskflow-phase2-dispatch-runtime.test.mjs tests/taskflow-native-persistence-adapter.test.mjs tests/taskflow-pages-client-api.test.mjs tests/taskflow-phase2-runtime-read-model.test.mjs

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build TaskFlow backend from repository-root context
        shell: bash
        run: |
          set -o pipefail
          docker build --pull --progress=plain \
            -f labs/taskflow/Dockerfile.backend \
            -t taskflow-multica-backend:parity . 2>&1 | tee /tmp/taskflow-backend-build.log
          if grep -Eiq 'git clone https://github.com/multica-ai/multica([.]git)?' /tmp/taskflow-backend-build.log; then
            echo "Unexpected Multica application-source clone in backend build log" >&2
            exit 1
          fi
          grep -F "TASKFLOW_SOURCE_MODE=vendored SHA=8db6cfe19ae6fd5c35ec71bd8fea42a3ef3861ec; upstream application source clone=disabled" /tmp/taskflow-backend-build.log

  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build TaskFlow web from repository-root context
        shell: bash
        run: |
          set -o pipefail
          docker build --pull --progress=plain \
            -f labs/taskflow/Dockerfile.web \
            -t taskflow-multica-web:parity . 2>&1 | tee /tmp/taskflow-web-build.log
          if grep -Eiq 'git clone https://github.com/multica-ai/multica([.]git)?' /tmp/taskflow-web-build.log; then
            echo "Unexpected Multica application-source clone in web build log" >&2
            exit 1
          fi
          grep -F "TASKFLOW_SOURCE_MODE=vendored SHA=8db6cfe19ae6fd5c35ec71bd8fea42a3ef3861ec; upstream application source clone=disabled" /tmp/taskflow-web-build.log
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native dispatch component Browser QA (isolated API fixtures)
        shell: bash
        run: |
          set -euo pipefail
          docker build --target builder -f labs/taskflow/Dockerfile.web -t taskflow-native-qa:builder .
          docker create --name taskflow-native-qa -p 127.0.0.1:4173:4173 taskflow-native-qa:builder node /app/packages/views/dispatch-browser/start.mjs
          docker cp labs/taskflow/tests/native-dispatch-browser taskflow-native-qa:/app/packages/views/dispatch-browser
          docker start taskflow-native-qa
          npm ci
          npx playwright install --with-deps chromium
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 2
          done
          TASKFLOW_NATIVE_BROWSER_URL=http://127.0.0.1:4173 TASKFLOW_NATIVE_SCREENSHOTS=/tmp/native-dispatch-screenshots node --test tests/taskflow-native-dispatch-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-dispatch-browser-screenshots
          path: /tmp/native-dispatch-screenshots
          if-no-files-found: ignore

  backend-go-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: third_party/multica/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - name: Verify Go formatting
        run: |
          python3 ../../../labs/taskflow/patches/apply-taskflow-github-head-sha.py
          python3 ../../../labs/taskflow/patches/apply-taskflow-cto-dispatch-route.py
          cp ../../../labs/taskflow/overrides/taskflow_dispatch_authority.go internal/handler/taskflow_dispatch_authority.go
          cp ../../../labs/taskflow/overrides/taskflow_dispatch_authority_test.go internal/handler/taskflow_dispatch_authority_test.go
          cp ../../../labs/taskflow/overrides/taskflow_cto_dispatch.go internal/handler/taskflow_cto_dispatch.go
          cp ../../../labs/taskflow/overrides/taskflow_cto_dispatch_test.go internal/handler/taskflow_cto_dispatch_test.go
          cp ../../../labs/taskflow/overrides/taskflow_provider_dispatch.go internal/handler/taskflow_provider_dispatch.go
          cp ../../../labs/taskflow/overrides/taskflow_provider_dispatch_test.go internal/handler/taskflow_provider_dispatch_test.go
          cp ../../../labs/taskflow/overrides/taskflow_provider_route.go internal/handler/taskflow_provider_route.go
          cp ../../../labs/taskflow/overrides/taskflow_provider_route_test.go internal/handler/taskflow_provider_route_test.go
          cp ../../../labs/taskflow/overrides/taskflow_dispatch_runtime.go internal/handler/taskflow_dispatch_runtime.go
          cp ../../../labs/taskflow/overrides/taskflow_dispatch_runtime_test.go internal/handler/taskflow_dispatch_runtime_test.go
          gofmt -w internal/handler/github.go internal/handler/vcs_webhook.go
          gofmt -w internal/handler/taskflow_dispatch_authority.go internal/handler/taskflow_dispatch_authority_test.go
          gofmt -w internal/handler/taskflow_cto_dispatch.go internal/handler/taskflow_cto_dispatch_test.go
          gofmt -w internal/handler/taskflow_provider_dispatch.go internal/handler/taskflow_provider_dispatch_test.go
          gofmt -w internal/handler/taskflow_provider_route.go internal/handler/taskflow_provider_route_test.go
          gofmt -w internal/handler/taskflow_dispatch_runtime.go internal/handler/taskflow_dispatch_runtime_test.go
          test -z "$(gofmt -l internal/handler/github.go internal/handler/vcs_webhook.go internal/handler/taskflow_dispatch_authority.go internal/handler/taskflow_dispatch_authority_test.go internal/handler/taskflow_cto_dispatch.go internal/handler/taskflow_cto_dispatch_test.go internal/handler/taskflow_dispatch_runtime.go internal/handler/taskflow_dispatch_runtime_test.go)"
      - name: Run backend tests
        run: CGO_ENABLED=0 go test ./...
      - name: Build backend binaries
        run: |
          CGO_ENABLED=0 go build ./cmd/server
          CGO_ENABLED=0 go build ./cmd/multica

  postgres-native-authority:
    name: PostgreSQL 16 Native Authority integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Run assertive PostgreSQL 16 isolation tests
        run: python3 -B labs/taskflow/tests/test_native_dispatch_authority_postgres.py

  issue42-install-runner:
    name: Issue 42 one-shot runner PostgreSQL 16 runtime
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch and assert the reviewed SQL commit
        run: |
          git fetch --no-tags origin 50b716e38fe2703607fe19880f60c298c7af1bac
          test "$(git cat-file -t 50b716e38fe2703607fe19880f60c298c7af1bac)" = commit
      - name: Create isolated migrator fixture and preserve runtime ACL baseline
        env:
          PGPASSWORD: ci-test
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE taskflow_migrator LOGIN PASSWORD 'migrator-ci';
          CREATE ROLE taskflow_runtime LOGIN PASSWORD 'runtime-ci';
          CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA extensions;
          GRANT USAGE ON SCHEMA extensions TO taskflow_migrator;
          CREATE SCHEMA taskflow AUTHORIZATION taskflow_migrator;
          GRANT USAGE ON SCHEMA taskflow TO postgres, taskflow_runtime;
          GRANT USAGE, CREATE ON SCHEMA taskflow TO taskflow_migrator;
          CREATE TABLE taskflow.issue (id uuid primary key, workspace_id uuid);
          ALTER TABLE taskflow.issue OWNER TO taskflow_migrator;
          GRANT INSERT, UPDATE ON taskflow.issue TO taskflow_runtime;
          SQL
          cat > "$RUNNER_TEMP/pg_service.conf" <<'EOF'
          [taskflow_migrator]
          host=127.0.0.1
          port=5432
          dbname=postgres
          user=taskflow_migrator
          password=migrator-ci
          options=-c search_path=taskflow,extensions
          EOF
      - name: Execute the real SHA-locked runner (no other migrations)
        env:
          TASKFLOW_MIGRATION_PG_SERVICE: taskflow_migrator
          PGSERVICEFILE: ${{ runner.temp }}/pg_service.conf
        run: sh labs/taskflow/overrides/issue42-install-once.sh
      - name: Verify wrong identity, wrong SHA and permission failures
        env:
          PGSERVICEFILE: ${{ runner.temp }}/pg_service.conf
          TASKFLOW_MIGRATION_PG_SERVICE: taskflow_migrator
        run: |
          sed 's/50b716e38fe2703607fe19880f60c298c7af1bac/0000000000000000000000000000000000000000/' labs/taskflow/overrides/issue42-install-once.sh > "$RUNNER_TEMP/wrong-sha.sh"
          ! sh "$RUNNER_TEMP/wrong-sha.sh"
          cat > "$RUNNER_TEMP/postgres.service" <<'EOF'
          [postgres]
          host=127.0.0.1
          port=5432
          dbname=postgres
          user=postgres
          password=ci-test
          options=-c search_path=taskflow,extensions
          EOF
          ! env TASKFLOW_MIGRATION_PG_SERVICE=postgres PGSERVICEFILE="$RUNNER_TEMP/postgres.service" sh labs/taskflow/overrides/issue42-install-once.sh
          PGPASSWORD=ci-test psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'REVOKE CREATE ON SCHEMA taskflow FROM taskflow_migrator'
          ! sh labs/taskflow/overrides/issue42-install-once.sh
          PGPASSWORD=ci-test psql -h 127.0.0.1 -U postgres -d postgres -c 'GRANT CREATE ON SCHEMA taskflow TO taskflow_migrator'
      - name: Assert installation created no Issue card
        env:
          PGPASSWORD: ci-test
        run: |
          test "$(psql -h 127.0.0.1 -U postgres -d postgres -Atc 'SELECT count(*) FROM taskflow.issue')" = 0
          test "$(psql -h 127.0.0.1 -U postgres -d postgres -Atc 'SELECT count(*) FROM taskflow.sb_connector_issue_request')" = 0
