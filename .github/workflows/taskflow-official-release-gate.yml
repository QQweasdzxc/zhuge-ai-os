name: TaskFlow Official Site Release Gate

on:
  push:
    branches:
      - release/taskflow-ai-visible-20261016
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact reviewed candidate SHA (must be .9.148)'
        required: true
        default: a4a6a15d836ddd790d65d1a36eacc433e9dcb460
        type: string

permissions:
  contents: read

# Production SQL is deliberately isolated from the normal release jobs. It can
# only run by an operator selecting the protected production-migration
# environment; push, PR, and ordinary release runs never invoke it.
jobs:
  source-identity:
    name: Identity, Overlay, and source regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify formal main baseline and source diff
        run: |
          git fetch --no-tags origin main
          git diff --check origin/main...HEAD
          node tools/release-governance.js preflight
      - name: Verify native TaskFlow overlay and fail-closed dispatch
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s labs/taskflow/tests -v
          node --test tests/shared-navigation.test.js tests/taskflow-entry.test.js tests/taskflow-cli-sso.test.js
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Export CI Chromium path
        run: echo "BROWSER_EXECUTABLE=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Run root source regression suite
        shell: bash
        run: |
          mapfile -d '' tests < <(find tests -maxdepth 1 -type f -name '*.test.js' ! -name 'pages-publish-artifact.test.js' -print0)
          if [ "${#tests[@]}" -eq 0 ]; then echo 'No root regression tests'; exit 1; fi
          node --test "${tests[@]}"

  browser:
    name: Desktop and Mobile browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Export CI Chromium path
        run: echo "BROWSER_EXECUTABLE=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - run: npm run test:browser

  fullsource:
    name: Governed FullSource package (no deploy)
    needs: [source-identity, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact clean source and verify archive
        run: |
          git fetch --no-tags origin main
          node tools/release-governance.js preflight
          node tools/release-governance.js package --type candidate --description TaskFlow-AI-Panel-Visible --regression-json '{"governance":"PASS","checklist":"PASS","full":"PASS","gitDiffCheck":"PASS","browser":"PASS"}' --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: taskflow-official-fullsource
          path: |
            dist/*FullSource-Candidate.zip
            dist/*FullSource-Candidate.zip.manifest.json
            dist/*FullSource-Candidate.zip.sha256
          if-no-files-found: error
          retention-days: 30

  issue42-production-install:
    name: Issue #42 production INSTALL ONLY (manual, protected)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha == 'a4a6a15d836ddd790d65d1a36eacc433e9dcb460' }}
    environment:
      name: production-migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify exact source and reviewed SQL
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$CANDIDATE_SHA" = "a4a6a15d836ddd790d65d1a36eacc433e9dcb460"
          test "$(git cat-file -t 50b716e38fe2703607fe19880f60c298c7af1bac)" = commit
          test "$(git hash-object labs/taskflow/sql/issue42_connector_create_issue_candidate.sql)" = "$(git rev-parse 50b716e38fe2703607fe19880f60c298c7af1bac:labs/taskflow/sql/issue42_connector_create_issue_candidate.sql)"

      - name: Verify psql and inject protected service file
        env:
          MIGRATION_SERVICE: ${{ secrets.TASKFLOW_MIGRATION_PG_SERVICE }}
          MIGRATION_SERVICE_FILE: ${{ secrets.TASKFLOW_MIGRATION_PGSERVICEFILE_CONTENT }}
        run: |
          command -v psql
          test -n "$MIGRATION_SERVICE"
          test -n "$MIGRATION_SERVICE_FILE"
          service_file="$RUNNER_TEMP/taskflow-migrator.pgservice"
          umask 077
          printf '%s' "$MIGRATION_SERVICE_FILE" > "$service_file"
          test "$(stat -c '%a' "$service_file")" = 600
          {
            echo "PGSERVICEFILE=$service_file"
            echo "TASKFLOW_MIGRATION_PG_SERVICE=$MIGRATION_SERVICE"
          } >> "$GITHUB_ENV"
          unset MIGRATION_SERVICE MIGRATION_SERVICE_FILE

      - name: Verify migrator identity before install
        run: |
          psql -X -v ON_ERROR_STOP=1 -Atc "SELECT CASE WHEN session_user='taskflow_migrator' AND current_user='taskflow_migrator' THEN 'IDENTITY_OK' ELSE 'IDENTITY_REJECTED' END" | grep -qx IDENTITY_OK

      - name: Run SHA-locked Issue #42 INSTALL ONLY runner
        run: sh labs/taskflow/overrides/issue42-install-once.sh
