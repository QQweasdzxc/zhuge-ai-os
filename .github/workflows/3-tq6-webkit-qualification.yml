name: TQ6 WebKit Fix Qualification
on:
  push:
    branches: ['review/tq6-native-qualification-20261111']
    paths: ['.github/workflows/*tq6-webkit-qualification.yml']
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.source.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compose exact pinned candidate without deployment
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum 2-tq6-webkit-fetch-fix.patch | cut -d' ' -f1)" = b18f25ccb2edead9e51d0378156f7b798428f8b19f82c381ec3febb6c7b2aeca
          cp 2-tq6-webkit-fetch-fix.patch /tmp/tq6.patch
          git switch --detach 011b73f63826f8b480630ebdcec6763b63a6ed5a
          git apply --check /tmp/tq6.patch
          git apply /tmp/tq6.patch
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labs/taskflow modules/worklog/native supabase/functions/worklog-google-sync package.json package-lock.json
          git commit -m 'Fix WorkLog native fetch receiver for WebKit callbacks'
          git push origin HEAD:refs/heads/review/tq6-native-candidate-v4-webkit-20261111
          echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.compose.outputs.candidate }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unchanged TaskFlow schema boundary and overlay contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s labs/taskflow/tests -v
      - name: WorkLog owner-bound service and sync contracts
        run: npm ci && npm run test:worklog
      - name: Isolated original WorkLog worker SQL and bundle gates
        working-directory: labs/taskflow/tests/worklog-server
        run: npm ci && npm run test:sql && npm run test:bundle && node --check /tmp/tq6-worklog-worker-bundle.mjs
      - name: Native WorkLog view types
        working-directory: labs/taskflow/tests/worklog-browser
        run: npm ci && npx tsc --noEmit
  web:
    needs: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.compose.outputs.candidate }}
      - name: Full native web Docker build, no deployment
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain -f labs/taskflow/Dockerfile.web -t tq6-web:qualification . 2>&1 | tee web-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tq6-web-build
          path: web-build.log
  backend:
    needs: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.compose.outputs.candidate }}
      - name: Full native baseline API Docker build, production API remains pinned
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain -f labs/taskflow/Dockerfile.backend -t tq6-api:qualification . 2>&1 | tee backend-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tq6-backend-build
          path: backend-build.log
