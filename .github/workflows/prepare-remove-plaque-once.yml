name: Prepare exact reviewed plaque removal
on:
  push:
    branches: [review/remove-investment-plaque-211-20261118]
    paths: [.github/workflows/prepare-remove-plaque-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed removal and release identity only
        run: |
          test "$(git merge-base HEAD origin/main)" = "d18fe6a71371c5d8a3491e4824d1f9ce62b803c2"
          python3 - <<'PYFILES'
          import pathlib,json,gzip,base64,hashlib
          inputs=list(pathlib.Path('.').glob('*remove-investment-plaque211-exact.json.gz'))
          assert len(inputs)==1
          p=inputs[0]
          b=p.read_bytes()
          assert hashlib.sha256(b).hexdigest()=='b0dc67275bfe7180644cbd3f882a2dd26bfa405c26d00e0be61ab9de4fb06308'
          files=json.loads(gzip.decompress(b))
          assert set(files)=={'app/Board/template-preview/index.html', 'index.html', 'status-classic.html', 'version.json', 'app/Board/procurement/index.html', 'shared/config/version.js', 'modules/investment/index.html', 'modules/skyeye/index.html', 'shared/config/template-release.js', 'app/Board/worktodo/index.html', 'tests/investment/island-entry.test.cjs', 'app/Board/investment/index.html', 'docs/index.html', 'app/Board/ai/index.html', 'modules/worklog/chat/index.html', 'labs/investment/version.json', 'labs/taskflow/index.html', 'modules/worklog/version.json', 'modules/investment/version.json', 'docs/status-classic.html', 'shared/app-config.js', 'app/dashboard/index.html', 'apps/learning-archipelago-entry/island-world.js', 'labs/investment/src/portfolio/view.mjs', 'modules/worklog/index.html', 'labs/investment/index.html', 'labs/investment/app.js', 'app/dashboard/zhuge-dashboard.js'}
          for n,v in files.items():
            q=pathlib.Path(n)
            assert q.resolve().is_relative_to(pathlib.Path('.').resolve())
            if n.startswith('.github/'):
              assert q.read_bytes()==base64.b64decode(v,validate=True)
              continue
            q.write_bytes(base64.b64decode(v,validate=True))
          p.unlink()
          PYFILES
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Apply reviewed plaque removal and release identity 211'
          git push origin HEAD:review/remove-investment-plaque-211-20261118
