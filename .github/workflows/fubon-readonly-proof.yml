name: Fubon Read-only Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Fubon SDK read-only proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: fubon-readonly-proof
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up supported Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pinned proof dependency
        run: npm ci --ignore-scripts --prefix tools/fubon-readonly-adapter

      - name: Run adapter contract tests
        run: npm test --prefix tools/fubon-readonly-adapter

      - name: Execute sanitized read-only proof
        env:
          FUBON_API_PERSONAL_ID: ${{ secrets.FUBON_API_PERSONAL_ID }}
          FUBON_API_KEY: ${{ secrets.FUBON_API_KEY }}
          FUBON_CERT_PASSWORD: ${{ secrets.FUBON_CERT_PASSWORD }}
          FUBON_CERT_FILE_BASE64: ${{ secrets.FUBON_CERT_FILE_BASE64 }}
        run: |
          set -euo pipefail
          result_file="${RUNNER_TEMP}/fubon-proof-result.json"
          stderr_file="${RUNNER_TEMP}/fubon-proof-stderr.log"
          cleanup() {
            rm -f "$result_file" "$stderr_file"
          }
          trap cleanup EXIT

          set +e
          node tools/fubon-readonly-adapter/src/cli.mjs >"$result_file" 2>"$stderr_file"
          adapter_status=$?
          set -e

          node tools/fubon-readonly-adapter/scripts/validate-proof-output.mjs "$result_file"
          guard_status=$?

          if [ "$adapter_status" -ne 0 ]; then
            exit "$adapter_status"
          fi
          exit "$guard_status"
