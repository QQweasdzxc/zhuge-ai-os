name: Pixel P1 Furnishings Formal Review Identity Prepare
on:
  push:
    branches:
      - review/pixel-office-furnishings-p1-20261018
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: One-time new Version and Build with Published C preservation
        shell: bash
        run: |
          set -euo pipefail
          if test "$(node -p 'require("./version.json").version')" = "0.9.0-alpha.9.75"; then
            node tools/release-governance.js preflight
            echo "P1_ALREADY_PREPARED"
            exit 0
          fi
          node tools/prepare-pixel-furnishings-release.mjs
          git diff --check
          git config user.name "zhuge-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore(release): formal P1 Pixel Furnishings 0.9.0-alpha.9.75 new Build"
          git push origin HEAD:refs/heads/review/pixel-office-furnishings-p1-20261018
