name: TaskFlow STEP1 dispatch-authority candidate

# Execution contract (security-reviewed):
# - workflow_dispatch only, environment production-migration (human approval
#   gate; never self-approved).
# - expected_sha must name the exact reviewed commit; SQL file contents are
#   additionally pinned by sha256 below. Drift aborts before any DB contact.
# - taskflow_migration_role_guard.sql runs before EVERY action path and fails
#   closed at the database layer (RAISE) unless the connection is the
#   restricted taskflow_migrator owner of the taskflow schema.
# - The pre-change backup never leaves the project's own trust domain: the
#   full taskflow schema dump is gzip+base64 stored as rows in the in-project
#   taskflow.step1_schema_backup tables owned by taskflow_migrator (no Actions
#   artifact, no external audience, survives the runner; migrator-owned so no
#   database-level CREATE and no runtime grant are needed). Restore = SELECT lines -> base64
#   -d -> gunzip -> psql replay; round-trip proven locally on PG17.
#   Encryption is deferred per user decision 2026-10-27 16:02.
# - Raw psql/libpq output, the pg_service file, and the plaintext dump are
#   never printed to logs or uploaded; runner-local copies are shredded in an
#   always-step.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'STEP1 action'
        required: true
        type: choice
        options:
          - backup+apply+postflight
          - backup-only
          - postflight-only
          - rollback-guarded
          - diagnose-only
      expected_sha:
        description: 'Reviewed commit SHA this run is approved to execute'
        required: true
        type: string

permissions: {}

env:
  PIN_CANDIDATE_SHA256: e5c72aa39e059ab7daf0c314d33160752f8f1330a27c54ea5d89056986735949
  PIN_ROLLBACK_SHA256: 7f7e64036d65cff1a6d312454bf1479f9f4e1e72990342ea5bfb9215e95a7644
  PIN_POSTFLIGHT_SHA256: fc8ed653fff94d2476bf979dd70eae7c465ee72877fa9b93ebca3246ea192d62
  PIN_GUARD_SHA256: 16bac864b32eb8e62c0413831408dfeacd2f13c9a7caf43f324a675680e359db
  PIN_CA_SHA256: 700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7

jobs:
  step1-candidate:
    runs-on: ubuntu-latest
    environment: production-migration
    steps:
      - name: Anchor run to the reviewed commit (before any secret or DB use)
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          case "$EXPECTED_SHA" in
            *[!0-9a-f]*|"") echo "expected_sha must be 40 lowercase hex"; exit 1 ;;
          esac
          if [ "${#EXPECTED_SHA}" -ne 40 ]; then echo "expected_sha must be 40 hex chars"; exit 1; fi
          if [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
            echo "run head ($GITHUB_SHA) is not the reviewed commit; aborting before any secret or DB use"
            exit 1
          fi
          echo "run anchored to reviewed commit $GITHUB_SHA"

      - name: Check out the reviewed commit only
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Verify pinned SQL contents
        run: |
          set -euo pipefail
          cd labs/taskflow/sql
          echo "$PIN_GUARD_SHA256  taskflow_migration_role_guard.sql" | sha256sum -c -
          echo "$PIN_CA_SHA256  ../certs/supabase-prod-ca-2021.crt" | sha256sum -c -
          echo "$PIN_CANDIDATE_SHA256  taskflow_native_dispatch_authority_candidate.sql" | sha256sum -c -
          echo "$PIN_ROLLBACK_SHA256  taskflow_native_dispatch_authority_rollback.sql" | sha256sum -c -
          echo "$PIN_POSTFLIGHT_SHA256  taskflow_native_dispatch_authority_postflight.sql" | sha256sum -c -

      - name: Install PostgreSQL 17 client (prod server_version=17.6)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 || {
            echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client-17
          } >/dev/null
          psql --version; pg_dump --version

      - name: Write one-shot migrator pg_service file (never printed)
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${{ secrets.TASKFLOW_MIGRATION_PGSERVICEFILE_CONTENT }}" > "$RUNNER_TEMP/pg_service.conf.raw"
          test -s "$RUNNER_TEMP/pg_service.conf.raw"
          echo "PGSERVICEFILE=$RUNNER_TEMP/pg_service.conf" >> "$GITHUB_ENV"
          echo "PGSERVICE=${{ secrets.TASKFLOW_MIGRATION_PG_SERVICE }}" >> "$GITHUB_ENV"
          RAWC="$RUNNER_TEMP/pg_service.conf.raw"
          # Structural facts about the original secret: booleans/counts only, never
          # values, lengths of values, or hashes. Lets diagnosis distinguish our own
          # parsing defects from a user-side malformed secret without a new round.
          CRLF=no; grep -q "$(printf '\r')" "$RAWC" && CRLF=yes
          LEADWS=no; grep -qE '^[[:space:]]+[A-Za-z_]+=' "$RAWC" && LEADWS=yes
          NPW=$(sed -n 's/^[[:space:]]*password=.*/x/p' "$RAWC" | wc -l)
          DUPPW=no; [ "$NPW" -gt 1 ] && DUPPW=yes
          echo "structure-original: crlf=$CRLF leading_ws_keys=$LEADWS password_key_count=$NPW dup_password_key=$DUPPW"
          # libpq treats CR as a line terminator and tolerates leading whitespace on
          # key lines and trailing whitespace in values; normalize CR and extract
          # with the same tolerance so this pipeline sees the file libpq parses.
          tr -d '\r' < "$RAWC" > "$RUNNER_TEMP/pg_service.conf"
          shred -u "$RAWC" 2>/dev/null || rm -f "$RAWC"
          CONF="$RUNNER_TEMP/pg_service.conf"
          getval() { sed -n "s/^[[:space:]]*$2=//p" "$1" | head -1 | sed 's/[[:space:]]*$//'; }
          SSLMODE=$(getval "$CONF" sslmode)
          ROOTCERT=$(getval "$CONF" sslrootcert)
          SSLCERT=$(getval "$CONF" sslcert)
          SSLKEY=$(getval "$CONF" sslkey)
          PASS=$(getval "$CONF" password)
          PWPRESENT=no; [ "$NPW" -ge 1 ] && PWPRESENT=yes
          PWNONEMPTY=no; [ -n "$PASS" ] && PWNONEMPTY=yes
          ULINE=$(getval "$CONF" user)
          UREF=no; printf '%s' "$ULINE" | grep -q '\.' && UREF=yes
          echo "structure-keys: password_present=$PWPRESENT password_nonempty=$PWNONEMPTY user_has_ref_suffix=$UREF"
          unset ULINE
          echo "service-config-original: sslmode=${SSLMODE:-absent} sslrootcert=$([ -n "$ROOTCERT" ] && echo present || echo absent) sslcert=$([ -n "$SSLCERT" ] && echo present || echo absent) sslkey=$([ -n "$SSLKEY" ] && echo present || echo absent)"
          ORIG_HOST=$(getval "$CONF" host)
          if [ -n "$ORIG_HOST" ] && ! getent ahostsv4 "$ORIG_HOST" >/dev/null 2>&1; then
            REF=$(printf '%s' "$ORIG_HOST" | sed -n 's/^db\.\([a-z0-9]*\)\.supabase\.co$/\1/p')
            if [ -z "$REF" ]; then
              echo "connectivity-rewrite: no IPv4 route and host is not a db.<ref>.supabase.co direct host; cannot derive pooler user suffix"
              unset PASS
              exit 1
            fi
            ORIG_USER=$(getval "$CONF" user); ORIG_USER=${ORIG_USER%%.*}
            DB=$(getval "$CONF" dbname); DB=${DB:-postgres}
            SVC=$(sed -n 's/^[[:space:]]*\[\(.*\)\][[:space:]]*$/\1/p' "$CONF" | head -1)
            umask 077
            {
              printf '[%s]\n' "$SVC"
              printf 'host=%s\n' 'aws-1-ap-northeast-2.pooler.supabase.com'
              printf 'port=5432\n'
              printf 'user=%s.%s\n' "$ORIG_USER" "$REF"
              printf 'dbname=%s\n' "$DB"
              printf 'password=%s\n' "$PASS"
              printf 'sslmode=verify-full\n'
              printf 'sslrootcert=%s\n' "$GITHUB_WORKSPACE/labs/taskflow/certs/supabase-prod-ca-2021.crt"
              # Preserve any original client-certificate requirement; we do not
              # know whether the server demands it and must not silently drop it.
              [ -n "$SSLCERT" ] && printf 'sslcert=%s\n' "$SSLCERT"
              [ -n "$SSLKEY" ] && printf 'sslkey=%s\n' "$SSLKEY"
            } > "$CONF"
            unset PASS
            echo "service file rewritten to the project's IPv4 session pooler (values withheld)"
          fi
          unset PASS
          SSLMODE2=$(getval "$CONF" sslmode)
          RC2=$(getval "$CONF" sslrootcert)
          SC2=$(getval "$CONF" sslcert)
          SK2=$(getval "$CONF" sslkey)
          echo "service-config-effective: sslmode=${SSLMODE2:-absent} sslrootcert=$([ -n "$RC2" ] && echo present || echo absent) sslcert=$([ -n "$SC2" ] && echo present || echo absent) sslkey=$([ -n "$SK2" ] && echo present || echo absent)"
          unset ROOTCERT SSLCERT SSLKEY SSLMODE2 RC2 SC2 SK2

      - name: Masked connectivity preflight (categories only; never prints host/user/secret values)
        run: |
          set -euo pipefail
          CONF="$RUNNER_TEMP/pg_service.conf"
          HOST=$(sed -n 's/^host=//p' "$CONF" | head -1)
          PORT=$(sed -n 's/^port=//p' "$CONF" | head -1); PORT=${PORT:-5432}
          if [ -z "$HOST" ]; then echo "preflight: service-file=missing-host"; exit 1; fi
          if getent ahostsv4 "$HOST" >/dev/null 2>&1; then V4=yes; else V4=no; fi
          if getent ahostsv6 "$HOST" >/dev/null 2>&1; then V6=yes; else V6=no; fi
          TCP=unknown
          if timeout 8 bash -c "cat </dev/null >/dev/tcp/'$HOST'/'$PORT'" 2>"$RUNNER_TEMP/tcp.err"; then TCP=ok
          elif grep -qi 'refused' "$RUNNER_TEMP/tcp.err"; then TCP=refused
          elif grep -qi 'unreachable\|no route' "$RUNNER_TEMP/tcp.err"; then TCP=unreachable
          else TCP=timeout-or-other; fi
          CLASS=other
          ERR=$(psql "service=$PGSERVICE" -Atc 'SELECT 1' 2>&1 >/dev/null) || true
          if [ -z "$ERR" ]; then CLASS=ok
          elif printf '%s' "$ERR" | grep -qi 'could not translate host name'; then CLASS=dns
          elif printf '%s' "$ERR" | grep -qi 'network is unreachable\|no route to host'; then CLASS=unreachable
          elif printf '%s' "$ERR" | grep -qi 'connection refused'; then CLASS=refused
          elif printf '%s' "$ERR" | grep -qi 'password authentication failed'; then CLASS=auth
          elif printf '%s' "$ERR" | grep -qi 'definition of service\|no pg_service'; then CLASS=service-name
          elif printf '%s' "$ERR" | grep -qi 'root certificate file'; then CLASS=rootcert-missing
          elif printf '%s' "$ERR" | grep -qi 'certificate verify failed'; then CLASS=cert-verify
          elif printf '%s' "$ERR" | grep -qi 'SSL connection is required'; then CLASS=ssl-required
          elif printf '%s' "$ERR" | grep -qi 'no tenant identifier'; then CLASS=tenant
          elif printf '%s' "$ERR" | grep -qi 'ssl\|certificate'; then CLASS=tls-other
          elif printf '%s' "$ERR" | grep -qi 'timeout\|timed out'; then CLASS=timeout
          fi
          unset ERR
          echo "preflight: ipv4=$V4 ipv6=$V6 tcp=$TCP db-probe=$CLASS"

      - name: Extended masked diagnostics (diagnose-only; allow-listed classes only)
        if: inputs.action == 'diagnose-only'
        run: |
          set -euo pipefail
          # Fixed allow-list classifier: emits class labels only, never raw or
          # "redacted" libpq text (substitution cannot cover every secret shape).
          # Raw stderr stays in shell variables and is unset before step end.
          classify() {
            local t="$1" out=""
            printf '%s' "$t" | grep -qi 'could not translate host name' && out="$out,dns"
            printf '%s' "$t" | grep -qi 'network is unreachable\|no route to host' && out="$out,unreachable"
            printf '%s' "$t" | grep -qi 'connection refused' && out="$out,refused"
            printf '%s' "$t" | grep -qi 'timeout\|timed out' && out="$out,timeout"
            printf '%s' "$t" | grep -qi 'root certificate file' && out="$out,rootcert_missing"
            printf '%s' "$t" | grep -qi 'certificate verify failed\|unable to get local issuer\|self-signed certificate\|certificate has expired\|not yet valid' && out="$out,cert_verify_failed"
            printf '%s' "$t" | grep -qi 'does not match host name\|server certificate for .* does not match' && out="$out,hostname_mismatch"
            printf '%s' "$t" | grep -qi 'valid client certificate' && out="$out,clientcert_missing"
            printf '%s' "$t" | grep -qi 'could not open certificate file' && out="$out,clientcert_unreadable"
            printf '%s' "$t" | grep -qi 'SSL connection is required' && out="$out,ssl_required"
            printf '%s' "$t" | grep -qi 'does not support SSL' && out="$out,ssl_unsupported"
            printf '%s' "$t" | grep -qi 'password authentication failed' && out="$out,pwd_auth_failed"
            printf '%s' "$t" | grep -qi 'no password supplied' && out="$out,no_password_supplied"
            printf '%s' "$t" | grep -qi 'SASL' && out="$out,sasl_error"
            printf '%s' "$t" | grep -qi 'authentication failed' && printf '%s' "$t" | grep -qvi 'password authentication failed' && out="$out,auth_failed_other"
            printf '%s' "$t" | grep -qi 'no tenant identifier\|Tenant or user not found' && out="$out,tenant"
            printf '%s' "$t" | grep -qi 'definition of service\|no pg_service' && out="$out,service_name"
            printf '%s' "$t" | grep -q 'ERROR:' && out="$out,db_raised_error"
            if [ -z "$out" ]; then echo "unknown"; else echo "${out#,}"; fi
          }
          ERR=$(psql "service=$PGSERVICE" -Atc 'SELECT 1' 2>&1 >/dev/null) && DRC=0 || DRC=$?
          if [ "$DRC" -eq 0 ]; then
            echo "diagnose db-probe: ok"
            ROLE_OUT=$(psql "service=$PGSERVICE" -Atc 'SELECT current_user' 2>/dev/null || true)
            if [ "$ROLE_OUT" = "taskflow_migrator" ]; then echo "diagnose role: matches-expected=yes"
            elif [ -n "$ROLE_OUT" ]; then echo "diagnose role: matches-expected=no"
            else echo "diagnose role: matches-expected=unknown"; fi
            unset ROLE_OUT
            SSL_OUT=$(psql "service=$PGSERVICE" -Atc 'SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()' 2>/dev/null || true)
            case "$SSL_OUT" in
              t) echo "diagnose ssl: in-use=yes" ;;
              f) echo "diagnose ssl: in-use=no" ;;
              *) echo "diagnose ssl: in-use=unknown" ;;
            esac
            unset SSL_OUT
          else
            echo "diagnose db-probe: failed exit=$DRC classes=$(classify "$ERR")"
          fi
          unset ERR
          GERR=$(psql "service=$PGSERVICE" -v ON_ERROR_STOP=1 -q \
            -f labs/taskflow/sql/taskflow_migration_role_guard.sql 2>&1 >/dev/null) && GRC=0 || GRC=$?
          if [ "$GRC" -eq 0 ]; then
            echo "diagnose role-guard: pass"
          else
            echo "diagnose role-guard: failed exit=$GRC classes=$(classify "$GERR")"
          fi
          unset GERR

      - name: Database-side role guard (fails closed; required for every action)
        if: inputs.action != 'diagnose-only'
        run: |
          set -euo pipefail
          psql "service=$PGSERVICE" -v ON_ERROR_STOP=1 -q \
            -f labs/taskflow/sql/taskflow_migration_role_guard.sql 2>"$RUNNER_TEMP/guard.err" \
            || { echo "role guard failed (details withheld from public logs)"; exit 1; }
          echo "role guard passed: restricted taskflow_migrator owning taskflow schema"

      - name: Pre-change in-project backup (full taskflow schema; same trust domain)
        if: inputs.action == 'backup+apply+postflight' || inputs.action == 'backup-only'
        run: |
          set -euo pipefail
          pg_dump "service=$PGSERVICE" --schema=taskflow \
            --exclude-table=taskflow.step1_schema_backup \
            --exclude-table=taskflow.step1_schema_backup_meta \
            --file="$RUNNER_TEMP/backup.sql" 2>"$RUNNER_TEMP/dump.err" \
            || { echo "pg_dump failed (details withheld from public logs)"; exit 1; }
          HASH=$(sha256sum "$RUNNER_TEMP/backup.sql" | awk '{print $1}')
          gzip -9 -c "$RUNNER_TEMP/backup.sql" > "$RUNNER_TEMP/backup.sql.gz"
          GZSIZE=$(wc -c < "$RUNNER_TEMP/backup.sql.gz")
          psql "service=$PGSERVICE" -v ON_ERROR_STOP=1 -q 2>"$RUNNER_TEMP/backup.err" <<'SQL' \
            || { echo "backup store DDL failed (details withheld)"; exit 1; }
          CREATE TABLE IF NOT EXISTS taskflow.step1_schema_backup (
            dump_id bigint NOT NULL, line_no integer NOT NULL, line text NOT NULL,
            PRIMARY KEY (dump_id, line_no)
          );
          CREATE TABLE IF NOT EXISTS taskflow.step1_schema_backup_meta (
            dump_id bigint PRIMARY KEY, taken_at timestamptz NOT NULL DEFAULT now(),
            sha256 text NOT NULL, gz_bytes bigint NOT NULL, note text NOT NULL
          );
          REVOKE ALL ON taskflow.step1_schema_backup FROM PUBLIC;
          REVOKE ALL ON taskflow.step1_schema_backup_meta FROM PUBLIC;
          DO $backup_acl$
          DECLARE g text;
          BEGIN
            FOR g IN SELECT DISTINCT CASE WHEN ac.grantee = 0 THEN 'PUBLIC' ELSE ac.grantee::regrole::text END
                     FROM pg_class c
                     JOIN pg_namespace n ON n.oid = c.relnamespace,
                     aclexplode(c.relacl) ac
                     WHERE n.nspname = 'taskflow'
                       AND c.relname IN ('step1_schema_backup','step1_schema_backup_meta')
                       AND ac.grantee <> 'taskflow_migrator'::regrole LOOP
              IF g = 'PUBLIC' THEN
                EXECUTE 'REVOKE ALL ON taskflow.step1_schema_backup FROM PUBLIC';
                EXECUTE 'REVOKE ALL ON taskflow.step1_schema_backup_meta FROM PUBLIC';
              ELSE
                EXECUTE format('REVOKE ALL ON taskflow.step1_schema_backup FROM %I', g);
                EXECUTE format('REVOKE ALL ON taskflow.step1_schema_backup_meta FROM %I', g);
              END IF;
            END LOOP;
          END $backup_acl$;
          SQL
          DUMP_ID=$(psql "service=$PGSERVICE" -Atc "SELECT coalesce(max(dump_id),0)+1 FROM taskflow.step1_schema_backup_meta" 2>>"$RUNNER_TEMP/backup.err") \
            || { echo "backup id allocation failed (details withheld)"; exit 1; }
          python3 - "$RUNNER_TEMP/backup.sql.gz" "$DUMP_ID" > "$RUNNER_TEMP/backup.csv" <<'PY'
          import sys, csv, base64
          path, dump_id = sys.argv[1], int(sys.argv[2])
          b64 = base64.b64encode(open(path, "rb").read()).decode()
          csv.writer(sys.stdout, lineterminator="\n").writerow([dump_id, 0, b64])
          PY
          psql "service=$PGSERVICE" --single-transaction -v ON_ERROR_STOP=1 -q \
            -c "\\copy taskflow.step1_schema_backup FROM '$RUNNER_TEMP/backup.csv' CSV" \
            -c "INSERT INTO taskflow.step1_schema_backup_meta (dump_id, sha256, gz_bytes, note) VALUES ($DUMP_ID, '$HASH', $GZSIZE, 'step1 pre-change full taskflow schema (gzip+base64 lines)')" \
            2>>"$RUNNER_TEMP/backup.err" || { echo "backup row store failed (details withheld)"; exit 1; }
          BACK_COUNT=$(psql "service=$PGSERVICE" -Atc "SELECT count(*) FROM taskflow.step1_schema_backup WHERE dump_id=$DUMP_ID" 2>>"$RUNNER_TEMP/backup.err") \
            || { echo "backup count check failed (details withheld)"; exit 1; }
          echo "in-project backup stored: dump_id=$DUMP_ID rows=$BACK_COUNT gz_bytes=$GZSIZE sha256=$HASH"

      - name: Apply dispatch-authority candidate (single transaction, owner-guarded)
        if: inputs.action == 'backup+apply+postflight'
        run: |
          set -euo pipefail
          psql "service=$PGSERVICE" -v ON_ERROR_STOP=1 -q \
            -f labs/taskflow/sql/taskflow_native_dispatch_authority_candidate.sql 2>"$RUNNER_TEMP/apply.err" \
            || { echo "candidate apply failed; transaction aborted (details withheld from public logs)"; exit 1; }
          echo "candidate apply committed"

      - name: Guarded rollback (refuses when dispatch history exists)
        if: inputs.action == 'rollback-guarded'
        run: |
          set -euo pipefail
          psql "service=$PGSERVICE" -v ON_ERROR_STOP=1 -q \
            -f labs/taskflow/sql/taskflow_native_dispatch_authority_rollback.sql 2>"$RUNNER_TEMP/rollback.err" \
            || { echo "guarded rollback refused or failed (details withheld from public logs)"; exit 1; }
          echo "guarded rollback committed"

      - name: Read-only postflight (allowlisted status/reasons only; NOT_READY stays possible)
        if: inputs.action == 'backup+apply+postflight' || inputs.action == 'postflight-only'
        run: |
          set -euo pipefail
          rc=0
          psql "service=$PGSERVICE" -v ON_ERROR_STOP=1 -q -At \
            -f labs/taskflow/sql/taskflow_native_dispatch_authority_postflight.sql \
            > "$RUNNER_TEMP/postflight.out" 2>"$RUNNER_TEMP/postflight.err" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "postflight query failed (details withheld from public logs)"
            exit 1
          fi
          # Only the designed status vocabulary may reach public logs:
          # STATUS|reason_token lines with no free text.
          if ! grep -qE '^(READY|NOT_READY)\|\{[a-z0-9_:,.-]*\}$|^(READY|NOT_READY)\|$' "$RUNNER_TEMP/postflight.out"; then
            echo "postflight produced no allowlisted status lines (details withheld)"
            exit 1
          fi
          grep -E '^(READY|NOT_READY)\|(\{[a-z0-9_:,.-]*\})?$' "$RUNNER_TEMP/postflight.out"

      - name: Shred sensitive runner-local material
        if: always()
        run: |
          shred -u "$RUNNER_TEMP/pg_service.conf" "$RUNNER_TEMP/pg_service.conf.raw" 2>/dev/null || true
          shred -u "$RUNNER_TEMP/backup.sql" "$RUNNER_TEMP/backup.sql.gz" "$RUNNER_TEMP/backup.csv" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/guard.err" "$RUNNER_TEMP/tcp.err" "$RUNNER_TEMP/dump.err" "$RUNNER_TEMP/apply.err" "$RUNNER_TEMP/rollback.err" "$RUNNER_TEMP/postflight.out" "$RUNNER_TEMP/postflight.err"
