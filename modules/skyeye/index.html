<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111d">
  <meta name="description" content="Zhuge AI OS 天眼：手機版地圖、天氣、地震、空氣品質與道路影像資料。">
  <title>天眼｜Zhuge AI OS</title>
  <link rel="icon" href="../../shared/assets/logo/zhuge-ai-os.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/theme/tokens.css?v=20260926-0020">
  <link rel="stylesheet" href="../../shared/theme/variables.css?v=20260926-0020">
  <link rel="stylesheet" href="../../shared/theme/typography.css?v=20260926-0020">
  <link rel="stylesheet" href="../../shared/theme/zhuge-shell.css?v=20260926-0020">
  <link rel="stylesheet" href="../../shared/theme/zhuge-navigation.css?v=20260926-0020">
  <link rel="stylesheet" href="../../shared/theme/global-floating-hub.css?v=20260926-0020">
  <link rel="stylesheet" href="../../shared/theme/app-access.css?v=20260926-0020">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./assets/skyeye.css?v=20260926-0020">
</head>
<body class="skyeye-page">
  <div class="zhuge-module-shell skyeye-shell">
    <div id="zhugeSharedNavigation" data-external-root="../../" data-active-workspace="skyeye"></div>
    <div class="app skyeye-app">
      <main id="skyeyeMain" aria-labelledby="skyeyeTitle">
        <div id="skyeyeAuthGate" hidden></div>
        <section class="skyeye-desktop-guard" aria-label="天眼使用限制">
          <div>
            <strong>🛰️ 天眼目前提供手機版地圖</strong>
            <p>請使用手機寬度開啟天眼。桌面版不載入地圖資料，也不會建立另一套監控牆。</p>
          </div>
        </section>
        <section class="skyeye-mobile-stage" data-skyeye-stage hidden>
          <div class="skyeye-topbar">
            <div>
              <h1 id="skyeyeTitle">🛰️ 天眼</h1>
              <p>只顯示目前已載入的公開資料 evidence</p>
            </div>
            <div class="skyeye-topbar-actions">
              <button class="skyeye-nav-button" type="button" data-toggle-sidebar="1" aria-label="開啟 Zhuge AI OS 導覽" aria-expanded="false" aria-controls="zhugeSharedNavigationPanel">☰</button>
              <button class="skyeye-refresh-button" type="button" data-skyeye-refresh aria-label="重新讀取天眼資料">↻</button>
            </div>
          </div>
          <div id="skyeyeMap" class="skyeye-map" aria-label="天眼地圖"></div>
          <div class="skyeye-overlay-layer" data-skyeye-overlays aria-label="地圖浮動資料視窗" aria-live="polite" hidden></div>
          <div class="skyeye-status-pill" data-skyeye-status data-state="loading" role="status" aria-live="polite">正在確認資料來源…</div>
          <section class="skyeye-bottom-sheet" data-skyeye-sheet aria-label="天眼圖層與資料詳情">
            <div class="skyeye-sheet-handle" aria-hidden="true"></div>
            <div class="skyeye-sheet-heading">
              <h2>圖層與資料</h2>
              <button type="button" data-skyeye-detail-close aria-label="關閉資料詳情" hidden>×</button>
            </div>
            <div class="skyeye-layer-grid" data-skyeye-layers></div>
            <div class="skyeye-evidence-summary" data-skyeye-summary>
              <strong>諸葛目前畫面摘要</strong>
              <p>尚未載入資料。</p>
            </div>
            <div class="skyeye-detail" data-skyeye-detail hidden></div>
            <p class="skyeye-state" data-skyeye-state aria-live="polite"></p>
          </section>
        </section>
      </main>
    </div>
  </div>

  <script>var session = null;</script>
  <script src="../../shared/config/version.js?v=20260926-0020"></script>
  <script src="../../shared/config/template-release.js?v=20260915-1707"></script>
  <script src="../../shared/app-config.js?v=20260926-0020"></script>
  <script src="../../shared/utils/shared-utils.js?v=20260926-0020"></script>
  <script src="../../shared/storage/storage-migration.js?v=20260926-0020"></script>
  <script src="../../shared/identity/identity-health.js?v=20260926-0020"></script>
  <script src="../../shared/auth/session-lifecycle.js?v=20260926-0020"></script>
  <script src="../../shared/auth/auth-service.js?v=20260926-0020"></script>
  <script src="../../shared/identity/identity-service.js?v=20260926-0020"></script>
  <script src="../../shared/auth/session-service.js?v=20260926-0020"></script>
  <script src="../../shared/supabase/supabase-gateway.js?v=20260926-0020"></script>
  <script src="../../shared/auth/app-access-service.js?v=20260926-0020"></script>
  <script src="../../shared/auth/app-access-gate.js?v=20260926-0020"></script>
  <script src="../../shared/identity/creator-resolver.js?v=20260926-0020"></script>
  <script src="../../shared/components/zhuge-navigation.js?v=20260926-0020"></script>
  <script src="../../shared/components/zhuge-shell.js?v=20260926-0020"></script>
  <script src="../../shared/components/global-floating-hub.js?v=20260926-0020"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./services/skyeye-contract.js?v=20260926-0020"></script>
  <script src="./services/skyeye-overlay-contract.js?v=20260926-0020"></script>
  <script src="./skyeye-app.js?v=20260926-0020"></script>
</body>
</html>
