$('login').onclick=async()=>{if(pending){say('請完成已開啟的登入視窗，或關閉後重試。');if(!pending.popup.closed)return;pending=null}const popup=window.open('about:blank','ownboard-auth-'+crypto.randomUUID(),'popup,width=520,height=720');if(!popup){say('登入視窗被瀏覽器擋住，請允許彈出視窗後重試。');return}try{const verifier=b64(crypto.getRandomValues(new Uint8Array(48)));const challenge=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));pending={popup,verifier,started:Date.now()};const u=new URL(config.url+'/auth/v1/authorize');u.search=new URLSearchParams({provider:'google',redirect_to:config.callback,code_challenge:challenge,code_challenge_method:'s256',prompt:'select_account'});popup.location.replace(u);say('請在新視窗完成 Google 登入。')}catch{popup.close();pending=null;say('無法開始登入，請重試。')}};
window.addEventListener('message',async event=>{if(!pending||event.origin!==location.origin||event.source!==pending.popup||event.data?.type!=='ownboard-pkce-code')return;const flow=pending;pending=null;if(Date.now()-flow.started>300000||typeof event.data.code!=='string'||event.data.code.length>4096){say('登入已過期，請重新登入。');return}say('正在驗證登入…');try{const d=await authCall('/auth/v1/token?grant_type=pkce',{auth_code:event.data.code,code_verifier:flow.verifier});token=d.access_token;refresh=d.refresh_token;const loaded=await load();if(!loaded){if(marker||markerInvalid)showRecovery();say(token?'登入已完成，但暫時無法讀取工作。保存恢復身分仍保留，請重新讀取。':'登入未完成權限驗證，請使用原帳號重新登入。');return}if((marker||markerInvalid)&&!attempts.size){showRecovery();return}if(attempts.size){const id=attempts.keys().next().value;await loadDetail(id,document.querySelector('.task[aria-current]'));say('已重新登入，原保存請求仍未確認。請以相同內容重試取回結果，不會自動重送。')}}catch(e){if(!attempts.size)clear();say('登入未完成。原保存請求仍保留，請重試登入，勿重整或關閉此頁。')}});
$('search').oninput=render;$('reload').onclick=load;$('logout').onclick=async()=>{const old=token;clear();try{const r=await fetch(config.url+'/auth/v1/logout?scope=local',{method:'POST',headers:{apikey:config.anonKey,Authorization:'Bearer '+old},credentials:'omit',cache:'no-store'});if(marker||markerInvalid){showRecovery();say(r.ok?'已登出，私密內容已清除。仍有前次保存待查回，請使用原帳號登入；登出不會撤銷已送出的保存。':'私密內容已清除，伺服器登出未確認。前次保存恢復紀錄仍保留。')}else say(r.ok?'已登出，此頁已清除資料。':'此頁已清除資料，但伺服器登出未確認，請重新登入後再登出。')}catch{if(marker||markerInvalid){showRecovery();say('私密內容已清除，登出未確認；前次保存仍待原帳號登入查回。')}else say('此頁已清除資料，但伺服器登出未確認。')}};
if(location.hash||new URLSearchParams(location.search).has('code')){history.replaceState(null,'',location.pathname);say('此頁不接收URL憑證，請按登入重試。')}
</script></head><body><header><div><span class="eyebrow">原創工作台</span><h1>從原工作接著看</h1><p>沿用原編號、內容、留言與歷史。可修改工作內容，其他欄位維持唯讀。</p></div><div class="badges"><span class="badge">內容保存</span></div></header><main><section id="auth" class="panel"><h2>登入你的工作空間</h2><p>僅限本人。工作資料不放在網頁程式碼裡，登入後仍由資料服務驗證權限。</p><button id="login">使用 Google 登入</button><p class="muted">登入會開啟新視窗。重新整理後需重新登入，不留存登入憑證。</p></section><div class="toolbar"><label>搜尋原編號或名稱<input id="search" type="search" placeholder="登入後搜尋" disabled></label><button id="reload" disabled>重新讀取</button><button id="logout" hidden>登出</button></div><p id="status" role="status">尚未登入。此頁不包含任何預載工作或示範資料。</p><div class="layout"><section class="panel"><div class="sectiontitle"><h2>原工作</h2><span id="count">尚未載入</span></div><div id="list"><p class="empty">登入後顯示原工作，不建立另一套編號。</p></div></section><article class="panel" id="detail"><p class="empty">選擇一筆工作查看內容。</p></article></div><p class="muted foot">此版只開放工作內容保存，尚未提供新增、其他欄位修改、工時寫入或附件開啟。附件仍保留原紀錄，不將未驗證的檔案當作已接好。</p><p class="muted">內容保存後會記錄活動，但不保留修改前的內容全文；有事件監看的工作暫不開放保存。</p></main></body></html>
