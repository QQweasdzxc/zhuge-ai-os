 const prefs=displayConfig?.preferences||[];
 const exact=prefs.find(p=>p.scope_type==='project'&&p.scope_id===project)?.status_labels?.[key];
 if(typeof exact==='string'&&exact.trim())return exact;
 const workspace=prefs.find(p=>p.scope_type==='workspace')?.status_labels?.[key];
 if(typeof workspace==='string'&&workspace.trim())return workspace;
 const matches=prefs.filter(p=>p.scope_type==='project'&&typeof p.status_labels?.[key]==='string'&&p.status_labels[key].trim());
 const labels=[...new Set(matches.map(p=>p.status_labels[key]))];
 if(labels.length===1)return labels[0];

function persistMarker(a){const m={version:1,owner_id:OWNER_ID,issue_id:a.issueId,request_id:a.requestId,created_at:Date.now()};localStorage.setItem(MARKER_KEY,JSON.stringify(m));const check=localStorage.getItem(MARKER_KEY);if(check!==JSON.stringify(m))throw Error('storage-unavailable');marker=m}
function resolveMarker(id){if(marker?.request_id!==id)return;try{localStorage.removeItem(MARKER_KEY);marker=null}catch{markerInvalid=true}}
function tokenOwner(){try{return JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub===OWNER_ID}catch{return false}}
async function recoverMarker(){
 if(!marker||markerInvalid||!token||saveBusy)return;
 if(!tokenOwner()){say('目前登入的帳號無法查回此保存。請登出後使用原帳號登入。');return}
 const m={...marker},g=generation;saveBusy=true;say('正在查回前次保存；尚未完成的請求將安全終止，不重送內容。');
 try{const r=await fetch(config.url+'/rest/v1/rpc/ownboard_owner_request_recover_v1',{method:'POST',headers:{apikey:config.anonKey,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({p_issue_id:m.issue_id,p_request_id:m.request_id}),cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});if(g!==generation)return;const d=await r.json();if(!r.ok)throw Object.assign(Error('recover-failed'),{code:r.status===401?'AUTH_REQUIRED':d?.code});if(d.issue_id!==m.issue_id||d.request_id!==m.request_id||!['committed','finalized_absent'].includes(d.state))throw Error('invalid-recovery');if(d.state==='committed'&&(!d.receipt||d.receipt.request_id!==m.request_id||d.receipt.issue_id!==m.issue_id||!Number.isSafeInteger(d.receipt.saved_revision)))throw Error('invalid-recovery');
 resolveMarker(m.request_id);attempts.delete(m.issue_id);drafts.delete(m.issue_id);saveBusy=false;await loadDetail(m.issue_id,document.querySelector('.task[aria-current]'));if(g!==generation)return;if(lastDetailError){receiptPending=m.issue_id;editEntry(false);const host=$('detail');host.replaceChildren(node('h2',d.state==='committed'?'前次保存已確認完成':'前次保存已安全終止'),node('p','最新內容暫時無法讀取，重新讀取成功後才能編輯。','savestatus warn'));const b=node('button','重新讀取最新內容');b.onclick=()=>loadDetail(m.issue_id,document.querySelector('.task[aria-current]'));host.append(b);say(d.state==='committed'?'前次保存已確認完成，但最新內容暫時無法讀取。請重新讀取後再編輯。':'前次保存已安全終止，但最新內容暫時無法讀取。請重新讀取後再編輯。');return}say(d.state==='committed'?'前次保存已確認完成，已重新讀取內容。':'前次未完成的保存已安全終止，不會在稍後生效。已重新讀取內容。');
 }catch(e){if(g!==generation)return;saveBusy=false;if(e.code==='AUTH_REQUIRED'){token=refresh=null;$('auth').hidden=false;say('登入已到期，請重新登入原帳號後查回前次保存。恢復紀錄仍保留。');showRecovery();return}say(e.code==='55P03'?'前次保存仍處理中，請稍後再查回。':'暫時無法查回前次保存，請求身分仍保留；請使用原帳號登入後重試。');showRecovery()}
}
function showRecovery(){if(!marker&&!markerInvalid)return;const host=$('detail');host.classList.add('open');host.replaceChildren(node('h2','前次保存待確認'),node('p',markerInvalid?'保存恢復紀錄無法驗證。為避免重複保存，暫不開放新保存；請保留此頁並聯絡協助。':'此頁只保留前次請求編號，不含工作內容。登入原帳號後可查回結果；若請求尚未完成，會安全終止它，避免稍後又生效。','savestatus warn'));if(marker&&!markerInvalid){const b=node('button','查回前次保存結果');b.onclick=recoverMarker;host.append(b)}}
readMarker();
window.addEventListener('DOMContentLoaded',()=>{if(marker||markerInvalid)showRecovery()});
async function saveCall(req){
 const g=generation;
 const r=await fetch(config.url+'/rest/v1/rpc/ownboard_owner_description_save_v1',{method:'POST',headers:{apikey:config.anonKey,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(req),cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});
 if(g!==generation)throw new Error('stale-session');
 let d;try{d=await r.json()}catch{throw new Error('unconfirmed-response')}
 if(!r.ok){const code=r.status===401?'AUTH_REQUIRED':(typeof d?.code==='string'?d.code:'');throw Object.assign(new Error('save-unavailable'),{code})}
 if(!d||d.request_id!==req.p_request_id||d.issue_id!==req.p_issue_id||typeof d.changed!=='boolean'||typeof d.replayed!=='boolean'||!Number.isSafeInteger(d.saved_revision)||d.saved_revision<1)throw new Error('unconfirmed-response');
 return d;
}
function descText(v){return v===null||v===undefined?node('div','原工作未填內容。','content emptydesc'):v===''?node('div','（內容為空字串）','content emptydesc'):node('div',v,'content')}
function editEntry(allowed){const b=document.querySelector('#detail .editbtn');if(b)b.disabled=!allowed}
function renderDescription(area,i){
 receiptPending=null;editEntry(true);
 area.replaceChildren();
 const a=attempts.get(i.id);
 if(a){if(a.status==='unknown'){renderUnresolved(area,i);return}renderEditor(area,i,a.description,true);return}
 const d=drafts.get(i.id);
 if(d){if(d.baseRevision!==i.revision){renderStaleDraft(area,i,d);return}renderEditor(area,i,d.text,true);return}
 area.append(descText(i.description));
 const r=receipts.get(i.id);
 if(r)area.append(node('p','上次保存回條仍保留於此頁記憶體（版本 '+r.saved_revision+'）。','savestatus'));
}
function startEdit(i){
 if(receiptPending===i.id){say(SAVE_ERR.receiptPendingEdit);return}
 const area=$('detail').querySelector('.descarea');if(!area)return;
 const a=attempts.get(i.id);
 if(a){renderEditor(area,i,a.description,true);return}
 const d=drafts.get(i.id);
 if(d){if(d.baseRevision!==i.revision){renderStaleDraft(area,i,d);return}renderEditor(area,i,d.text,true);return}
 renderEditor(area,i,i.description??'',false);
}
function renderEditor(area,i,text,restored){
 area.replaceChildren();
 const a=attempts.get(i.id);
 const locked=!!(a&&(a.status==='unknown'||a.needsAuth));
 const meta=node('p','編輯 '+prefix+'-'+i.number+'（UUID '+i.id+'，基準版本 '+i.revision+'）。'+(restored?' 已還原未保存草稿（僅此頁記憶體）。':''),'savestatus');
 const ta=node('textarea');ta.value=text;ta.rows=8;ta.setAttribute('aria-label','編輯工作內容');
 let dirty=false;
 ta.addEventListener('input',()=>{dirty=true;drafts.set(i.id,{text:ta.value,baseRevision:i.revision})});
 if(restored)dirty=true;
 if(locked)ta.disabled=true;
 const status=node('p',undefined,'savestatus');status.setAttribute('role','status');
 const bar=node('div',undefined,'editbar');
 const saveB=node('button','儲存','primary'),prevB=node('button','預覽'),cancelB=node('button','取消');
 saveB.type=prevB.type=cancelB.type='button';
 bar.append(saveB,prevB,cancelB);
 area.append(meta,ta,bar,status);
 if(a){
  status.textContent=a.needsAuth?'登入已到期，請重新登入。'+(a.status==='failed'?'前次保存已因忙碌回滾，尚未保存。':SAVE_ERR.unknown):(a.status==='unknown'?SAVE_ERR.unknown:SAVE_ERR.busy);
  status.classList.add('warn');
  appendRetry(area,i,a.description,status,locked);
  appendDiscard(area,i,status,a.status==='unknown');
 }
 ta.focus();
 saveB.onclick=()=>{if(saveBusy)return;if(!a&&!dirty&&ta.value===(i.description??'')){status.textContent='內容未修改。';return}submitSave(area,i,ta.value,status)};
 prevB.onclick=()=>{if(saveBusy)return;renderPreview(area,i,ta.value,dirty)};
 cancelB.onclick=()=>{if(saveBusy)return;cancelEdit(area,i)};
}
function renderPreview(area,i,proposed,dirty){
 area.replaceChildren();
 const a=attempts.get(i.id);
 const grid=node('div',undefined,'prevgrid');
 const x=node('section');x.append(node('h4','原始內容（版本 '+i.revision+'）'),descText(i.description));
 const b=node('section');b.append(node('h4','將送出的內容'),descText(proposed));
 grid.append(x,b);
 const status=node('p','尚未送出；確認無誤再按儲存。','savestatus');status.setAttribute('role','status');
 const bar=node('div',undefined,'editbar');
 const back=node('button','返回編輯'),saveB=node('button','儲存','primary'),cancelB=node('button','取消');
 back.type=saveB.type=cancelB.type='button';
 bar.append(back,saveB,cancelB);
 area.append(grid,bar,status);
 back.onclick=()=>{if(saveBusy)return;renderEditor(area,i,proposed,true)};
 saveB.onclick=()=>{if(saveBusy)return;if(!a&&!dirty&&proposed===(i.description??'')){status.textContent='內容未修改。';return}submitSave(area,i,proposed,status)};
 cancelB.onclick=()=>{if(saveBusy)return;cancelEdit(area,i)};
}
function cancelEdit(area,i){
 const a=attempts.get(i.id);
 if(a&&a.status==='unknown'){renderUnresolved(area,i);return}
 drafts.delete(i.id);
 if(a)attempts.delete(i.id);
 renderDescription(area,i);
}
function renderUnresolved(area,i){
 area.replaceChildren();
 const a=attempts.get(i.id);
 if(!a){renderDescription(area,i);return}
 area.append(node('p','已取消編輯。前次保存結果未確認：伺服器可能已保存，也可能未保存（同一請求不會重複生效）。結果未確認的請求不能放棄；請以相同內容重試取回結果，此請求處理完前不會送出新請求。','savestatus warn'));
 area.append(node('h4','目前最新內容（唯讀，不代表你的請求已生效）'),descText(i.description));
 const status=node('p',undefined,'savestatus');status.setAttribute('role','status');
 const bar=node('div',undefined,'editbar');
 const retry=node('button','以相同內容重試','retrybtn'),read=node('button','重新讀取最新'),view=node('button','查看此次送出內容'),drop=node('button','放棄此請求','discardbtn');
 retry.type=read.type=view.type=drop.type='button';
 drop.disabled=true;drop.title='結果未確認的請求不能放棄；請以相同內容重試取回結果。';
 bar.append(retry,read,view,drop);
 area.append(bar,status);
 retry.onclick=()=>{if(saveBusy)return;submitSave(area,i,a.description,status)};
 read.onclick=()=>{if(saveBusy)return;loadDetail(i.id,document.querySelector('.task[aria-current]'))};
 view.onclick=()=>{if(saveBusy)return;renderEditor(area,i,a.description,true)};

function renderStaleDraft(area,i,d){
 area.replaceChildren();
 area.append(node('p','草稿的基準版本（版本 '+d.baseRevision+'）已過期：此工作目前為版本 '+i.revision+'，內容可能已在別處更新。不會以舊基準靜默送出。','savestatus warn'));
 const grid=node('div',undefined,'prevgrid');
 const x=node('section');x.append(node('h4','目前最新內容（版本 '+i.revision+'）'),descText(i.description));
 const b=node('section');b.append(node('h4','你的草稿（基準版本 '+d.baseRevision+'）'),descText(d.text));
 grid.append(x,b);
 const status=node('p','請核對後決定；覆蓋送出會成為新的保存請求。','savestatus');status.setAttribute('role','status');
 const bar=node('div',undefined,'editbar');
 const editNew=node('button','以最新內容繼續編輯','primary'),resend=node('button','以草稿覆蓋送出（新請求）'),drop=node('button','放棄草稿');
 editNew.type=resend.type=drop.type='button';
 bar.append(editNew,resend,drop);
 area.append(grid,bar,status);
 editNew.onclick=()=>{if(saveBusy)return;drafts.delete(i.id);renderEditor(area,i,i.description??'',false)};
 resend.onclick=()=>{if(saveBusy)return;drafts.delete(i.id);submitSave(area,i,d.text,status)};
 drop.onclick=()=>{if(saveBusy)return;drafts.delete(i.id);renderDescription(area,i)};

async function submitSave(area,i,description,status){
 if(saveBusy)return;
 if(markerInvalid){showRecovery();return}
 if(marker&&!attempts.size){showRecovery();return}
 const g=generation;
 let a=attempts.get(i.id);
 if(a){
  if(a.description!==description){status.textContent=a.status==='failed'?'前次請求已因忙碌而回滾；若要更改內容，請先放棄該請求，再建立新請求。':SAVE_ERR.attemptLocked;status.classList.add('warn');return}
 }else{
  if(attempts.size){status.textContent=SAVE_ERR.otherPending;status.classList.add('warn');return}
  a={issueId:i.id,requestId:crypto.randomUUID(),description,expectedRevision:i.revision,status:'pending'};
  try{persistMarker(a)}catch{status.textContent='無法建立安全恢復紀錄，本次尚未送出。請勿繼續保存。';return}
  attempts.set(i.id,a);
 }
 saveBusy=true;
 if(a.needsAuth&&!token){saveBusy=false;$('auth').hidden=false;status.textContent='請先重新登入，再以相同內容重試取回原請求結果。請勿重整或關閉此頁。';return}
 a.needsAuth=false;
 status.textContent='正在保存…';
 try{
  const r=await saveCall({p_issue_id:i.id,p_expected_revision:a.expectedRevision,p_description:a.description,p_request_id:a.requestId});
  if(g!==generation)return;
  resolveMarker(a.requestId);attempts.delete(i.id);drafts.delete(i.id);receipts.set(i.id,r);saveBusy=false;
  if(!r.changed)say('保存請求完成：伺服器讀取點內容相同，未執行更新；最新內容以重新讀取為準。');
  else if(r.replayed)say('此保存先前已成功，本次為同一請求的回條（版本 '+r.saved_revision+'）；正在重新讀取最新內容。');
  else say('已保存（回條版本 '+r.saved_revision+'）；正在重新讀取最新內容。');
  await loadDetail(i.id,document.querySelector('.task[aria-current]'));
  if(g!==generation)return;
  if(lastDetailError){say('保存已獲回條（版本 '+r.saved_revision+(r.replayed?'，重播回條':'')+'），但最新內容暫時無法讀取。');renderReceiptPending(area,i,r)}
 }catch(err){
  if(g!==generation)return;
  saveBusy=false;
  handleSaveError(err,area,i,description,status);
 }
}
function renderReceiptPending(area,i,r){
 receiptPending=i.id;editEntry(false);
 area.replaceChildren();
 area.append(node('p','保存已獲回條（版本 '+r.saved_revision+(r.replayed?'，重播回條':'')+'），但最新內容暫時無法讀取。回條僅保留於此頁記憶體，不會以回條聲稱最新內容。','savestatus warn'));
 const b=node('button','重新讀取');b.type='button';
 b.onclick=()=>loadDetail(i.id,document.querySelector('.task[aria-current]'));
 area.append(b);
}
function appendRetry(area,i,description,status,lock){
 const bar=area.querySelector('.editbar');if(!bar||bar.querySelector('.retrybtn'))return;
 if(lock){const ta=area.querySelector('textarea');if(ta)ta.disabled=true}
 const b=node('button','以相同內容重試','retrybtn');b.type='button';
 b.onclick=()=>{if(saveBusy)return;submitSave(area,i,description,status)};
 bar.append(b);
}
function appendDiscard(area,i,status,disabled){
 const bar=area.querySelector('.editbar');if(!bar||bar.querySelector('.discardbtn'))return;
 const b=node('button','放棄此請求','discardbtn');b.type='button';
 if(disabled){b.disabled=true;b.title='結果未確認的請求不能放棄；請以相同內容重試取回結果。'}
 b.onclick=()=>{if(saveBusy)return;discardAttempt(area,i,status)};
 bar.append(b);
}
function discardAttempt(area,i,status){
 const a=attempts.get(i.id);if(!a||saveBusy)return;
 if(a.status==='unknown')return; // 結果未確認的請求無安全放棄語義：只能同 request 重試定案
 resolveMarker(a.requestId);attempts.delete(i.id); // 55P03 已確定回滾，可安全放棄
 say('已放棄未生效的保存請求（系統忙碌未受理）；草稿保留，可修改後作為新請求送出。');
 renderEditor(area,i,a.description,true);
}
function handleSaveError(err,area,i,description,status){
 const a=attempts.get(i.id);if(!a)return;
 const code=err&&err.code;
 if(code==='AUTH_REQUIRED'){a.status='unknown';a.needsAuth=true;token=refresh=null;$('auth').hidden=false;status.textContent=SAVE_ERR.unknown+' 登入已到期，請重新登入後以原請求取回結果。';appendRetry(area,i,a.description,status,true);appendDiscard(area,i,status,true);return}
 if(code==='55P03'){const unresolved=a.status==='unknown';a.status=unresolved?'unknown':'failed';status.textContent=unresolved?SAVE_ERR.unknown:SAVE_ERR.busy;status.classList.add('warn');appendRetry(area,i,a.description,status,unresolved);appendDiscard(area,i,status,unresolved);return}
 if(code==='40001'){resolveMarker(a.requestId);attempts.delete(i.id);enterConflict(area,i,a.description);return}
 if(code==='42501'){if(a.status==='unknown'){status.textContent='前次保存尚未確認，請以原帳號登入後查回結果。';return}resolveMarker(a.requestId);attempts.delete(i.id);status.textContent=SAVE_ERR.denied;status.classList.add('err');rpc(i.id).catch(()=>{});return}
 if(code==='PZ001'){resolveMarker(a.requestId);attempts.delete(i.id);drafts.delete(i.id);loadDetail(i.id);say('此請求已安全終止，沒有保存。');return}
 if(code==='22023'){if(a.status==='unknown'){status.textContent='前次保存尚未確認，請查回結果，不建立新請求。';return}resolveMarker(a.requestId);const changed=a.description!==description;attempts.delete(i.id);status.textContent=changed?SAVE_ERR.validationChanged:SAVE_ERR.validation;status.classList.add('err');return}
 a.status='unknown';status.textContent=SAVE_ERR.unknown;status.classList.add('warn');appendRetry(area,i,a.description,status,true);appendDiscard(area,i,status,true);
}
async function enterConflict(area,i,draftText){
 const g=generation;
 let fresh;
 try{fresh=await rpc(i.id)}catch(e){if(g!==generation)return;area.append(node('p','版本衝突，且重新讀取最新內容失敗；草稿保留於此頁記憶體，請稍後重新讀取。','savestatus err'));return}
 if(g!==generation)return;
 const fi=fresh.issue;

 drafts.set(i.id,{text:draftText,baseRevision:fi.revision});
 area.replaceChildren();
 area.append(node('p','版本衝突：此工作已有更新的內容（目前版本 '+fi.revision+'）。你的草稿未覆蓋它，請核對後決定。','savestatus warn'));
 const grid=node('div',undefined,'prevgrid');
 const x=node('section');x.append(node('h4','目前最新內容（版本 '+fi.revision+'）'),descText(fi.description));
 const b=node('section');b.append(node('h4','你的草稿'),descText(draftText));
 grid.append(x,b);
 const status=node('p','不會自動以新版本重送。','savestatus');status.setAttribute('role','status');
 const bar=node('div',undefined,'editbar');
 const resend=node('button','以草稿作為新請求重送','primary'),editNew=node('button','以最新內容重新編輯'),drop=node('button','放棄草稿');
 resend.type=editNew.type=drop.type='button';
 bar.append(resend,editNew,drop);
 area.append(grid,bar,status);
 resend.onclick=()=>{if(saveBusy)return;drafts.delete(i.id);submitSave(area,fi,draftText,status)};
 editNew.onclick=()=>{if(saveBusy)return;drafts.delete(i.id);renderEditor(area,fi,fi.description??'',false)};
 drop.onclick=()=>{if(saveBusy)return;drafts.delete(i.id);renderDescription(area,fi)};
}
window.addEventListener('pagehide',()=>{clear();pending=null});
window.addEventListener('beforeunload',event=>{if(attempts.size||marker){event.preventDefault();event.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&token&&!saveBusy){if((marker||markerInvalid)&&!attempts.size){showRecovery();return}if(currentDetail)loadDetail(currentDetail.id,document.querySelector('.task[aria-current]'));else load()}});

buildTopbar();buildSidebar();
if(!isFixture)say('尚未登入。此頁不包含任何預載工作或示範資料。');
else load();
if(!isFixture){/* 登入後由 message 事件觸發 load() */}
</script></body></html>
