<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-uxfgL4kfqj4XrV2LSddjgf9bA+9Z/V014J79Asv+a3s='; style-src 'sha256-eWM2q5uOLcKwFF3tmwtrgsiRqDx2nKkqM2rYSiHfVYk='; connect-src https://lenpbbhwxyyfwgvjcozf.supabase.co; img-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"><title>原工作台 · 唯讀體驗</title><style>:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#14233a;background:#f4f6fa;font-size:15px}*{box-sizing:border-box}body{margin:0}header{background:#142d44;color:white;padding:32px max(24px,calc((100vw - 1260px)/2));display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:30px;margin:8px 0 10px}header p{color:#d5e2ed;margin:0;line-height:1.7}.eyebrow{font-size:12px;letter-spacing:2px;color:#8fe1cf}.badge{color:#95e7d4;border:1px solid #51847f;border-radius:30px;padding:7px 16px;white-space:nowrap}main{max-width:1308px;margin:24px auto;padding:0 24px}.panel{padding:24px;background:#fff;border:1px solid #dce3ed;border-radius:14px;min-width:0}h2{font-size:19px;margin:0 0 14px}p{line-height:1.75}.muted{font-size:13px;color:#69788b}button{font:inherit;border:1px solid #bdcbd9;border-radius:8px;background:#fff;color:#142d44;padding:10px 16px;cursor:pointer}button:hover{background:#eaf5f1}button:focus-visible,input:focus-visible{outline:3px solid #30a488;outline-offset:2px}button:disabled{opacity:.45;cursor:default}#login{background:#176e60;color:#fff;border-color:#176e60}#auth{margin-bottom:20px}.toolbar{display:flex;align-items:end;gap:12px}.toolbar label{font-size:12px;color:#607187;flex:1}.toolbar input{display:block;width:100%;padding:11px 13px;margin-top:6px;border:1px solid #bdcbd9;border-radius:8px;font:inherit;background:white}#status{font-size:13px;color:#52677c;min-height:25px}.layout{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.35fr);gap:20px;align-items:start}.sectiontitle{display:flex;justify-content:space-between;gap:15px;color:#63748a;font-size:12px}.sectiontitle h2{color:#14233a}.task{width:100%;text-align:left;display:block;border:0;border-top:1px solid #e5eaf1;border-radius:0;padding:14px 0;background:white}.task[aria-current=true]{background:#eef8f4;padding-left:10px;border-left:3px solid #16806b}.code{font-size:12px;color:#47766b;font-weight:650;display:block;margin-bottom:5px}.tasktitle{line-height:1.6;overflow-wrap:anywhere}.meta{font-size:12px;color:#6f7d91}.empty{color:#7b8796;padding:30px 0}.content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}.record{border-top:1px solid #e6ebf1;padding:14px 0}.record time{font-size:12px;color:#718096}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 system-ui}.foot{margin:20px 0 35px}#detail h2{font-size:23px;line-height:1.5;overflow-wrap:anywhere}.detailsmeta{display:flex;flex-wrap:wrap;gap:12px;color:#64748b;font-size:13px}details{margin-top:20px}summary{cursor:pointer;font-weight:600}#list{max-height:65vh;overflow:auto}#detail h3{font-size:15px;margin-top:26px}@media(max-width:720px){header{padding:24px}h1{font-size:25px}.layout{grid-template-columns:1fr}.panel{padding:20px}.toolbar{flex-wrap:wrap}.toolbar label{flex-basis:100%}main{padding:0 16px}#list{max-height:45vh}.badge{align-self:flex-start}}</style><script type="module">const config={"url": "https://lenpbbhwxyyfwgvjcozf.supabase.co", "anonKey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxlbnBiYmh3eHl5Zndndmpjb3pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTM1ODksImV4cCI6MjA5NTg2OTU4OX0.TAFfLoMC8Tqr4r7nlAtsOke3YcjBIBmr5fN1a6iwSFQ", "callback": "https://qqweasdzxc.github.io/zhuge-ai-os/modules/ownboard/callback.html"};

const $=id=>document.getElementById(id);let token=null,refresh=null,pending=null,rows=[],prefix='',generation=0;
const say=text=>$('status').textContent=text;
const node=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
function clear(){generation++;token=refresh=null;rows=[];prefix='';$('list').replaceChildren(node('p','登入後顯示原工作，不建立另一套編號。','empty'));$('detail').replaceChildren(node('p','選擇一筆工作查看內容。','empty'));$('count').textContent='尚未載入';$('auth').hidden=false;$('logout').hidden=true;$('reload').disabled=true;$('search').disabled=true;}
async function authCall(path,body){const r=await fetch(config.url+path,{method:'POST',headers:{apikey:config.anonKey,'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});const d=await r.json();if(!r.ok)throw Error('登入未完成，請重新登入。');return d}
async function rpc(id=null){const g=generation;const r=await fetch(config.url+'/rest/v1/rpc/ownboard_owner_read_v1',{method:'POST',headers:{apikey:config.anonKey,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({p_issue_id:id}),cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});if(g!==generation)throw Error('登入狀態已改變。');if(!r.ok){if([401,403].includes(r.status)){clear();throw Error('目前無法通過權限驗證，請重新登入。')}throw Error('暫時無法讀取原工作，沒有更動任何資料。')}return r.json()}
function render(){const q=$('search').value.toLocaleLowerCase();const visible=rows.filter(r=>(prefix+'-'+r.number+' '+r.title).toLocaleLowerCase().includes(q));$('count').textContent=visible.length+' / '+rows.length+' 筆';$('list').replaceChildren();for(const r of visible){const b=node('button',undefined,'task');b.append(node('span',prefix+'-'+r.number,'code'),node('span',r.title,'tasktitle'),node('div',r.status+' · '+r.priority,'meta'));b.onclick=()=>loadDetail(r.id,b);$('list').append(b)}if(!visible.length)$('list').append(node('p','沒有符合的原工作。','empty'))}
function textValue(v){return typeof v==='string'?v:JSON.stringify(v,null,2)}
async function loadDetail(id,button){const g=generation;say('正在讀取原內容…');try{const d=await rpc(id);if(g!==generation)return;const i=d.issue,host=$('detail');host.replaceChildren(node('span',prefix+'-'+i.number,'code'),node('h2',i.title));const meta=node('div',undefined,'detailsmeta');for(const text of ['狀態 '+i.status,'優先度 '+i.priority,'版本 '+i.revision,'開始 '+(i.start_date||'未設定'),'到期 '+(i.due_date||'未設定')])meta.append(node('span',text));host.append(meta,node('h3','工作內容'),node('div',i.description||'原工作未填內容。','content'));for(const [label,key] of [['留言','comments'],['活動歷史','activity']]){const details=node('details');details.append(node('summary',label+' ('+d[key].length+')'));for(const r of d[key]){const e=node('section',undefined,'record');e.append(node('time',r.created_at||''),node('div',textValue(r.content??{action:r.action,details:r.details}),'content'));details.append(e)}host.append(details)}const raw=node('details');raw.append(node('summary','其他原始工作欄位'),node('pre',JSON.stringify(i,null,2)));host.append(raw);document.querySelectorAll('.task[aria-current]').forEach(e=>e.removeAttribute('aria-current'));button?.setAttribute('aria-current','true');say('已讀取原內容。唯讀，不會儲存修改。')}catch(e){say(e.message)}}
async function load(){if(!token)return;say('正在核對權限並讀取原工作…');const g=generation;try{const d=await rpc();if(g!==generation)return;rows=d.issues;prefix=d.prefix;$('auth').hidden=true;$('logout').hidden=false;$('reload').disabled=false;$('search').disabled=false;render();say('已讀取 '+rows.length+' 筆原工作。可搜尋及開啟內容，修改尚未開放。')}catch(e){say(e.message)}}
const b64=bytes=>btoa(String.fromCharCode(...new Uint8Array(bytes))).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');
$('login').onclick=async()=>{if(pending){say('請完成已開啟的登入視窗，或關閉後重試。');if(!pending.popup.closed)return;pending=null}const popup=window.open('about:blank','ownboard-auth-'+crypto.randomUUID(),'popup,width=520,height=720');if(!popup){say('登入視窗被瀏覽器擋住，請允許彈出視窗後重試。');return}try{const verifier=b64(crypto.getRandomValues(new Uint8Array(48)));const challenge=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));pending={popup,verifier,started:Date.now()};const u=new URL(config.url+'/auth/v1/authorize');u.search=new URLSearchParams({provider:'google',redirect_to:config.callback,code_challenge:challenge,code_challenge_method:'s256',prompt:'select_account'});popup.location.replace(u);say('請在新視窗完成 Google 登入。')}catch{popup.close();pending=null;say('無法開始登入，請重試。')}};
window.addEventListener('message',async event=>{if(!pending||event.origin!==location.origin||event.source!==pending.popup||event.data?.type!=='ownboard-pkce-code')return;const flow=pending;pending=null;if(Date.now()-flow.started>300000||typeof event.data.code!=='string'||event.data.code.length>4096){say('登入已過期，請重新登入。');return}say('正在驗證登入…');try{const d=await authCall('/auth/v1/token?grant_type=pkce',{auth_code:event.data.code,code_verifier:flow.verifier});token=d.access_token;refresh=d.refresh_token;await load()}catch(e){clear();say(e.message)}});
$('search').oninput=render;$('reload').onclick=load;$('logout').onclick=async()=>{const old=token;clear();try{const r=await fetch(config.url+'/auth/v1/logout?scope=local',{method:'POST',headers:{apikey:config.anonKey,Authorization:'Bearer '+old},credentials:'omit',cache:'no-store'});say(r.ok?'已登出，此頁已清除資料。':'此頁已清除資料，但伺服器登出未確認，請重新登入後再登出。')}catch{say('此頁已清除資料，但伺服器登出未確認。')}};
window.addEventListener('pagehide',()=>{token=refresh=null;pending=null});if(location.hash||new URLSearchParams(location.search).has('code')){history.replaceState(null,'',location.pathname);say('此頁不接收URL憑證，請按登入重試。')}
</script></head><body><header><div><span class="eyebrow">原創工作台</span><h1>從原工作接著看</h1><p>唯讀體驗，原編號、內容、留言與歷史。這一版不會改動工作。</p></div><span class="badge">唯讀</span></header><main><section id="auth" class="panel"><h2>登入你的工作空間</h2><p>僅限本人。工作資料不放在網頁程式碼裡，登入後仍由資料服務驗證權限。</p><button id="login">使用 Google 登入</button><p class="muted">登入會開啟新視窗。重新整理後需重新登入，不留存登入憑證。</p></section><div class="toolbar"><label>搜尋原編號或名稱<input id="search" type="search" placeholder="登入後搜尋" disabled></label><button id="reload" disabled>重新讀取</button><button id="logout" hidden>登出</button></div><p id="status" role="status">尚未登入。此頁不包含任何預載工作或示範資料。</p><div class="layout"><section class="panel"><div class="sectiontitle"><h2>原工作</h2><span id="count">尚未載入</span></div><div id="list"><p class="empty">登入後顯示原工作，不建立另一套編號。</p></div></section><article class="panel" id="detail"><p class="empty">選擇一筆工作查看內容。</p></article></div><p class="muted foot">尚未提供新增、編輯、工時寫入或附件開啟。附件仍保留原紀錄，不將未驗證的檔案當作已接好。</p></main></body></html>
