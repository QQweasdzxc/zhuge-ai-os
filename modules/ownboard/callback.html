<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-uRSi+QmSeb3T8CVKH7diwQiGFI1ScJKjxU//gZOgDoI='; base-uri 'none'; form-action 'none'"><title>完成登入</title><script type="module">const params=new URLSearchParams(location.search),hadHash=Boolean(location.hash),code=params.get('code'),failure=params.get('error_description')||params.get('error');history.replaceState(null,'',location.pathname);const text=document.getElementById('result');if(hadHash){history.replaceState(null,'',location.pathname);text.textContent='不支援隱式登入，這次不接收任何憑證，請關閉並重新登入。'}else if(!window.opener){text.textContent='原登入視窗已關閉，請回工作台重新登入。'}else if(code){window.opener.postMessage({type:'ownboard-pkce-code',code},location.origin);text.textContent='登入已交回原視窗，現在可以關閉此視窗。';window.close()}else{text.textContent=failure?'登入未完成，請回原視窗重試。':'沒有收到登入代碼，請回原視窗重試。'}</script></head><body><p id="result">正在完成登入，請稍候。</p></body></html>
