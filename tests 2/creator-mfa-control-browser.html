<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>Creator MFA control browser regression</title></head>
<body>
  <div class="zhuge-module-shell"><main class="main">
    <nav class="workspace-subnav" aria-label="AI Board 子功能導覽"></nav>
    <div class="toolbar"></div><div class="note"></div>
    <section class="board-shell"><div class="board"></div></section>
    <section class="governance-history"></section>
  </main></div>
  <script>
    const creator = new URLSearchParams(location.search).get("creator") !== "false";
    let session = null;
    // Fixture-only implementation of the canonical AI Board session hydration seam.
    const fixtureAuthUser = { id: "qjc-test", email: "qjc@example.test", user_metadata: { full_name: "QJC" } };
    const fixtureAuthSession = { access_token: "fixture-access-token", refresh_token: "fixture-refresh-token", expires_at: Math.floor(Date.now() / 1000) + 3600 };
    window.getSupabaseAuthUser = async () => ({ user: fixtureAuthUser, authSession: fixtureAuthSession, provider: "fixture" });
    window.supabaseSessionFromUser = (authUser, authSession, provider) => ({
      provider,
      user_uuid: authUser.id,
      uuid: authUser.id,
      name: authUser.user_metadata.full_name,
      email: authUser.email,
      access_token: authSession.access_token,
      refresh_token: authSession.refresh_token,
      expires_at: authSession.expires_at,
      token_type: "bearer",
      loginAt: new Date().toISOString()
    });
    window.persistAiOsSessionOnly = () => {};
    let policy = { investment_mfa_required: false, investment_entry_mfa_required: false, investment_sensitive_write_mfa_required: true, ai_board_mfa_required: true, status: "resolved" };
    window.ZhugeRuntimeSessionProvider = {
      createPlatform: () => ({
        forModule: () => ({
          creator: { getSnapshot: () => ({ is_creator: creator }), resolve: async () => ({ is_creator: creator }) },
          security: {
            loadMfaPolicy: async () => policy,
            getMfaPolicy: () => policy,
            setMfaRequired: async ({ moduleId, required }) => {
              const settingKey = moduleId === "ai-board"
                ? "ai_board_mfa_required"
                : moduleId === "investment-sensitive-write"
                  ? "investment_sensitive_write_mfa_required"
                  : "investment_entry_mfa_required";
              policy = { ...policy, [settingKey]: required, ...(moduleId === "investment-entry" ? { investment_mfa_required: required } : {}) };
              return policy;
            },
            evaluate: () => ({ allowed: true })
          },
          session: { getSnapshot: () => ({ isAuthenticated: true }) }
        })
      })
    };
    window.ZhugeBoardReadService = {
      STATUS_WORKSPACES: [],
      load: async () => ({ tasks: [], principles: [], systemMaps: [] }),
      subscribe: async () => async () => {}
    };
  </script>
  <script src="../shared/components/golden-master-runtime.js"></script>
  <script>
    setTimeout(() => {
      const tab = document.querySelector('[data-board-nav="security"]');
      tab?.click();
      const audit = document.createElement("pre");
      audit.id = "creator-mfa-audit";
      audit.textContent = JSON.stringify({
        creator,
        tab: Boolean(tab),
        section: Boolean(document.querySelector('[data-board-view="security"]')),
        labels: Array.from(document.querySelectorAll(".creator-mfa-row strong")).map(node => node.textContent),
        statuses: Array.from(document.querySelectorAll("[data-mfa-status]")).map(node => node.textContent),
        localStorageKeys: Object.keys(localStorage),
        sessionStorageKeys: Object.keys(sessionStorage)
      });
      document.body.appendChild(audit);
    }, 700);
  </script>
</body></html>
