<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Investment Screenshot Import Browser QA</title>
    <link rel="stylesheet" href="../../shared/theme/tokens.css">
    <link rel="stylesheet" href="../../shared/theme/variables.css">
    <link rel="stylesheet" href="../../shared/theme/typography.css">
    <link rel="stylesheet" href="../../shared/theme/dark.css">
    <link rel="stylesheet" href="../../modules/investment/assets/investment.css">
  </head>
  <body>
    <button type="button" data-test-add-synthetic>測試用合成圖片</button>
    <main id="investmentScreenshotImportApp"></main>
    <script>
      window.addEventListener("error", event => {
        document.getElementById("investmentScreenshotImportApp").textContent = "Browser fixture error: " + (event.error?.message || event.message);
      });
      window.addEventListener("unhandledrejection", event => {
        document.getElementById("investmentScreenshotImportApp").textContent = "Browser fixture rejection: " + (event.reason?.message || event.reason);
      });
    </script>
    <script src="../../modules/investment/utils/safe-html.js"></script>
    <script src="../../modules/investment/models/position.js"></script>
    <script src="../../modules/investment/services/screenshot-import-engine.js?v=20260902-0020"></script>
    <script src="../../modules/investment/services/investment-recognition-provider.js?v=20260902-0020"></script>
    <script src="../../modules/investment/pages/screenshot-import-page.js?v=20260902-0020"></script>
    <script>
      const app = document.getElementById("investmentScreenshotImportApp");
      const cloudPosition = InvestmentPosition.normalize({
        id: "tw-2330",
        symbol: "2330",
        name: "台積電",
        market: "TW",
        quantity: 10,
        avg_cost: 900,
        invested_cost: 9000,
        last_price: 950,
        market_value: 9500,
        unrealized_pnl: 500,
        currency: "TWD"
      });
      const session = InvestmentScreenshotImportEngine.createSession({
        createPreviewUrl: file => URL.createObjectURL(file),
        revokePreviewUrl: url => URL.revokeObjectURL(url)
      });
      const state = { positions: [cloudPosition] };
      function render() {
        const snapshot = session.getSnapshot();
        const recognizedRows = snapshot.recognition?.status === "recognized" ? snapshot.recognition.rows : null;
        const scope = snapshot.recognition?.completeness === "full" ? "full" : snapshot.recognition?.completeness === "partial" ? "partial" : "unknown";
        app.innerHTML = InvestmentScreenshotImportPage.render(state, {
          escape: InvestmentSafeHtml.escape,
          importEngine: InvestmentScreenshotImportEngine,
          importSession: snapshot,
          reconciliation: InvestmentScreenshotImportEngine.reconcile(state.positions, recognizedRows, { scope }),
          snapshotWrite: { status: "idle", form: {} },
          onSnapshotWrite: () => {}
        });
      }
      function refresh() {
        render();
      }
      refresh();
      const recognizedResult = (metadata) => ({
        session_id: metadata.sessionId,
        provider: "fixture-provider",
        model: "fixture-model",
        status: "ready",
        images: [{
          image_id: "screenshot-1",
          status: "ready",
          result: {
            screenshot_type: "holdings",
            broker_or_app: "Browser QA Fixture",
            market: "TW",
            completeness: "full",
            positions: [{
              symbol: "2330",
              name: "台積電",
              quantity: 10,
              unit: "股",
              average_cost: 900,
              total_cost: 9000,
              current_price: 950,
              market_value: 9500,
              unrealized_pnl: 500,
              return_rate: 500 / 9000 * 100,
              currency: "TWD",
              confidence: 0.98,
              confidence_level: "HIGH",
              source_fields: ["代號", "名稱", "股數", "平均成本", "市值"]
            }],
            warnings: []
          }
        }],
        warnings: []
      });
      app.addEventListener("click", event => {
        const action = event.target.closest("[data-investment-import-action]")?.dataset.investmentImportAction;
        if (action === "choose") app.querySelector("[data-investment-import-files]")?.click();
        if (action === "clear") { session.clear(); refresh(); }
        if (action === "remove") { session.removeFile(event.target.closest("[data-investment-import-action]")?.dataset.investmentImportFileId); refresh(); }
        if (action === "start-recognition") session.startRecognition((_files, metadata) => new Promise(resolve => setTimeout(() => resolve(recognizedResult(metadata)), 20))).then(refresh);
        if (action === "ignore-row") { session.ignoreRecognitionRow(event.target.closest("[data-investment-import-action]")?.dataset.investmentImportRowId); refresh(); }
        if (action === "restore-recognition") { session.restoreRecognitionResult(); refresh(); }
        if (action === "confirm-preview") { session.confirmPreview(); refresh(); }
      });
      app.addEventListener("submit", event => {
        const form = event.target.closest("[data-investment-import-edit]");
        if (!form) return;
        event.preventDefault();
        const values = new FormData(form);
        session.updateRecognitionRow(form.dataset.investmentImportRowId, {
          symbol: values.get("symbol"),
          name: values.get("name"),
          quantity: values.get("quantity"),
          averageCost: values.get("averageCost"),
          investedCost: values.get("investedCost"),
          currency: values.get("currency")
        });
        refresh();
      });
      app.addEventListener("change", event => {
        if (!event.target.matches("[data-investment-import-files]")) return;
        session.addFiles(event.target.files);
        event.target.value = "";
        refresh();
      });
      document.querySelector("[data-test-add-synthetic]").addEventListener("click", () => {
        const pngBytes = Uint8Array.from(atob("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="), value => value.charCodeAt(0));
        session.addFiles([new File([pngBytes], "synthetic-holdings.png", { type: "image/png", lastModified: 1 })]);
        refresh();
      });
    </script>
  </body>
</html>
