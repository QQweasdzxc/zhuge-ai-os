<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SkyEye mobile browser guard</title>
  <link rel="stylesheet" href="../shared/theme/tokens.css">
  <link rel="stylesheet" href="../shared/theme/responsive-modernization.css">
  <link rel="stylesheet" href="../modules/skyeye/assets/skyeye.css">
</head>
<body class="skyeye-page">
  <div class="zhuge-module-shell skyeye-shell">
    <main class="app skyeye-app" aria-label="SkyEye browser fixture">
      <section class="skyeye-desktop-guard" aria-label="天眼使用限制">
        <strong>🛰️ 天眼目前提供手機版地圖</strong>
        <p>請使用手機寬度開啟天眼。</p>
      </section>
      <section class="skyeye-mobile-stage" data-skyeye-stage>
        <div class="skyeye-topbar">
          <div><h1>🛰️ 天眼</h1><p data-skyeye-location-label>📍 板橋車站附近</p><small data-skyeye-location-accuracy>由地點搜尋</small></div>
          <div class="skyeye-topbar-actions">
            <button class="skyeye-nav-button" type="button" aria-label="開啟導覽">☰</button>
            <button class="skyeye-refresh-button" type="button" aria-label="重新讀取">↻</button>
          </div>
        </div>
        <div class="skyeye-map" aria-label="天眼地圖"></div>
        <section class="skyeye-location-controls" aria-label="天眼地點控制">
          <form class="skyeye-search-form" data-skyeye-search-form><label class="sr-only" for="fixtureSearch">搜尋地點</label><input id="fixtureSearch" data-skyeye-search-input placeholder="搜尋地點、地址或景點"><button type="submit">搜尋</button></form>
          <div class="skyeye-location-actions"><button type="button" data-skyeye-my-location>📍 回到我的位置</button><button type="button" data-skyeye-search-area>搜尋此區域</button></div>
          <div class="skyeye-search-results" data-skyeye-search-results hidden></div>
        </section>
        <div class="skyeye-overlay-layer" aria-label="地圖浮動資料視窗">
          <article class="skyeye-floating-window" style="left:12px;top:72px">
            <header class="skyeye-overlay-handle"><strong class="skyeye-overlay-title">📷 CCTV</strong><div class="skyeye-overlay-actions"><button type="button" aria-label="縮小">−</button><button type="button" aria-label="關閉">×</button></div></header>
            <div class="skyeye-overlay-body"><p class="skyeye-overlay-detail">公開道路影像 evidence</p><button class="skyeye-overlay-detail-button" type="button">查看詳情</button></div>
          </article>
          <div class="skyeye-minimized-stack"><button class="skyeye-minimized-window" type="button"><span>🌦️</span><span>天氣</span><small>展開</small></button><button class="skyeye-minimized-window" type="button"><span>🌏</span><span>地震</span><small>展開</small></button></div>
        </div>
        <div class="skyeye-status-pill" data-state="loading" role="status">正在確認資料來源…</div>
        <section class="skyeye-bottom-sheet" data-skyeye-sheet data-sheet-state="collapsed" aria-label="天眼圖層與資料詳情">
          <button type="button" class="skyeye-sheet-handle" aria-label="拖曳查看天眼資料"></button>
          <div class="skyeye-sheet-heading"><h2><span>摘要</span><small>｜板橋車站附近</small></h2><button type="button" aria-label="關閉資料詳情">×</button></div>
          <div class="skyeye-sheet-mode-actions"><button type="button" data-skyeye-sheet-to="collapsed">摘要</button><button type="button" data-skyeye-sheet-to="half">圖層</button><button type="button" data-skyeye-sheet-to="expanded">完整資料</button></div>
          <div class="skyeye-layer-grid"><button class="skyeye-layer-button" type="button" aria-pressed="true" data-state="available">📹 CCTV｜附近 12 支<small>可用</small></button><button class="skyeye-layer-button" type="button" aria-pressed="false" data-state="available">🌦️ 天氣<small>可用</small></button><button class="skyeye-layer-button" type="button" aria-pressed="false" data-state="empty">🍃 空氣品質<small>此區域沒有資料</small></button></div>
          <div class="skyeye-evidence-summary"><strong>諸葛目前畫面摘要</strong><p>目前只根據已載入 evidence 整理。</p></div>
        </section>
      </section>
    </main>
  </div>
  <script>
    document.querySelector('[data-skyeye-search-form]').addEventListener('submit', event => {
      event.preventDefault();
      const results = document.querySelector('[data-skyeye-search-results]');
      results.hidden = false;
      results.innerHTML = '<button class="skyeye-search-result" type="button"><strong>板橋車站</strong><small>公開地理編碼</small></button>';
      results.querySelector('button').addEventListener('click', () => {
        document.querySelector('[data-skyeye-location-label]').textContent = '📍 板橋車站附近';
        results.hidden = true;
      });
    });
    document.querySelectorAll('[data-skyeye-sheet-to]').forEach(button => button.addEventListener('click', () => {
      document.querySelector('[data-skyeye-sheet]').dataset.sheetState = button.dataset.skyeyeSheetTo;
    }));
  </script>
</body>
</html>
