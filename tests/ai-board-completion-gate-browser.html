<!doctype html>
<meta charset="utf-8">
<title>AI Board completion gate browser regression</title>
<link rel="stylesheet" href="../shared/theme/zhuge-navigation.css">
<link rel="stylesheet" href="../shared/theme/task-drawer.css">
<div class="zhuge-module-shell">
  <div id="zhugeSharedNavigation" data-external-root="../" data-active-workspace="ai-board" data-version="0.9.0-alpha.9.13"></div>
  <div class="main">
    <aside><button data-board-nav="board" type="button">📋 工作看板</button><button data-board-nav="principles" type="button">📘 工程準則</button><button data-board-nav="system-map" type="button">🗺️ 系統藍圖</button></aside>
    <div class="actions"><button class="btn">重新整理</button></div><div class="toolbar"></div><div class="note"></div>
    <section class="board-shell"><div class="board" id="boardColumns" data-shared-task-board="ai-board"></div></section>
    <section class="board-subview principles-view" data-board-view="principles" hidden><div id="principlesCards"></div></section><section class="board-subview system-map-view" data-board-view="system-map" hidden><div id="systemMapCards"></div></section><div class="sidefoot"></div>
  </div>
</div>
<script src="../shared/config/version.js"></script><script src="../shared/components/zhuge-navigation.js"></script><script src="../shared/components/task-card.js"></script><script src="../shared/components/task-drawer.js"></script><script src="../shared/components/task-board.js"></script><script src="../shared/components/golden-master.js"></script>
<script>
  let session = null;
  window.getSharedSessionSnapshot = () => ({ user_id: "qjc-test", isAuthenticated: true });
  // Fixture-only implementation of the canonical AI Board session hydration seam.
  const fixtureAuthUser = { id: "qjc-test", email: "qjc@example.test", user_metadata: { full_name: "QJC" } };
  const fixtureAuthSession = { access_token: "fixture-access-token", refresh_token: "fixture-refresh-token", expires_at: Math.floor(Date.now() / 1000) + 3600 };
  window.getSupabaseAuthUser = async () => ({ user: fixtureAuthUser, authSession: fixtureAuthSession, provider: "fixture" });
  window.supabaseSessionFromUser = (authUser, authSession, provider) => ({
    provider,
    user_uuid: authUser.id,
    uuid: authUser.id,
    name: authUser.user_metadata.full_name,
    email: authUser.email,
    access_token: authSession.access_token,
    refresh_token: authSession.refresh_token,
    expires_at: authSession.expires_at,
    token_type: "bearer",
    loginAt: new Date().toISOString()
  });
  window.persistAiOsSessionOnly = () => {};
  window.ZhugeRuntimeSessionProvider = {
    createPlatform: () => ({
      forModule: () => ({
        security: { evaluate: () => ({ allowed: true }) },
        session: { getSnapshot: () => ({ user_id: "qjc-test", isAuthenticated: true }) }
      })
    })
  };
  const workspaces = [
    { id: "ws-todo", key: "todo", name: "待辦", sortOrder: 10, active: true },
    { id: "ws-co", key: "co", name: "Co區", sortOrder: 20, active: true },
    { id: "ws-gpt", key: "gpt", name: "GPT區", sortOrder: 30, active: true },
    { id: "ws-qjc", key: "qjc", name: "QJC驗證", sortOrder: 40, active: true },
    { id: "ws-done", key: "completed", name: "已完成", sortOrder: 50, active: true }
  ];
  const tasks = [
    { id: "button-task", workCode: "TASK-BUTTON", title: "Drawer 驗收", status: "qa", workspaceId: "ws-qjc", workspaceKey: "qjc", workspaceName: "QJC驗證", assignee: "QJC", summary: "Co、GPT 與 Regression 證據完成。", usageScenario: "PM 由 Drawer 執行正式驗收。", acceptanceCriteria: "確認功能符合需求\n確認正式 Lifecycle 與 Audit 已同步" },
    { id: "drag-task", workCode: "TASK-DRAG", title: "拖曳驗收", status: "qa", workspaceId: "ws-qjc", workspaceKey: "qjc", workspaceName: "QJC驗證", assignee: "QJC", summary: "Co、GPT 與 Regression 證據完成。", usageScenario: "PM 由卡片拖曳執行正式驗收。", acceptanceCriteria: "確認功能符合需求\n確認正式 Lifecycle 與 Audit 已同步" },
    { id: "gpt-drag-task", workCode: "TASK-GPT-DRAG", title: "GPT 狀態拖曳驗收", status: "qa", workspaceId: "ws-qjc", workspaceKey: "qjc", workspaceName: "QJC驗證", assignee: "GPT", summary: "卡片位於 QJC，但正式狀態仍是 qa/GPT。", usageScenario: "PM 在 QJC驗證將卡片拖至完成，觸發受控前置交接。", acceptanceCriteria: "確認 qa/GPT → qa/QJC → done/QJC 原子完成" },
    { id: "gpt-fail-task", workCode: "TASK-GPT-FAIL", title: "GPT 證據不足拖曳驗收", status: "qa", workspaceId: "ws-qjc", workspaceKey: "qjc", workspaceName: "QJC驗證", assignee: "GPT", summary: "缺少 GPT Evidence 的失敗案例。", usageScenario: "PM Acceptance Gate 應拒絕並維持原狀。", acceptanceCriteria: "確認 Gate 失敗時卡片與正式狀態不變" }
  ];
  const calls = [];
  const audit = [];
  tasks.forEach(task => {
    task.workflowVersionId = "fixture-workflow-v2";
    task.currentWorkflowStepId = "step-qjc";
  });
  let promptCalls = 0;
  const workspaceFor = id => workspaces.find(workspace => workspace.id === id);
  window.ZhugeBoardReadService = {
    statusDescriptorFor: status => ({ ready: { label: "Ready" }, inprogress: { label: "推進中" }, qa: { label: "驗證中" }, done: { label: "已完成" } }[status] || { label: "未知工程狀態" }),
    isGovernanceTerminal: task => ["merged", "cancelled"].includes(String(task?.status || "")),
    load: async () => ({ boardInstanceId: "fixture-board", workspaces, tasks, principles: [], systemMaps: [] }),
    loadChecklist: async taskId => [
      { id: "co", stage: "co", state: "pass", required: true, label: "Co 開發驗證", evidenceNote: "Co Developer QA PASS" },
      { id: "gpt", stage: "gpt", state: taskId === "gpt-fail-task" ? "not_verified" : "pass", required: true, label: "GPT 工程審查", evidenceNote: taskId === "gpt-fail-task" ? "" : "GPT Review PASS" },
      { id: "regression", stage: "gpt", checklistType: "batch_regression", itemKey: "regression-evidence", state: "pass", required: true, label: "Regression Evidence", evidenceNote: "Regression PASS" },
      { id: `pm-${taskId}`, stage: "qjc", itemKey: "pm-acceptance", state: "not_verified", required: true, label: "PM Acceptance", evidenceNote: "" }
    ],
    loadMovementHistory: async () => [],
    moveTaskWorkspace: async (taskId, targetWorkspaceId) => { const task = tasks.find(item => item.id === taskId); const workspace = workspaceFor(targetWorkspaceId); if (!task || !workspace) throw new Error("workspace missing"); calls.push(`${taskId}:${targetWorkspaceId}`); Object.assign(task, { workspaceId: workspace.id, workspaceKey: workspace.key, workspaceName: workspace.name }); return task; },
    pmAcceptTaskFromQjcDrop: async ({ taskId, itemId, evidenceNote }) => {
      const task = tasks.find(item => item.id === taskId);
      if (!task || itemId !== `pm-${task.id}`) throw new Error("fixture only supports PM Acceptance");
      const fromWorkspace = workspaceFor(task.workspaceId);
      if (fromWorkspace?.key !== "qjc") throw new Error("PM Acceptance must start from QJC");
      if (task.id === "gpt-fail-task") {
        calls.push(`pm-acceptance-fail:${task.id}`);
        throw new Error("PM Acceptance 尚缺 GPT 工程審查 Evidence；卡片未移動，正式狀態不變。");
      }
      if (task.assignee === "GPT") {
        calls.push(`pretransition:${task.id}:qa/QJC`);
        Object.assign(task, { assignee: "QJC" });
      }
      calls.push(`pm-acceptance:${task.id}:pass`);
      const completedWorkspace = workspaceFor("ws-done");
      audit.push({ action: "task_completed_after_pm_acceptance", lifecycle: "pm_acceptance_pass", taskId: task.id, status: "done", workspaceKey: completedWorkspace.key, assignee: "QJC", evidenceNote });
      Object.assign(task, { status: "done", workspaceId: completedWorkspace.id, workspaceKey: completedWorkspace.key, workspaceName: completedWorkspace.name, assignee: "QJC", completionAt: "2026-08-31T12:00:00.000Z" });
      return { id: itemId, state: "pass", evidenceNote, beforeWorkspace: fromWorkspace?.key, afterWorkspace: completedWorkspace.key };
    },
    updateChecklistItem: async ({ id, state, evidenceNote }) => ({ id, state, evidenceNote }),
    subscribe: async () => async () => {}
  };
  window.ZhugeBoardReadService.lifecycle = {
    contract: { id: "module-c-lifecycle-acceptance-v1", acceptanceAction: "qjc-drop-to-completed" },
    capabilities: { pmAcceptanceFromQjcDrop: true },
    acceptFromQjcDrop: window.ZhugeBoardReadService.pmAcceptTaskFromQjcDrop
  };
  window.ZhugeBoardReadService.workflow = {
    contract: { id: "module-c-lifecycle-acceptance-v2", source: "module-c-mother", owner: "board-instance" },
    capabilities: { workspaceDecision: true, completion: true, reopen: true },
    readOnly: false,
    get: async () => ({
      published: {
        id: "fixture-workflow-v2",
        steps: [
          { id: "step-todo", key: "todo", name: "待辦", workspaceId: "ws-todo", isCompletion: false },
          { id: "step-co", key: "co", name: "Co區", workspaceId: "ws-co", isCompletion: false },
          { id: "step-gpt", key: "gpt", name: "GPT區", workspaceId: "ws-gpt", isCompletion: false },
          { id: "step-qjc", key: "qjc", name: "QJC驗證", workspaceId: "ws-qjc", isCompletion: false },
          { id: "step-completed", key: "completed", name: "已完成", workspaceId: "ws-done", isCompletion: true }
        ]
      },
      state: { publishedWorkflowVersionId: "fixture-workflow-v2" }
    }),
    reconcileWorkspaceDecision: async input => {
      if (input.targetWorkspaceId === "ws-done") {
        return window.ZhugeBoardReadService.pmAcceptTaskFromQjcDrop({ taskId: input.taskId, itemId: `pm-${input.taskId}`, evidenceNote: input.decisionNote });
      }
      return window.ZhugeBoardReadService.moveTaskWorkspace(input.taskId, input.targetWorkspaceId);
    }
  };
  window.prompt = () => { promptCalls += 1; return "PM Drawer Evidence"; };
  window.confirm = () => true;
  window.__gateCalls = calls;
  window.__gateAudit = audit;
</script>
<script>window.__gateErrors = []; window.addEventListener('error', event => window.__gateErrors.push(`${event.message} @${event.filename}:${event.lineno}:${event.colno} ${(event.error?.stack || '')}`));</script>
<script src="../shared/components/task-action-contract.js"></script>
<script src="../shared/components/task-action-adapters.js"></script>
<script src="../shared/components/golden-master-runtime.js"></script>
<script>
  window.__runtimeLoaded = Boolean(window.ZhugeBoardRuntime);
  setTimeout(() => window.ZhugeBoardRuntime?.refresh()?.catch(error => window.__gateErrors.push(`refresh ${error.stack || error.message}`)), 100);
  setTimeout(() => document.querySelector('[data-task-id="button-task"]')?.click(), 900);
  setTimeout(() => document.querySelector('[data-pm-accept]')?.click(), 2000);
  setTimeout(() => {
    const card = document.querySelector('[data-task-id="drag-task"]'); const column = document.querySelector('.process[data-workspace-key="completed"]');
    const data = { values: { "application/x-zhuge-shared-task-card": "drag-task" }, types: ["application/x-zhuge-shared-task-card"], setData(type, value) { this.values[type] = value; }, getData(type) { return this.values[type]; } };
    card?.ondragstart({ dataTransfer: data }); column?.ondrop({ preventDefault() {}, dataTransfer: data });
  }, 3200);
  function dropToCompleted(taskId) {
    const card = document.querySelector(`[data-task-id="${taskId}"]`); const column = document.querySelector('.process[data-workspace-key="completed"]');
    const data = { values: { "application/x-zhuge-shared-task-card": taskId }, types: ["application/x-zhuge-shared-task-card"], setData(type, value) { this.values[type] = value; }, getData(type) { return this.values[type]; } };
    card?.ondragstart({ dataTransfer: data }); column?.ondrop({ preventDefault() {}, dataTransfer: data });
  }
  setTimeout(() => dropToCompleted("gpt-drag-task"), 3600);
  setTimeout(() => dropToCompleted("gpt-fail-task"), 4200);
  setTimeout(() => { const result = tasks.map(item => `${item.id}:${item.status}:${item.workspaceKey}:${item.assignee}`).join('|'); const auditNode = document.createElement('pre'); auditNode.id = 'completion-gate-audit'; const completedPasses = audit.filter(item => item.status === "done" && item.workspaceKey === "completed" && item.assignee === "QJC"); const failedTask = tasks.find(item => item.id === "gpt-fail-task"); auditNode.textContent = `runtime=${window.__runtimeLoaded};calls=${window.__gateCalls.join(',')};result=${result};sameFormalResult=${completedPasses.length === 3 && audit.length === 3};audit=${window.__gateAudit.map(item => `${item.taskId}:${item.action}:${item.lifecycle}:${item.workspaceKey}`).join('|')};moveCalls=${window.__gateCalls.filter(item => item.includes('ws-done') && !item.startsWith('pm-acceptance')).length};gptCheckboxes=${document.querySelectorAll('.checklist-check[data-id="gpt"]').length};gptLabel=${document.body.textContent.includes('工程紀錄（不列入 QJC 完成 Gate）')};failStayed=${failedTask?.status === "qa" && failedTask?.workspaceKey === "qjc" && failedTask?.assignee === "GPT"};failMessage=${document.body.textContent.includes('尚缺 GPT 工程審查 Evidence')};promptCalls=${promptCalls};errors=${window.__gateErrors.join('|')}`; document.body.appendChild(auditNode); }, 6000);
</script>
