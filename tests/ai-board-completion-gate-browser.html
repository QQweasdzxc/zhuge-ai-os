<!doctype html>
<meta charset="utf-8">
<title>AI Board completion gate browser regression</title>
<link rel="stylesheet" href="../shared/theme/zhuge-navigation.css">
<link rel="stylesheet" href="../shared/theme/task-drawer.css">
<div class="zhuge-module-shell">
  <div id="zhugeSharedNavigation" data-external-root="../" data-active-workspace="ai-board" data-version="0.9.0-alpha.9.13" data-build="20260817-1416"></div>
  <div class="main">
    <aside><button data-board-nav="board" type="button">📋 工作看板</button><button data-board-nav="principles" type="button">📘 工程準則</button><button data-board-nav="system-map" type="button">🗺️ 系統藍圖</button></aside>
    <div class="actions"><button class="btn">重新整理</button></div><div class="toolbar"></div><div class="note"></div>
    <section class="board-shell"><div class="board" id="boardColumns"></div></section>
    <section class="board-subview principles-view" data-board-view="principles" hidden><div id="principlesCards"></div></section><section class="board-subview system-map-view" data-board-view="system-map" hidden><div id="systemMapCards"></div></section><div class="sidefoot"></div>
  </div>
</div>
<script src="../shared/config/version.js"></script><script src="../shared/components/zhuge-navigation.js"></script><script src="../shared/components/task-drawer.js"></script>
<script>
  window.getSharedSessionSnapshot = () => ({ user_id: "qjc-test", isAuthenticated: true });
  window.ZhugeRuntimeSessionProvider = {
    createPlatform: () => ({
      forModule: () => ({
        security: { evaluate: () => ({ allowed: true }) },
        session: { getSnapshot: () => ({ user_id: "qjc-test", isAuthenticated: true }) }
      })
    })
  };
  const workspaces = [
    { id: "ws-todo", key: "todo", name: "待辦", sortOrder: 10, active: true },
    { id: "ws-co", key: "co", name: "Co區", sortOrder: 20, active: true },
    { id: "ws-gpt", key: "gpt", name: "GPT區", sortOrder: 30, active: true },
    { id: "ws-qjc", key: "qjc", name: "QJC驗證", sortOrder: 40, active: true },
    { id: "ws-done", key: "done", name: "已完工", sortOrder: 50, active: true }
  ];
  const tasks = [
    { id: "button-task", workCode: "TASK-BUTTON", title: "QJC 位置移動", status: "qa", workspaceId: "ws-qjc", workspaceKey: "qjc", workspaceName: "QJC驗證", assignee: "QJC", summary: "Co 與 QJC 證據完成。", usageScenario: "QJC 將卡片移到任意工作區。" },
    { id: "drag-task", workCode: "TASK-DRAG", title: "QJC 拖曳移動", status: "qa", workspaceId: "ws-gpt", workspaceKey: "gpt", workspaceName: "GPT區", assignee: "QJC", summary: "Co 與 QJC 證據完成。", usageScenario: "QJC 將卡片拖到其他工作區。" }
  ];
  const calls = [];
  const workspaceFor = id => workspaces.find(workspace => workspace.id === id);
  window.ZhugeBoardReadService = {
    statusDescriptorFor: status => ({ ready: { label: "Ready" }, inprogress: { label: "推進中" }, qa: { label: "驗證中" }, done: { label: "已完成" } }[status] || { label: "未知工程狀態" }),
    isGovernanceTerminal: task => ["merged", "cancelled"].includes(String(task?.status || "")),
    load: async () => ({ workspaces, tasks, principles: [], systemMaps: [] }),
    loadChecklist: async () => [
      { id: "co", stage: "co", state: "pass", required: true, label: "Co 開發驗證", evidenceNote: "Co Developer QA PASS" },
      { id: "gpt", stage: "gpt", state: "not_verified", required: true, label: "GPT 工程審查", evidenceNote: "" },
      { id: "qjc", stage: "qjc", state: "pass", required: true, label: "QJC PM 驗收", evidenceNote: "QJC PM QA PASS" }
    ],
    loadMovementHistory: async () => [],
    moveTaskWorkspace: async (taskId, targetWorkspaceId) => { const task = tasks.find(item => item.id === taskId); const workspace = workspaceFor(targetWorkspaceId); if (!task || !workspace) throw new Error("workspace missing"); calls.push(`${taskId}:${targetWorkspaceId}`); Object.assign(task, { workspaceId: workspace.id, workspaceKey: workspace.key, workspaceName: workspace.name }); return task; },
    updateChecklistItem: async () => ({}),
    subscribe: async () => async () => {}
  };
  window.confirm = () => true;
  window.__gateCalls = calls;
</script>
<script>window.__gateErrors = []; window.addEventListener('error', event => window.__gateErrors.push(`${event.message} @${event.filename}:${event.lineno}:${event.colno} ${(event.error?.stack || '')}`));</script>
<script src="../app/Board/ai/board-runtime.js"></script>
<script>
  window.__runtimeLoaded = Boolean(window.ZhugeBoardRuntime);
  setTimeout(() => window.ZhugeBoardRuntime?.refresh()?.catch(error => window.__gateErrors.push(`refresh ${error.stack || error.message}`)), 100);
  setTimeout(() => document.querySelector('[data-task-id="button-task"]')?.click(), 900);
  setTimeout(() => window.ZhugeBoardRuntime?.moveTaskToWorkspace(tasks[0], "ws-done"), 1200);
  setTimeout(() => {
    const card = document.querySelector('[data-task-id="drag-task"]'); const zone = document.querySelector('.process[data-workspace-key="qjc"] .cards');
    const data = { values: { "application/x-zhuge-task-id": "drag-task" }, types: ["application/x-zhuge-task-id"], setData(type, value) { this.values[type] = value; }, getData(type) { return this.values[type]; } };
    card?.ondragstart({ dataTransfer: data }); zone?.ondrop({ preventDefault() {}, dataTransfer: data });
  }, 1700);
  setTimeout(() => { const audit = document.createElement('pre'); audit.id = 'completion-gate-audit'; audit.textContent = `runtime=${window.__runtimeLoaded};calls=${window.__gateCalls.join(',')};engineeringDone=${tasks.filter(item => item.status === 'done').length};assignees=${tasks.map(item => item.assignee).join(',')};gptCheckboxes=${document.querySelectorAll('.checklist-check[data-id="gpt"]').length};gptLabel=${document.body.textContent.includes('工程紀錄（不列入 QJC 完成 Gate）')};errors=${window.__gateErrors.join('|')}`; document.body.appendChild(audit); }, 2800);
</script>
