<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>Template parity shared entry browser regression</title>
  <link rel="stylesheet" href="../shared/theme/zhuge-navigation.css">
  <link rel="stylesheet" href="../shared/theme/task-board.css">
  <link rel="stylesheet" href="../shared/theme/task-card.css">
  <link rel="stylesheet" href="../shared/theme/task-drawer.css">
  <link rel="stylesheet" href="../shared/theme/golden-master.css">
</head>
<body>
  <div class="zhuge-module-shell">
    <main class="main">
      <div class="workspace-tabs workspace-subnav"><button data-board-nav="board" type="button">📋 工作看板</button></div>
      <div class="workspace-canvas">
        <div data-board-main-view data-golden-master-surface></div>
      </div>
    </main>
  </div>
  <script>
    let session = null;
    const fixtureAuthUser = { id: "parity-test", email: "parity@example.test", user_metadata: { full_name: "Parity QA" } };
    const fixtureAuthSession = { access_token: "fixture-access-token", refresh_token: "fixture-refresh-token", expires_at: Math.floor(Date.now() / 1000) + 3600 };
    window.getSupabaseAuthUser = async () => ({ user: fixtureAuthUser, authSession: fixtureAuthSession, provider: "fixture" });
    window.supabaseSessionFromUser = (user, authSession, provider) => ({ provider, user_uuid: user.id, uuid: user.id, email: user.email, access_token: authSession.access_token, refresh_token: authSession.refresh_token, expires_at: authSession.expires_at });
    window.persistAiOsSessionOnly = () => {};
    window.ZhugeRuntimeSessionProvider = { createPlatform: () => ({ forModule: () => ({ security: { evaluate: () => ({ allowed: true }) }, session: { getSnapshot: () => ({ isAuthenticated: true }) } }) }) };
    const fixtureWorkspaces = [
      { id: "ai-todo", key: "todo", name: "待辦", sortOrder: 10, active: true },
      { id: "wt-todo", key: "worktodo-todo", name: "待開始", applicationScope: "worktodo", sortOrder: 10, active: true },
      { id: "c-todo", key: "mdtk-todo", name: "MDTK｜待開始", boardInstanceId: "q-at", sortOrder: 10, active: true }
    ];
    const fixtureService = {
      statusDescriptorFor: status => ({ label: String(status || "未知") }),
      normalizeStatus: status => String(status || "ready"),
      isGovernanceTerminal: () => false,
      load: async () => ({ boardInstanceId: "q-at", boardName: "Parity QA", taskCodePrefix: "MDTK", workspaces: fixtureWorkspaces, tasks: [], principles: [], systemMaps: [] }),
      subscribe: async () => async () => {}
    };
    window.ZhugeBoardReadService = fixtureService;
    window.ZhugeModulePublishService = { publish: async () => ({}), adopt: async () => ({}) };
    window.__parityEntryAudit = null;
  </script>
  <script src="../shared/components/task-card.js"></script>
  <script src="../shared/components/task-drawer.js"></script>
  <script src="../shared/components/task-board.js"></script>
  <script src="../shared/components/golden-master.js"></script>
  <script src="../shared/components/activity-classifier.js"></script>
  <script src="../shared/components/activity-text-renderer.js"></script>
  <script src="../shared/components/task-card-summary.js"></script>
  <script src="../shared/components/task-action-contract.js"></script>
  <script src="../shared/components/task-action-adapters.js"></script>
  <script src="../shared/components/template-parity-engine.js"></script>
  <script src="../shared/components/golden-master-runtime.js"></script>
  <script>
    const parityEntryScopes = [
      ["ai_board", "AI Board", ""],
      ["worktodo", "WorkTodo", ""],
      ["c", "QAT", "q-at"]
    ];
    const waitForRuntime = () => new Promise(resolve => setTimeout(resolve, 140));
    (async () => {
      await waitForRuntime();
      const rows = [];
      for (const [scope, label, boardInstanceId] of parityEntryScopes) {
        window.ZhugeBoardRuntime.start({ applicationScope: scope, boardInstanceId, service: fixtureService });
        await waitForRuntime();
        const button = document.getElementById("templateParityBtn");
        button?.click();
        rows.push({
          scope: label,
          count: document.querySelectorAll("#templateParityBtn").length,
          text: button?.textContent.trim() || "",
          dataAction: button?.dataset.goldenMasterAction || "",
          visible: Boolean(button && (button.offsetWidth || button.offsetHeight || button.getClientRects().length)),
          report: document.querySelector("[data-template-parity-report]")?.dataset.templateParityStatus || "missing",
          inventoryCount: document.querySelectorAll("[data-template-parity-capability]").length,
          inventoryStatuses: Array.from(document.querySelectorAll("[data-template-parity-capability] .template-parity-capability-status")).map(node => node.textContent.trim()),
          drawerInventory: document.querySelector('[data-template-parity-capability-id="drawer"]')?.textContent.includes("約定日期框架") || false
        });
      }
      window.__parityEntryAudit = rows;
      const audit = document.createElement("pre");
      audit.id = "template-parity-entry-audit";
      audit.textContent = JSON.stringify(rows);
      document.body.appendChild(audit);
    })().catch(error => {
      const audit = document.createElement("pre");
      audit.id = "template-parity-entry-audit";
      audit.textContent = JSON.stringify({ error: error?.stack || error?.message || String(error) });
      document.body.appendChild(audit);
    });
  </script>
</body>
</html>
