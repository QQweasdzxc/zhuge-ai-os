<!doctype html>
<meta charset="utf-8">
<title>C Mother Template publish browser regression</title>
<div id="publishTarget"></div>
<script src="../shared/config/version.js"></script>
<script src="../shared/config/template-release.js"></script>
<script>
  const snapshot = window.ZhugeMotherTemplateRelease.getSnapshot();
  const oldBuild = "20260901-1550";
  const oldCommit = "0123456789abcdef0123456789abcdef01234567";
  const oldFingerprint = "a".repeat(64);
  const published = (build, sourceCommit, sourceFingerprint, cStatus = "published_pending_reload") => ({
    moduleId: "c",
    developmentVersion: snapshot.developmentVersion,
    developmentBuild: snapshot.developmentBuild,
    developmentSourceCommit: snapshot.sourceCommit,
    developmentSourceFingerprint: snapshot.sourceFingerprint,
    publishedVersion: snapshot.publishedVersion,
    publishedBuild: build,
    sourceCommit,
    sourceFingerprint,
    publishedAt: "2026-09-01T08:10:00.000Z",
    consumers: {
      c: { status: cStatus, moduleVersion: snapshot.publishedVersion, templateVersion: snapshot.publishedVersion, build, identityMatches: cStatus === "adopted" },
      worktodo: { status: "published_pending_reload", moduleVersion: snapshot.publishedVersion, templateVersion: snapshot.publishedVersion, build, identityMatches: true },
      "ai-board": { status: "published_pending_reload", moduleVersion: snapshot.publishedVersion, templateVersion: snapshot.publishedVersion, build, identityMatches: true },
    },
  });
  const calls = [];
  const development = {
    moduleId: "c",
    developmentVersion: snapshot.developmentVersion,
    developmentBuild: snapshot.developmentBuild,
    developmentSourceCommit: snapshot.sourceCommit,
    developmentSourceFingerprint: snapshot.sourceFingerprint,
    version: snapshot.developmentVersion,
    build: snapshot.developmentBuild,
    sourceCommit: snapshot.sourceCommit,
    sourceFingerprint: snapshot.sourceFingerprint,
    publishedVersion: snapshot.developmentVersion,
    publishedBuild: snapshot.developmentBuild,
  };
  const nextRelease = published(snapshot.developmentBuild, snapshot.sourceCommit, snapshot.sourceFingerprint, "published_pending_reload");
  window.ZhugeBoardReadService = {
    listModuleConsumers: async () => [
      { consumerId: "c", consumerLabel: "C 母版" },
      { consumerId: "worktodo", consumerLabel: "WorkTodo" },
      { consumerId: "ai-board", consumerLabel: "AI Board" },
    ],
  };
  window.ZhugeModulePublishService = {
    getDevelopmentIdentity: () => ({ ...development }),
    compareSourceIdentity: (loaded, current) => ({
      status: loaded.sourceCommit === current.sourceCommit && loaded.sourceFingerprint === current.sourceFingerprint ? "matched" : "mismatch",
    }),
    read: async () => published(oldBuild, oldCommit, oldFingerprint, "adopted"),
    publish: async payload => {
      calls.push({ name: "publish", payload });
      return nextRelease;
    },
    adopt: async options => {
      calls.push({ name: "adopt", consumerId: options.consumerId, build: options.release.publishedBuild });
      return options.release;
    },
  };
  window.confirm = () => true;
</script>
<script src="../shared/components/c-template-preview.js"></script>
<script>
  const target = document.getElementById("publishTarget");
  window.ZhugeCanonicalCTemplatePreview.mountBanner(target, { title: "C 母版發布測試" });
  setTimeout(() => target.querySelector("[data-module-publish]")?.click(), 900);
  setTimeout(() => {
    const button = target.querySelector("[data-module-publish]");
    const feedback = target.querySelector("[data-c-template-release-feedback]");
    const audit = document.createElement("pre");
    audit.id = "c-publish-audit";
    audit.textContent = JSON.stringify({
      build: window.ZhugeFoundationConfig.version.build,
      buttonBeforeClick: Boolean(button),
      buttonDisabledAfter: Boolean(button?.disabled),
      publishCalls: calls.filter(call => call.name === "publish").length,
      publishConsumerIds: calls.find(call => call.name === "publish")?.payload.consumerIds || [],
      publishBuild: calls.find(call => call.name === "publish")?.payload.publishedBuild || "",
      adoptCalls: calls.filter(call => call.name === "adopt").map(call => `${call.consumerId}:${call.build}`),
      feedback: feedback?.textContent || "",
      publishedBuild: target.querySelector("[data-c-template-release-panel]")?.textContent.match(/Published C\s+[^·]+ · Build (202\d{5}-\d{4})/)?.[1] || "",
      healthEntry: target.textContent.includes("資料健康") || document.querySelector("#healthCheckBtn") !== null,
    });
    document.body.appendChild(audit);
  }, 2400);
</script>
