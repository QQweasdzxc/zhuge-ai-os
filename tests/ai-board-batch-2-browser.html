<!doctype html>
<meta charset="utf-8">
<title>AI Board Batch 2 browser regression fixture</title>
<link rel="stylesheet" href="../shared/theme/global-navigation.css">
<aside id="zhugeGlobalNavigation" class="zhuge-global-nav" data-root-path="../"></aside>
<div class="main">
  <aside>
    <div data-board-nav="home" role="button" tabindex="0">AI Board</div>
    <div data-board-nav="all" role="button" tabindex="0">全部工作</div>
    <div data-board-nav="principles" role="button" tabindex="0">Engineering Center</div>
  </aside>
  <div class="actions"><button class="btn">重新整理</button></div>
  <div class="toolbar"><input id="boardSearch" type="search" aria-label="搜尋 TASK"></div>
  <div class="note"></div>
  <section class="board-shell">
    <section class="principles"><span class="count">0</span><div class="cards"></div></section>
    <section class="process" data-status="todo"><span class="count">0</span><button class="add" onclick="openQuickAdd('todo')">＋ 新增 TASK</button><div class="cards"></div></section>
    <section class="process" data-status="progress"><span class="count">0</span><div class="cards"></div></section>
    <section class="process" data-status="qa"><span class="count">0</span><div class="cards"></div></section>
    <section class="process" data-status="done"><span class="count">0</span><div class="cards"></div></section>
  </section>
  <div class="sidefoot"></div>
</div>
<script src="../shared/components/global-navigation.js"></script>
<div id="addCardModal" class="modalback"><div class="modal"><input id="taskSummary"><textarea id="taskUsageScenario"></textarea><input id="taskTitle"><button onclick="createCard()">建立卡片</button></div></div>
<script>
  window.getSharedSessionSnapshot = () => ({ user_id: "qjc-test", isAuthenticated: true });
  window.ZhugeBoardReadService = {
    STATUS_WORKSPACES: [
      { key: "ready", uiKey: "todo", label: "待辦" },
      { key: "inprogress", uiKey: "progress", label: "推進" },
      { key: "qa", uiKey: "qa", label: "驗證" },
      { key: "done", uiKey: "done", label: "完成" }
    ],
    load: async () => ({ tasks: [{ id: "task-026", workCode: "TASK-026", title: "System Map 驗證", status: "qa", workspace: "qa", assignee: "GPT", summary: "確認三方傳接球。", usageScenario: "GPT 先讀取正式來源，再由 QJC 驗收。" }], principles: [] }),
    loadChecklist: async () => [
      { id: "check-1", stage: "co", state: "pass", required: true, label: "Co Developer QA 已完成", evidenceNote: "source evidence" },
      { id: "check-2", stage: "gpt", state: "not_verified", required: true, label: "GPT Review 尚待確認", evidenceNote: "" },
      { id: "check-3", stage: "qjc", state: "not_verified", required: true, label: "QJC PM QA 尚待確認", evidenceNote: "" }
    ],
    transitionTask: async () => ({}),
    updateChecklistItem: async () => ({}),
    createTask: async () => ({}),
    subscribe: async () => async () => {}
  };
</script>
<script src="../app/Board/ai/board-runtime.js"></script>
<script>
  setTimeout(() => document.querySelector(".taskcard")?.click(), 700);
  setTimeout(() => document.getElementById("refreshBoardBtn")?.click(), 850);
  setTimeout(() => document.querySelector("#taskTransitionActions button")?.click(), 1000);
  setTimeout(() => { document.querySelector('[data-board-nav="home"]')?.click(); const audit = document.createElement("pre"); audit.id = "home-nav-audit"; audit.textContent = document.getElementById("boardReadStatus")?.textContent || ""; document.body.appendChild(audit); }, 1150);
  setTimeout(() => { document.querySelector('[data-board-nav="all"]')?.click(); const audit = document.createElement("pre"); audit.id = "all-nav-audit"; audit.textContent = document.getElementById("boardReadStatus")?.textContent || ""; document.body.appendChild(audit); }, 1250);
  setTimeout(() => { document.querySelector('[data-board-nav="principles"]')?.click(); const audit = document.createElement("pre"); audit.id = "principles-nav-audit"; audit.textContent = document.getElementById("boardReadStatus")?.textContent || ""; document.body.appendChild(audit); }, 1350);
  setTimeout(() => { const input = document.getElementById("boardSearch"); input.value = "TASK-026"; input.dispatchEvent(new Event("input", { bubbles: true })); const audit = document.createElement("pre"); audit.id = "search-audit"; audit.textContent = document.getElementById("boardReadStatus")?.textContent || ""; document.body.appendChild(audit); }, 1450);
  setTimeout(() => document.querySelector(".add")?.click(), 1500);
  setTimeout(() => { document.getElementById("taskSummary").value = "建立正式工作平台"; document.getElementById("taskUsageScenario").value = "QJC、GPT、Co 需要共同驗證工程工作。"; document.getElementById("taskTitle").value = "AI Board 共同工作"; window.createCard(); }, 1750);
</script>
