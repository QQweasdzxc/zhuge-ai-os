      { id: "task-check-2", label: "完成 PM Runtime QA", completed: false }

    moveTaskWorkspace: async (taskId, targetWorkspaceId) => {
      const task = taskFor(taskId);
      const workspace = workspaceFor(targetWorkspaceId);
      if (task && workspace) Object.assign(task, { workspaceId: workspace.id, workspaceKey: workspace.key, workspaceName: workspace.name });
      return task;
    },
    createWorkspace: async name => { const workspace = { id: "ws-test", key: "", name, sortOrder: 60, active: true }; mockWorkspaces.push(workspace); return workspace; },
    renameWorkspace: async () => ({}),
    reorderWorkspaces: async () => ({ success: true }),

    createTask: async () => ({}),
    subscribe: async () => async () => {}

<script>
  (function recordTaskOrder(attempt) { const codes = Array.from(document.querySelectorAll('.process[data-workspace-key="gpt"] .taskcard .code')).map(code => code.textContent.trim()); if (codes.length === 4 || attempt >= 100) { const audit = document.createElement("pre"); audit.id = "task-order-audit"; audit.textContent = codes.join(","); document.body.appendChild(audit); return; } setTimeout(() => recordTaskOrder(attempt + 1), 50); })(0);
  setTimeout(() => { const card = document.querySelector(".taskcard"); card?.click(); window.ZhugeBoardRuntime?.openTaskDetail({ id: "task-026", workCode: "TASK-026", title: "System Map 驗證", status: "qa", assignee: "QJC", summary: "確認三方傳接球。", acceptanceCriteria: "打開 TASK Drawer，確認工作進度紀錄可正常新增。\n重新整理頁面，確認紀錄仍存在。\n確認 Drawer Desktop / Mobile 顯示正常。", usageScenario: "GPT 先讀取正式來源，再由 QJC 驗收。", developerNotes: "Co 已完成 Shared Drawer Presentation Layer 修正。", pmNotes: "PM QA 檢查 Drawer 的 Evidence presentation。" }); }, 1400);
  setTimeout(() => { const audit = document.createElement("pre"); audit.id = "checklist-audit"; audit.textContent = document.getElementById("taskDetailBody")?.textContent || ""; document.body.appendChild(audit); }, 1650);
  setTimeout(() => { const audit = document.createElement("div"); audit.id = "drawer-markup-audit"; audit.innerHTML = document.getElementById("taskDetailBody")?.innerHTML || ""; document.body.appendChild(audit); }, 1650);
  setTimeout(() => document.getElementById("refreshBoardBtn")?.click(), 1700);
  setTimeout(() => { const task = window.ZhugeBoardReadService.load ? window.ZhugeBoardReadService.load().then(result => result.tasks[0]) : null; Promise.resolve(task).then(row => row && window.ZhugeBoardRuntime?.moveTaskToWorkspace(row, "ws-co")); }, 1900);
  setTimeout(() => { document.querySelector('[data-board-nav="board"]')?.click(); const audit = document.createElement("pre"); audit.id = "board-nav-audit"; audit.textContent = document.getElementById("boardReadStatus")?.textContent || ""; document.body.appendChild(audit); }, 2200);
  setTimeout(() => { document.querySelector('[data-board-nav="principles"]')?.click(); const audit = document.createElement("pre"); audit.id = "principles-nav-audit"; audit.textContent = document.getElementById("boardReadStatus")?.textContent || ""; document.body.appendChild(audit); }, 2500);
  setTimeout(() => { document.querySelector('[data-board-nav="system-map"]')?.click(); const audit = document.createElement("pre"); audit.id = "system-map-nav-audit"; audit.textContent = document.getElementById("boardReadStatus")?.textContent || ""; document.body.appendChild(audit); }, 2800);
  setTimeout(() => { const input = document.getElementById("boardSearch"); input.value = "TASK-026"; input.dispatchEvent(new Event("input", { bubbles: true })); const audit = document.createElement("pre"); audit.id = "search-audit"; audit.textContent = document.getElementById("boardSearchCount")?.textContent || ""; document.body.appendChild(audit); }, 3100);
  setTimeout(() => document.querySelector(".add")?.click(), 3400);
  setTimeout(() => { document.getElementById("taskSummary").value = "建立正式工作平台"; document.getElementById("taskUsageScenario").value = "QJC、GPT、Co 需要共同驗證工程工作。"; document.getElementById("taskTitle").value = "AI Board 共同工作"; window.createCard(); }, 3900);
  setTimeout(() => { window.ZhugeBoardRuntime?.openTaskDetail({ id: "history", workCode: "TASK-HISTORY", title: "歷史完成工作", status: "done", assignee: "QJC", summary: "Checklist 制度導入前完成。", usageScenario: "保留歷史狀態供查閱。" }); }, 3500);
  setTimeout(() => { const audit = document.createElement("pre"); audit.id = "history-audit"; audit.textContent = document.getElementById("taskDetailBody")?.textContent || ""; document.body.appendChild(audit); }, 4100);
  setTimeout(() => { const btn = document.querySelector('[data-shared-nav-collapse]'); btn?.click(); const collapsed = document.createElement("pre"); collapsed.id = "nav-collapse-audit"; const visible = Array.from(document.querySelectorAll('.sidebar-scroll [data-shared-nav-item]')).filter(node => getComputedStyle(node).display !== "none"); const task = document.querySelector('.sidebar-scroll [data-shared-nav-item="tasks"]'); collapsed.textContent = `${document.querySelector(".zhuge-module-shell")?.className || ""};collapsed-visible=${visible.map(node => node.dataset.sharedNavItem).join(",")};collapsed-tasks-tag=${task?.tagName || ""};collapsed-tasks-title=${task?.getAttribute("title") || ""};collapsed-tasks-href=${task?.getAttribute("href") || ""}`; document.body.appendChild(collapsed); btn?.click(); }, 4500);
