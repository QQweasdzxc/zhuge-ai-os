<!doctype html>
<meta charset="utf-8">
<title>AI Board Batch 2 browser regression fixture</title>
<link rel="stylesheet" href="../shared/theme/zhuge-navigation.css">
<div class="zhuge-module-shell"><div id="zhugeSharedNavigation" data-external-root="../" data-active-workspace="ai-board" data-version="0.9.0-alpha.9.12" data-build="20260812-1016"></div>
<div class="main">
  <aside>
    <button data-board-nav="board" type="button">📋 工作看板</button>
    <button data-board-nav="principles" type="button">📘 工程準則</button>
    <button data-board-nav="system-map" type="button">🗺️ 系統藍圖</button>
  </aside>
  <div class="actions"><button class="btn">重新整理</button></div>
  <div class="toolbar"><input id="boardSearch" type="search" aria-label="搜尋 TASK"></div>
  <div class="note"></div>
  <section class="board-shell">
    <section class="process" data-status="todo"><span class="count">0</span><button class="add" onclick="openQuickAdd('todo')">＋ 新增 TASK</button><div class="cards"></div></section>
    <section class="process" data-status="progress"><span class="count">0</span><div class="cards"></div></section>
    <section class="process" data-status="qa"><span class="count">0</span><div class="cards"></div></section>
    <section class="process" data-status="done"><span class="count">0</span><div class="cards"></div></section>
  </section>
  <section class="board-subview principles-view" data-board-view="principles" hidden><div id="principlesCards"></div></section>
  <section class="board-subview system-map-view" data-board-view="system-map" hidden><div id="systemMapCards"></div></section>
  <div class="sidefoot"></div>
</div></div>
<script src="../shared/config/version.js"></script>
<script src="../shared/components/zhuge-navigation.js"></script>
<div id="addCardModal" class="modalback"><div class="modal"><input id="taskSummary"><textarea id="taskUsageScenario"></textarea><input id="taskTitle"><button onclick="createCard()">建立卡片</button></div></div>
<script>
  window.getSharedSessionSnapshot = () => ({ user_id: "qjc-test", isAuthenticated: true });
  window.ZhugeBoardReadService = {
    STATUS_WORKSPACES: [
      { key: "ready", uiKey: "todo", label: "待辦" },
      { key: "inprogress", uiKey: "progress", label: "推進" },
      { key: "qa", uiKey: "qa", label: "驗證" },
      { key: "done", uiKey: "done", label: "完成" }
    ],
    load: async () => ({ tasks: [
      { id: "task-026", workCode: "TASK-026", title: "System Map 驗證", status: "qa", workspace: "qa", assignee: "GPT", summary: "確認三方傳接球。", usageScenario: "GPT 先讀取正式來源，再由 QJC 驗收。" },
      { id: "task-010", workCode: "TASK-010", title: "排序測試 10", status: "qa", workspace: "qa", assignee: "GPT", summary: "驗證 TASK 數字排序。", usageScenario: "QJC 需要依編號閱讀工作卡。" },
      { id: "task-002", workCode: "TASK-002", title: "排序測試 2", status: "qa", workspace: "qa", assignee: "GPT", summary: "驗證 TASK 數字排序。", usageScenario: "QJC 需要依編號閱讀工作卡。" },
      { id: "task-003", workCode: "TASK-003", title: "排序測試 3", status: "qa", workspace: "qa", assignee: "GPT", summary: "驗證 TASK 數字排序。", usageScenario: "QJC 需要依編號閱讀工作卡。" }
    ], principles: [{ code: "PRINCIPLE-001", title: "不得偽造 Evidence", summary: "正式證據必須可追溯。" }], systemMaps: [{ code: "TASK-026-SYSTEM-MAP", title: "Current System Map", summary: "Shared Shell → AI Board → Supabase" }] }),
    loadChecklist: taskId => taskId === "history" ? [] : [
      { id: "check-1", stage: "co", state: "pass", required: true, label: "Co Developer QA 已完成", evidenceNote: "source evidence" },
      { id: "check-2", stage: "gpt", state: "not_verified", required: true, label: "GPT Review 尚待確認", evidenceNote: "" },
      { id: "check-3", stage: "qjc", state: "not_verified", required: true, label: "QJC PM QA 尚待確認", evidenceNote: "" }
    ],
    planTransition: (task, target) => {
      const map = { progress: { status: "inprogress", assignee: "Co", action: "退回 Co" }, qa: { status: "qa", assignee: "QJC", action: "GPT Review 通過 → 交 QJC" } };
      if (task.status === "qa" && task.assignee === "GPT" && map[target] && target !== "done") return { allowed: true, targetWorkspace: target, ...map[target] };
      return { allowed: false, reason: "目前在驗證，只能先由 GPT Review 完成，再交給下一位。" };
    },
    availableTransitions: task => task.status === "qa" && task.assignee === "GPT"
      ? [{ allowed: true, targetWorkspace: "progress", status: "inprogress", assignee: "Co", action: "退回 Co" }, { allowed: true, targetWorkspace: "qa", status: "qa", assignee: "QJC", action: "GPT Review 通過 → 交 QJC" }]
      : [],
    transitionTask: async () => ({}),
    updateChecklistItem: async () => ({}),
    createTask: async () => ({}),
    subscribe: async () => async () => {}
  };
</script>
<script src="../app/Board/ai/board-runtime.js"></script>
<script>
  (function recordTaskOrder(attempt) { const codes = Array.from(document.querySelectorAll('.process[data-status="qa"] .taskcard .code')).map(code => code.textContent.trim()); if (codes.length === 4 || attempt >= 100) { const audit = document.createElement("pre"); audit.id = "task-order-audit"; audit.textContent = codes.join(","); document.body.appendChild(audit); return; } setTimeout(() => recordTaskOrder(attempt + 1), 50); })(0);
  setTimeout(() => { const card = document.querySelector(".taskcard"); card?.click(); window.ZhugeBoardRuntime?.openTaskDetail({ id: "task-026", workCode: "TASK-026", title: "System Map 驗證", status: "qa", assignee: "GPT", summary: "確認三方傳接球。", usageScenario: "GPT 先讀取正式來源，再由 QJC 驗收。" }); }, 1400);
  setTimeout(() => { const audit = document.createElement("pre"); audit.id = "checklist-audit"; audit.textContent = document.getElementById("taskDetailBody")?.textContent || ""; document.body.appendChild(audit); }, 1650);
  setTimeout(() => document.getElementById("refreshBoardBtn")?.click(), 1700);
  setTimeout(() => document.querySelector("#taskTransitionActions button")?.click(), 1900);
  setTimeout(() => { document.querySelector('[data-board-nav="board"]')?.click(); const audit = document.createElement("pre"); audit.id = "board-nav-audit"; audit.textContent = document.getElementById("boardReadStatus")?.textContent || ""; document.body.appendChild(audit); }, 2200);
  setTimeout(() => { document.querySelector('[data-board-nav="principles"]')?.click(); const audit = document.createElement("pre"); audit.id = "principles-nav-audit"; audit.textContent = document.getElementById("boardReadStatus")?.textContent || ""; document.body.appendChild(audit); }, 2500);
  setTimeout(() => { document.querySelector('[data-board-nav="system-map"]')?.click(); const audit = document.createElement("pre"); audit.id = "system-map-nav-audit"; audit.textContent = document.getElementById("boardReadStatus")?.textContent || ""; document.body.appendChild(audit); }, 2800);
  setTimeout(() => { const input = document.getElementById("boardSearch"); input.value = "TASK-026"; input.dispatchEvent(new Event("input", { bubbles: true })); const audit = document.createElement("pre"); audit.id = "search-audit"; audit.textContent = document.getElementById("boardReadStatus")?.textContent || ""; document.body.appendChild(audit); }, 3100);
  setTimeout(() => document.querySelector(".add")?.click(), 3400);
  setTimeout(() => { document.getElementById("taskSummary").value = "建立正式工作平台"; document.getElementById("taskUsageScenario").value = "QJC、GPT、Co 需要共同驗證工程工作。"; document.getElementById("taskTitle").value = "AI Board 共同工作"; window.createCard(); }, 3900);
  setTimeout(() => { window.ZhugeBoardRuntime?.openTaskDetail({ id: "history", workCode: "TASK-HISTORY", title: "歷史完成工作", status: "done", assignee: "QJC", summary: "Checklist 制度導入前完成。", usageScenario: "保留歷史狀態供查閱。" }); }, 3500);
  setTimeout(() => { const audit = document.createElement("pre"); audit.id = "history-audit"; audit.textContent = document.getElementById("taskDetailBody")?.textContent || ""; document.body.appendChild(audit); }, 4100);
  setTimeout(() => { const btn = document.querySelector('[data-shared-nav-collapse]'); btn?.click(); const collapsed = document.createElement("pre"); collapsed.id = "nav-collapse-audit"; collapsed.textContent = document.querySelector(".zhuge-module-shell")?.className || ""; document.body.appendChild(collapsed); btn?.click(); }, 4500);
  setTimeout(() => { document.querySelectorAll('[data-shared-nav-item]').forEach(link => link.addEventListener('click', event => { event.preventDefault(); })); const audit = document.createElement("pre"); audit.id = "cross-workspace-audit"; audit.textContent = Array.from(document.querySelectorAll('[data-shared-nav-item]')).map(link => link.dataset.sharedNavItem).join(","); document.body.appendChild(audit); const ia = document.createElement("pre"); ia.id = "ai-board-ia-audit"; ia.textContent = `heading=${document.querySelectorAll('.side-section-heading[data-shared-nav-item="ai-board"]').length};duplicateMenu=${document.querySelectorAll('.side-section .side-item[data-shared-nav-item="ai-board"]').length};children=${document.querySelectorAll('.side-section[data-nav-group="ai-board"] .side-item-child').length}`; document.body.appendChild(ia); }, 4700);
</script>
