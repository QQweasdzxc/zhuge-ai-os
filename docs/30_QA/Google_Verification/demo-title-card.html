<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zhuge AI OS — Google OAuth Verification Demo</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: radial-gradient(circle at 75% 10%, #153d70 0, #071525 34%, #030914 72%); color: #f4f8fc; }
      main { width: min(900px, calc(100% - 64px)); padding: 64px; border: 1px solid rgba(93, 168, 255, .38); border-radius: 28px; background: rgba(7, 21, 38, .88); box-shadow: 0 28px 90px rgba(0, 0, 0, .35); }
      .brand { display: flex; align-items: center; gap: 20px; }
      img { width: 88px; height: 88px; }
      h1 { margin: 0; font-size: clamp(52px, 7vw, 82px); line-height: 1; letter-spacing: -.05em; }
      h2 { margin: 18px 0 42px; color: #61b7ff; font-size: clamp(24px, 3vw, 36px); font-weight: 700; }
      dl { display: grid; grid-template-columns: 180px 1fr; gap: 10px 22px; margin: 0; font-size: 20px; }
      dt { color: #9fb4c8; }
      dd { margin: 0; font-weight: 700; }
      .purpose { margin: 38px 0 0; padding-top: 30px; border-top: 1px solid rgba(151, 185, 218, .24); color: #d9e7f3; font-size: 24px; line-height: 1.45; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="../../shared/assets/logo/zhuge-ai-os.svg" alt="Zhuge AI OS logo">
        <h1>Zhuge AI OS</h1>
      </div>
      <h2>Google OAuth Verification Demo</h2>
      <dl>
        <dt>Demo Version</dt><dd>1.0</dd>
        <dt>Product Version</dt><dd>0.9.0-alpha.8.4</dd>
        <dt>Recording Date</dt><dd>2026-08-01</dd>
        <dt>Google Account</dt><dd>Demo Account</dd>
      </dl>
      <p class="purpose">Purpose: Demonstrate Google Sign-In and the explicit Google Picker workflow.</p>
    </main>
  </body>
</html>
