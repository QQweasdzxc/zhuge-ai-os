// ZG-52 embedded-auth relay. The TaskFlow panel embeds this root page, which
// iframes the office one level deeper, so the office's handshake cannot reach
// the TF page directly. This relay forwards ONLY the three pinned message
// types between the two first-party parties: ready (office -> TF parent) and
// embedded-auth / embedded-auth-clear (TF parent -> office). Messages from
// any other origin are dropped; the token passes through transiently and is
// never read, stored, or logged here.
(function () {
  'use strict';
  var TF_ORIGIN = 'https://zhuge-taskflow-web.onrender.com';
  var SELF_ORIGIN = location.origin;
  var RELAY_TYPES = { 'zhuge-office-ready': 1, 'zhuge-office-embedded-auth': 1, 'zhuge-office-embedded-auth-clear': 1 };
  if (window.parent === window) return;
  var office = document.querySelector('iframe');
  if (!office) return;
  window.addEventListener('message', function (e) {
    if (!e.data || !RELAY_TYPES[e.data.type]) return;
    if (e.source === office.contentWindow && e.origin === SELF_ORIGIN) {
      window.parent.postMessage(e.data, TF_ORIGIN);
    } else if (e.source === window.parent && e.origin === TF_ORIGIN) {
      office.contentWindow.postMessage(e.data, SELF_ORIGIN);
    }
  });
})();
</script><script>
// ZG-55 acceptance: the classic-report nav is a failure fallback, not a
// permanent second entry. Hide it once the office iframe has loaded. Runs
// before <nav> exists, so defer to DOMContentLoaded and cover the race where
// the iframe already fired load.
(function () {
  'use strict';
  function hide() { var nav = document.getElementById('pixel-fallback'); if (nav) nav.hidden = true; }
  // Proof the office initialized, not just that some document (e.g. an HTTP
  // error page) finished loading: the real office toolbar owns #sceneMenu.
  function officeReady() {
    var f = document.querySelector('iframe');
    try { return !!(f && f.contentDocument && f.contentDocument.getElementById('sceneMenu')); } catch (e) { return false; }
  }
  document.addEventListener('DOMContentLoaded', function () {
    if (officeReady()) { hide(); return; }
    var f = document.querySelector('iframe');
    if (f) f.addEventListener('load', function () { if (officeReady()) hide(); });
  });
})();
</script><nav id="pixel-fallback"><a href="./status-classic.html">經典報表</a></nav><footer hidden id="zhuge-source-identity">Version 0.9.0-alpha.9.178 · Build 20261107-1118</footer></body></html>
