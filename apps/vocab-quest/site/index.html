/* Warm up the small word-audio set on page load. Cached Audio instances
   are reused on every card so replay does not trigger a fresh request. */
var audioMap=Object.create(null), audioActive=null;
var audioDomains=[
  function(word){return "https://ssl.gstatic.com/dictionary/static/sounds/oxford/"+encodeURIComponent(word)+"--_us_1.mp3"},
  function(word){return "https://ssl.gstatic.com/dictionary/static/sounds/20200429/"+encodeURIComponent(word)+"--_us_1.mp3"},
  function(word){return "https://api.dictionaryapi.dev/media/pronunciations/en/"+encodeURIComponent(word)+"-us.mp3"}
];
function makeAudio(word,sourceIdx){
  var item=audioMap[word]||{playing:false,source:0};
  audioMap[word]=item;
  item.source=sourceIdx;
  var audio=new Audio(audioDomains[sourceIdx](word));
  item.audio=audio;item.ready=false;item.error=false;audio.preload="auto";
  audio.onloadeddata=function(){if(audioMap[word]===item&&item.audio===audio)item.ready=true};
  audio.oncanplay=function(){if(audioMap[word]===item&&item.audio===audio)item.ready=true};
  audio.onerror=function(){
    if(item.audio!==audio)return;
    item.error=true;
    if(sourceIdx+1<audioDomains.length){
       makeAudio(word,sourceIdx+1);
       if(item.playing)playAudio(word,item.slow);
    }else if(item.playing){item.playing=false;speechFallback(word,item.slow)}
  };
  audio.onplaying=function(){audioStatus("🔊 正在播放英文發音"+(item.slow?"（慢速）":""));item.playing=false};
  audio.onended=function(){audioStatus("✓ 發音播放完成")};
  try{audio.load()}catch(ignore){}
  return item;
}
function warmAudio(){
  // Limit parallel connections to keep the webpage responsive on mobile data.
  words.slice(0,12).forEach(function(word,i){
    setTimeout(function(){if(!audioMap[word[0]])makeAudio(word[0],0)},i*90);
  });
}
function playAudio(word,slow){
  var item=audioMap[word]||makeAudio(word,0);
  item.playing=true;item.slow=!!slow;
  if(audioActive&&audioActive!==item.audio){try{audioActive.pause()}catch(ignore){}}
  var audio=item.audio;
  audioActive=audio;
  try{audio.pause();audio.currentTime=0}catch(ignore){}
  audio.playbackRate=slow?0.75:1;
  audioStatus(item.ready?"🔊 正在播放英文發音":"🔊 音檔準備中…");
  try{var p=audio.play();if(p&&typeof p.catch==="function")p.catch(function(){
    if(audioMap[word]!==item||item.audio!==audio)return;
    item.playing=false;
    speechFallback(word,item.slow);
  })}catch(e){item.playing=false;speechFallback(word,item.slow)}
}

 var w=s.lastWrongIndex>=0?words[s.lastWrongIndex]:null;
 var target=s.challengeMode==="all"?s.pool.length*3:s.pool.length;
 app.innerHTML='<section class="game-over"><div class="skull">💀</div>'+
 '<h1>GAME OVER</h1><p>🖤 🖤 🖤</p><p>三顆愛心都用完了，看看答案再試一次。</p>'+
 '<p>本次已答 '+s.attempts.length+' / '+target+' 題</p>'+
 (w?'<div class="game-miss">最後一題正確答案<br><b>'+safe(w[0])+'</b><p>'+safe(w[1])+'</p></div>':"")+
 '</section><section class="panel"><h2>🔄 重新挑戰</h2>'+
 '<p>'+(s.challengeMode==="all"?"三種技能連續練習從第一關重新開始。":"再練這一關，愛心會補滿。")+'</p>'+
 '<div class="actions">'+btn("🎮 重新闖關 ❤️❤️❤️","replay","primary wide")+
 btn("返回首頁選關","home","outline wide")+
 btn("📊 查看歷史成績","report","outline wide")+'</div>'+
 '<p class="game-over-meta" role="status">'+safe(familyCloud.saving)+'</p></section>'
}
function next(){
 cancelAutoNext();
 if(s.view!=="game")return;
 s.q++;s.answered=false;s.typed="";s.clue=false;s.selected=null;s.choiceKey="";s.choiceList=[];
 if(s.q>=s.order.length){
  if(s.retry||s.challengeMode==="single"||s.stage===2){
   s.view="report";
   if(!s.retry&&!s.lastRecorded&&s.attempts.length){
    var done=s.attempts.filter(function(x){return x.good}).length;
    var label=s.challengeMode==="single"?["單項練習｜中英配對","單項練習｜拼字挑戰","單項練習｜句子填空"][s.stage]:"三種技能連續練習";
    s.sessionRuns.push({tester:s.runTesterName,testerId:s.runTesterId,correct:done,total:s.attempts.length,label:label,scope:scopeName(),date:new Date().toLocaleString("zh-TW")});
    s.lastRecorded=true
   }
   report();if(!s.retry)saveCloudResult("completed");return
  }
  s.stage++;s.q=0;s.order=shuffled(s.pool);s.choiceKey="";s.choiceList=[]
 }
 s.view="game";question()
}
function render(){cancelAutoNext();window.scrollTo(0,0);updateScopePicker();if(s.view==="home")frame();else if(s.view==="study"||s.view==="studyCN")cards();else if(s.view==="list")listing();else if(s.view==="game")question();else if(s.view==="gameOver")gameOverScreen();else report();window.vocabProgressRefresh?.()}
app.addEventListener("input",function(e){if(e.target.id==="spelling")s.typed=e.target.value});
app.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="spelling"&&!s.answered&&s.typed.trim())answer(s.typed)});
app.addEventListener("change",function(e){
 if(e.target&&e.target.id==="tester-picker"){
  if(e.target.value==="__new__"){s.addingTester=true;s.testerNotice="";frame()}
  else chooseTester(e.target.value)
 }
});
app.addEventListener("click",function(e){
 var t=e.target.closest("[data-action]");if(!t)return;
 var act=t.dataset.action;
 if(act==="home"||act==="report"||act==="list"||act==="replay"||act==="retry"||act==="stage0"||act==="stage1"||act==="stage2"||act==="start"||act==="study"||act==="studyCN"){cancelAutoNext()}
 if(act==="switchTester"){window.vocabPlayerOpen?.();return}
 if(act==="cloudAddUnit"){saveNewCloudUnit();return}
 if(act==="editWeek"){editCloudWeek(Number(t.dataset.index));return}
 if(act==="testerCustom"){
  var el=document.getElementById("tester-name");
  var name=el?String(el.value||"").trim().replace(/[\n\r]+/g," "):"";
  if(!name){s.testerNotice="請輸入一個暱稱";frame();return}
  chooseTester(name)
 }
 else if(act==="filterAll"){s.historyFilter="all";report()}
 else if(act==="filterTester"){s.historyFilter="current";report()}
 else if(act==="testTone")testTone();
 else if(act==="toggleGameSound"){s.soundOn=!s.soundOn;frame()}
 else if(act==="stage0"||act==="stage1"||act==="stage2")start(false,Number(act.slice(-1)));
 else if(act==="start")start(false);
 else if(act==="retry")start(true);
 else if(act==="replay")start(false,s.challengeMode==="single"?s.selectedStage:undefined,s.villageStage);
 else if(act==="home"){s.view="home";render()}
 else if(act==="study"||act==="studyCN"){s.view=act;s.cardOrder=shuffled(currentPool());s.card=0;s.flipped=false;render()}
 else if(act==="shuffleCards"){s.cardOrder=shuffled(currentPool());s.card=0;s.flipped=false;render()}
 else if(act==="flip"){s.flipped=!s.flipped;render()}
 else if(act==="prev"||act==="nextcard"){s.card=Math.max(0,Math.min(s.cardOrder.length-1,s.card+(act==="prev"?-1:1)));s.flipped=false;render()}
 else if(act==="sound"||act==="slow"){if(s.view==="game"&&s.stage===2&&!s.retry)sentenceSound(current(),act==="slow");else say(currentIfStudy(),act==="slow")}
 else if(act==="wordSound")say(words[Number(t.dataset.index)][0],false);
 else if(act==="list"){s.view="list";render()}
 else if(act==="report"){s.view="report";render()}
 else if(act==="choose")answer(t.dataset.index);
 else if(act==="hint"){s.clue=true;question()}
 else if(act==="submit"){if(s.typed.trim())answer(s.typed);else{var el=document.getElementById("spelling");if(el)el.focus()}}
 else if(act==="advance")next()
});
function currentIfStudy(){return (s.view==="study"||s.view==="studyCN")?words[s.cardOrder[s.card]][0]:current()[0]}
document.getElementById("homebtn").addEventListener("click",function(){cancelAutoNext();s.view="home";render()});
document.getElementById("scope-picker").addEventListener("change",function(e){
 cancelAutoNext();
 var index=Number(e.target.value);
 if(index===-1){if(s.scope>=0)s.lastScope=s.scope;s.scope=-1}
 else if(index>=0&&index<wordUnits.length){s.scope=index;s.lastScope=index;s.selectedCategory=wordUnits[index].category}
 s.view="home";render()
});

render();initFamilyCloud();warmAudio();warmSentences();
})();

<script>
/* One task source and one round-reward display for both learning islands. */
(function(){
'use strict';
const host=window.learningDailyHost;
const hub=!!host?.isHub;
const world=hub?'chengyu':document.querySelector('#adventureArea')?'chengyu':'vocab';
const api='https://lenpbbhwxyyfwgvjcozf.supabase.co/functions/v1/learning-adventure-cloud';
const labels={vocab:{meaning:'單項練習｜中英配對',spelling:'單項練習｜拼字挑戰',sentence:'單項練習｜句子填空',preview:'先用單字卡預習'},chengyu:{mixed:'混合練習',meaning:'看成語，選意思',context:'情境填空',reverse:'看意思，選成語'}};
let active='',plan=null,loading=false,last=0,manual='',previewSaving=false;
function state(){if(hub)return host.state();return world==='vocab'?window.vocabProgressState?.():window.chengyuProgressState?.()}
function identity(){const st=state();return st?.selectedId||''}
function tokenValue(){return new URLSearchParams(location.hash.slice(1)).get('f')||''}
async function request(action,args={},id=identity()){
 if(!id||!tokenValue())throw Error('請先選擇勇者');
 const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...args,action,world,learnerId:id,token:tokenValue()}),cache:'no-store'});
 const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'暫時無法同步');return d;
}
function own(){return plan?.tasks.find(x=>x.world===world)}
/* Collections: star toggle for one idiom / word. Server stores per hero and per island; no rewards involved. */
const col={set:new Set(),id:'',loaded:false,busy:false,failed:false,loading:'',epoch:0};
function colKey(v){return world==='vocab'?String(v).trim().toLowerCase():String(v).trim()}
function colStatus(t){for(const el of document.querySelectorAll('[data-collect-status]'))if(el.textContent!==t)el.textContent=t}
function colPaint(){
 const id=identity();
 for(const b of document.querySelectorAll('[data-collect]')){
  const ready=col.loaded&&col.id===id;
  const on=ready&&col.set.has(colKey(b.dataset.collect));
  const t=!id?'☆ 收藏（選擇勇者後可用）':col.id===id&&col.failed?'☆ 收藏（暫時無法同步）':!ready?'☆ 收藏（讀取中…）':on?'★ 已收藏，再按一次移除':'☆ 收藏';
  if(b.textContent!==t)b.textContent=t;
  const p=String(on);if(b.getAttribute('aria-pressed')!==p)b.setAttribute('aria-pressed',p);
  const d=!id||!ready||col.busy;if(b.disabled!==d)b.disabled=d;
 }
}
async function colLoad(){

 if(col.loading===id||col.id===id&&(col.loaded||col.failed))return;
 const epoch=++col.epoch;col.loading=id;col.id=id;col.loaded=false;col.failed=false;col.set=new Set();
 try{const d=await request('listCollections',{},id);if(identity()!==id||col.epoch!==epoch)return;col.set=new Set((d.items||[]).map(x=>x.item_key));col.loaded=true}
 catch(e){if(identity()===id&&col.epoch===epoch)col.failed=true}
 finally{if(col.epoch===epoch)col.loading='';colPaint()}
}
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-collect]');if(!b)return;e.preventDefault();
 if(col.busy||!col.loaded||col.id!==identity())return;
 const id=identity(),item=b.dataset.collect,key=colKey(item),on=col.set.has(key);
 const epoch=col.epoch;col.busy=true;colPaint();
 try{await request(on?'uncollectItem':'collectItem',{item},id);if(identity()===id&&col.epoch===epoch){if(on)col.set.delete(key);else col.set.add(key);colStatus(on?'已從收藏移除。':'已收藏。')}}
 catch(err){if(identity()===id&&col.epoch===epoch)colStatus('收藏未完成：'+(err.message||'暫時無法同步'))}
 finally{col.busy=false;colPaint()}
});
new MutationObserver(()=>{if(document.querySelector('[data-collect]')){colLoad();colPaint()}}).observe(document.body,{childList:true,subtree:true});
window.learningCollection={refresh:()=>{++col.epoch;col.loading='';col.loaded=false;col.failed=false;col.id='';return colLoad()},paint:colPaint};

function row(world,mode,done,preview){
 const a=document.createElement('a');a.className='quest-mini-row'+(done?' done':'');a.href=host.childLink(world)+'&t='+(preview?'preview':mode);a.dataset.dailyPart=world+':'+mode;
 const icon=document.createElement('span');icon.className='qmr-icon';icon.textContent=done?'✓':world==='vocab'?'英':'成';
 const text=document.createElement('span');text.className='qmr-text';const strong=document.createElement('strong');strong.textContent=world==='vocab'?'英文島':'成語島';text.append(strong,document.createTextNode(' · '+labels[world][mode]));
 const hint=document.createElement('small');hint.style.cssText='display:block;font-size:11px;line-height:1.5;margin-top:5px';hint.textContent=done?'已完成':preview?'翻到最後一張，按「預習完成，去挑戰」':'完成這個模式的一回合，進度儲存後打勾';text.append(hint);
 const go=document.createElement('span');go.className='qmr-go';go.textContent=done?'✓':'›';a.append(icon,text,go);return a;
}
function renderHub(){
 if(!hub||!plan)return;
 document.querySelectorAll('[data-quest], [data-daily-part]').forEach(a=>a.remove());
 const area=document.querySelector('#tasksDrawer .quest-mini');if(!area)return;const before=area.querySelector('#questProgress');let count=0,total=2;
 for(const item of plan.tasks){
  if(item.world==='vocab'&&item.task==='preview'){area.insertBefore(row('vocab','preview',item.previewDone,true),before);total++;if(item.previewDone)count++;}
  area.insertBefore(row(item.world,item.mode,item.challengeDone,false),before);total++;if(item.challengeDone)count++;
 }
 for(const w of ['chengyu','vocab'])if(host.reviewDone()[w])count++;
 host.decorateReviews();

}
function renderIsland(){
 if(hub||!plan)return;const task=own();if(!task)return;
 const arrival=new URLSearchParams(location.hash.slice(1)).get('t');
 if(world==='chengyu'){
  if(document.querySelector('#screen-game.active'))return;
  const mode=arrival&&labels.chengyu[arrival]?arrival:task.mode;
  if(manual!==active+'|'+plan.day&&typeof setSelect==='function')setSelect('modes','mode',mode);
  const btn=document.querySelector('#modes .selected');const chosen=btn?.dataset.mode||mode;
  const zone=document.getElementById('entryZone');if(zone){zone.dataset.taskMode=chosen;}
  const note=document.getElementById('entryMissionNote');if(note){const count=document.querySelector('#counts .selected')?.textContent.trim()||'10題';note.textContent=count+' · '+labels.chengyu[chosen]+' · 達80%解鎖下一關';}
 }else{
  if(!host?.isHome())return;
  const wantsPreview=arrival==='preview'||(!arrival&&task.task==='preview'&&!task.previewDone);
  const mode=labels.vocab[arrival]?arrival:task.mode;const stage={meaning:0,spelling:1,sentence:2}[mode];
  const mission=document.querySelector('.entry-mission');if(!mission)return;
  const sig=active+'|'+plan.day+'|'+wantsPreview+'|'+mode;if(mission.dataset.sharedTask===sig)return;mission.dataset.sharedTask=sig;
  const launch=mission.querySelector('.entry-launch');const cur=launch?.querySelector('[data-action]');const target=document.querySelector('[data-action="'+(wantsPreview?'study':'stage'+stage)+'"]');

function vpageSize(){const g=document.getElementById('villageGrid'),cells=[...g.children];
