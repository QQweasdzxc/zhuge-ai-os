dback strong{display:block;font-size:17px}.feedback p{margin:8px 0 0;font-size:13px;color:#4c6077}.card{width:100%;background:linear-gradient(145deg,#eef3ff,#fff);border:1px solid #dfe7fb;border-radius:24px;min-height:270px;padding:30px 15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--ink)}.card b{font-size:clamp(30px,8vw,45px)}.card .trans{font-size:23px;font-weight:800}.flex{display:flex;gap:9px;justify-content:space-between;align-items:center;margin-top:14px}.flex>.btn{flex:1}.table-row{border-bottom:1px solid #edf0f7;padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.table-row:last-child{border:0}.small{font-size:12px;color:var(--muted)}.success{color:var(--green)}.danger{color:var(--red)}.trophy{font-size:56px;text-align:center}.star{color:var(--gold);font-size:24px}.center{text-align:center}button:focus-visible,input:focus-visible{outline:3px solid #89a0f2;outline-offset:2px}

<script>
(function(){
"use strict";
var words=[
["origin","來源；起源","Do you know the ____ of this festival?","可聯想 original（原本的）。","ˈɔːrɪdʒɪn"],
["tale","（尤指誇大的）陳述；描述","Steven's ____ sounded hard to believe.","也可以指故事。","teɪl"],
["proper","像樣的；適當的","Ryan finally bought a ____ bed.","proper bed：像樣的床。","ˈprɑːpər"],
["interrupt","中斷；暫停","Please don\u0027t ____ the teacher.","請不要打斷老師說話。","ˌɪntəˈrʌpt"],
["request","要求；請求","Mel decided to ____ an afternoon off.","request time off：請假。","rɪˈkwest"],
["slice","（食物的）片；薄片","Mary cut a ____ of cheese.","a slice of cheese：一片起司。","slaɪs"],
["specific","特定的","The doctor asked about the patient's ____ needs.","specific needs：特定需求。","spəˈsɪfɪk"],
["familiar","熟悉的；常見的","This is a ____ birthday song.","familiar song：熟悉的歌曲。","fəˈmɪliər"],
["broad","概括的；粗略的","Jim has a ____ idea of the meeting.","broad idea：大概了解。","brɔːd"],
["bacon","培根","My dog always begs for ____.","早餐常見的培根。","ˈbeɪkən"],
["press","壓；壓平","The cook will ____ the meat flat.","press the meat flat：把肉壓平。","pres"],
["combine","混合；結合；組合","We can ____ A with B.","combine A with B：把 A 和 B 結合。","kəmˈbaɪn"]
];
var wordUnits=[],rawBank=window.VOCAB_BANK;
if(rawBank&&Array.isArray(rawBank.units)&&rawBank.units.length){
 var collected=[];
 rawBank.units.forEach(function(unit,n){
  if(!unit||!Array.isArray(unit.words))return;
  var ids=[];
  unit.words.forEach(function(w){
   if(!w||!w.en||!w.zh||!w.sentence)return;
   var en=String(w.en).trim().toLowerCase();
   if(!/^[a-z][a-z'-]*$/.test(en)||String(w.sentence).indexOf("____")<0)return;
   ids.push(collected.length);
   collected.push([en,String(w.zh),String(w.sentence),String(w.tip||""),String(w.ipa||"")])
  });
  if(ids.length)wordUnits.push({id:unit.id||("unit-"+n),title:String(unit.title||("Unit "+(n+1))),indices:ids})
 });
 if(collected.length>=4)words=collected
}
if(!wordUnits.length)wordUnits=[{id:"unit-001",title:"Unit 1｜第一批課本單字",indices:words.map(function(_,i){return i})}];
function allIndices(){return words.map(function(_,i){return i})}
function currentPool(){return s.scope<0?allIndices():wordUnits[Math.min(s.scope,wordUnits.length-1)].indices.slice()}
function scopeName(){return s.scope<0?"全部單字總複習":wordUnits[Math.min(s.scope,wordUnits.length-1)].title}
function shuffled(source){var a=source.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),v=a[i];a[i]=a[j];a[j]=v}return a}
var app=document.getElementById("app");var s={view:"home",card:0,flipped:false,stage:0,q:0,order:[],selected:null,typed:"",answered:false,correct:false,clue:false,score:0,attempts:[],missed:[],retry:false,sessionRuns:[],lastRecorded:false,challengeMode:"all",selectedStage:0,scope:0,cardOrder:[],pool:[],choiceKey:"",choiceList:[]};
function safe(x){return String(x).replace(/[&<>"]/g,function(a){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[a]})}

function audioStatus(msg,error){var el=document.getElementById("audio-status");if(el){el.textContent=msg;el.style.color=error?"#bb3c55":"#237f66";}}
function speechFallback(text){if(!("speechSynthesis" in window)){audioStatus("無法播放：請在 Safari 開啟這個網址",true);return}
try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.82;u.volume=1;u.onstart=function(){audioStatus("🔊 正在用手機語音朗讀")};u.onerror=function(){audioStatus("此瀏覽器無法發聲，請試 Safari 並檢查手機靜音",true)};speechSynthesis.speak(u)}catch(e){audioStatus("無法播放音檔，請使用 Safari 測試",true)}}

/* Warm up the small word-audio set on page load. Cached Audio instances
   are reused on every card so replay does not trigger a fresh request. */
var audioMap=Object.create(null), audioActive=null;
var audioDomains=[
  function(word){return "https://ssl.gstatic.com/dictionary/static/sounds/oxford/"+encodeURIComponent(word)+"--_us_1.mp3"},
  function(word){return "https://ssl.gstatic.com/dictionary/static/sounds/20200429/"+encodeURIComponent(word)+"--_us_1.mp3"},
  function(word){return "https://api.dictionaryapi.dev/media/pronunciations/en/"+encodeURIComponent(word)+"-us.mp3"}
];
function makeAudio(word,sourceIdx){
  var item=audioMap[word]||{playing:false,source:0};
  audioMap[word]=item;
  item.source=sourceIdx;
  var audio=new Audio(audioDomains[sourceIdx](word));
  item.audio=audio;item.ready=false;item.error=false;audio.preload="auto";
  audio.onloadeddata=function(){if(audioMap[word]===item&&item.audio===audio)item.ready=true};
  audio.oncanplay=function(){if(audioMap[word]===item&&item.audio===audio)item.ready=true};
  audio.onerror=function(){
    if(item.audio!==audio)return;
    item.error=true;
    if(sourceIdx+1<audioDomains.length){
       makeAudio(word,sourceIdx+1);
       if(item.playing)playAudio(word,item.slow);
    }else if(item.playing){item.playing=false;speechFallback(word)}
  };
  audio.onplaying=function(){audioStatus("🔊 "+word+(item.slow?"（慢速）":"")+" 正在播放");item.playing=false};
  audio.onended=function(){audioStatus("✓ 發音播放完成")};
  try{audio.load()}catch(ignore){}
  return item;
}
function warmAudio(){
  // Limit parallel connections to keep the webpage responsive on mobile data.
  words.forEach(function(word,i){
    setTimeout(function(){if(!audioMap[word[0]])makeAudio(word[0],0)},i*90);
  });
}
function playAudio(word,slow){
  var item=audioMap[word]||makeAudio(word,0);
  item.playing=true;item.slow=!!slow;
  if(audioActive&&audioActive!==item.audio){try{audioActive.pause()}catch(ignore){}}
  var audio=item.audio;
  audioActive=audio;
  try{audio.pause();audio.currentTime=0}catch(ignore){}
  audio.playbackRate=slow?0.75:1;
  audioStatus(item.ready?"🔊 正在播放 "+word:"🔊 音檔準備中…");
  try{var p=audio.play();if(p&&typeof p.catch==="function")p.catch(function(){
    if(audioMap[word]!==item||item.audio!==audio)return;
    item.playing=false;
    speechFallback(word);
  })}catch(e){item.playing=false;speechFallback(word)}
}
function say(text,slow){
  text=String(text).toLowerCase().trim();
  if(audioMap[text])playAudio(text,slow);
  else playAudio(text,slow);
}
function fullSentence(w){return w[2].replace("____",w[0]);}
var sentenceAudio=Object.create(null),sentenceActive=null;
function sentenceVoiceFallback(phrase,slow){
 if(!("speechSynthesis" in window)){audioStatus("整句語音無法播放，請用 Safari 開啟",true);return}
 try{var u=new SpeechSynthesisUtterance(phrase);u.lang="en-US";u.rate=slow?0.72:0.88;u.volume=1;
 u.onstart=function(){audioStatus("🔊 正在朗讀整句英文")};
 u.onerror=function(){audioStatus("無法播放整句英文，請用 Safari 開啟",true)};
 speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){audioStatus("整句語音無法播放",true)}
}
function sentenceSound(w,slow){
 var text=fullSentence(w),key=w[0],audio=sentenceAudio[key];
 if(sentenceActive){try{sentenceActive.pause()}catch(ignore){}}
 try{speechSynthesis.cancel()}catch(ignore){}
 if(!audio){audio=new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q="+encodeURIComponent(text));audio.preload="auto";sentenceAudio[key]=audio}
 sentenceActive=audio;
 try{audio.currentTime=0}catch(ignore){}
 audio.playbackRate=slow?.72:1;
 audioStatus("🔊 正在準備完整句子發音…");
 audio.onplaying=function(){audioStatus("🔊 正在播放完整英文句子")};
 audio.onerror=function(){sentenceVoiceFallback(text,slow)};
 try{var p=audio.play();if(p&&p.catch)p.catch(function(){sentenceVoiceFallback(text,slow)})}
 catch(e){sentenceVoiceFallback(text,slow)}
}
function warmSentences(){words.forEach(function(w,i){setTimeout(function(){
 if(sentenceAudio[w[0]])return;
 var a=new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q="+encodeURIComponent(fullSentence(w)));
 a.preload="auto";sentenceAudio[w[0]]=a;try{a.load()}catch(ignore){}
},1100+i*120)})}
function testTone(){try{var C=window.AudioContext||window.webkitAudioContext;if(!C){audioStatus("不支援音效測試",true);return;}var ctx=new C();ctx.resume();var o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.setValueAtTime(523.25,ctx.currentTime);o.frequency.setValueAtTime(659.25,ctx.currentTime+0.2);g.gain.setValueAtTime(0.001,ctx.currentTime);g.gain.linearRampToValueAtTime(0.22,ctx.currentTime+0.02);g.gain.setValueAtTime(0.22,ctx.currentTime+0.30);g.gain.linearRampToValueAtTime(0.001,ctx.currentTime+0.44);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.45);setTimeout(function(){ctx.close()},900);audioStatus("已送出提示音。如仍無聲，請提高媒體音量並檢查靜音模式。")}catch(e){audioStatus("測試音效無法啟動，請使用 Safari",true)}}

function btn(label,act,cls,attr){return '<button class="btn '+(cls||"outline")+'" data-action="'+act+'" '+(attr||"")+'>'+label+'</button>'}
function frame(){
 var a=s.attempts,c=a.filter(function(x){return x.good}).length,num=currentPool().length;
 var unitButtons=wordUnits.map(function(u,i){return btn((s.scope===i?"✓ ":"")+safe(u.title)+"（"+u.indices.length+" 字）","scopeUnit",s.scope===i?"primary wide":"outline wide",'data-index="'+i+'"')}).join("");
 app.innerHTML='<section class="hero"><span class="tag">VOCABULARY QUEST</span><h1>英文單字闖關王 🏆</h1><p>隨機題庫 · 多單元累積 · 獨立闖關</p></section>'+
 '<div class="stats"><div class="stat"><b>'+words.length+'</b><small>單字庫總數</small></div><div class="stat"><b>'+wordUnits.length+'</b><small>收錄單元</small></div><div class="stat"><b>'+(a.length?Math.round(c/a.length*100)+"%":"—")+'</b><small>本頁答對率</small></div></div>'+
 '<section class="panel"><h2>📚 選擇學習範圍</h2><p>已選：'+safe(scopeName())+'</p><div class="actions">'+
 unitButtons+btn((s.scope<0?"✓ ":"")+"🌍 全部單字總複習（"+words.length+" 字）","scopeAll",s.scope<0?"primary wide":"secondary wide")+'</div></section>'+
 '<section class="panel"><h2>🎯 選擇獨立關卡</h2><p>每關題目都會重新洗牌，做完可單獨查看成績。</p><div class="actions">'+
 btn("① 中英配對（"+num+" 題）","stage0","primary wide")+
 btn("② 英文拼字（"+num+" 題）","stage1","secondary wide")+
 btn("③ 句子填空（"+num+" 題）","stage2","secondary wide")+'</div></section>'+
 '<section class="panel"><h2>🏆 三關連續挑戰</h2><p>共 '+(num*3)+' 題，每關重新隨機出題。</p>'+
 btn("🚀 三關連續挑戰（"+(num*3)+" 題）","start","outline wide")+'</section>'+
 '<section class="panel"><h2>📖 單字學習</h2><div class="actions">'+
 btn("📖 一般單字卡（隨機）","study","secondary wide")+
 btn("🎧 中文聽力卡（隨機）","studyCN","secondary wide")+
 btn("📚 查看永久單字庫","list","outline wide")+
 btn("📊 本頁成績","report","outline wide")+'</div></section>'+
 '<section class="panel"><h2>🔊 聲音測試</h2><p>按測試鍵確認手機音效。</p>'+
 btn("🔈 測試聲音","testTone","outline wide")+'<p id="audio-status" role="status" class="muted"></p></section>'+
 '<div class="notice">📚 教材單字永久保留在 GitHub 單字庫。下次把新課本傳給我，可新增單元且保留舊單字。☁️ 答題成績尚未上傳雲端，重新整理後仍會消失。</div>'
}
function cards(){
 var w=words[s.cardOrder[s.card]],chinese=s.view==="studyCN",front=chinese?"先看中文，聽英文發音再猜拼寫":"先看英文，猜猜中文意思";
 var showCN=chinese||s.flipped,showEN=!chinese||s.flipped;
 var content=(showCN?'<span class="trans">'+safe(w[1])+'</span>':'')+
  (showEN?'<b>'+w[0]+'</b><span class="muted">/'+w[4]+'/</span>':'');
 app.innerHTML='<div class="row"><h1 class="title">'+(chinese?'🎧 中文聽力單字卡':'📖 英文學習單字卡')+'</h1><span class="muted">'+(s.card+1)+' / '+s.cardOrder.length+'</span></div>'+
 '<div class="progress"><div class="bar" style="width:'+((s.card+1)/12*100)+'%"></div></div>'+
 '<button class="card" data-action="flip"><span class="muted">'+(s.flipped?'點一下重新隱藏答案':front)+'</span>'+
 content+'<span class="small">'+(s.flipped?safe(w[3]):(chinese?'聽完後點卡片，揭曉英文':'點卡片，揭曉中文'))+'</span></button>'+
 '<div class="flex">'+btn("🔊 英文發音","sound","secondary")+btn("🐢 慢速朗讀","slow","secondary")+'</div>'+
 '<p id="audio-status" role="status" class="muted center">按喇叭播放英文單字。</p>'+
 '<div class="flex">'+btn("← 上一張","prev","outline",s.card===0?"disabled":"")+btn("下一張 →","nextcard","outline",s.card===s.cardOrder.length-1?"disabled":"")+'</div>'+
 '<div class="actions">'+btn("🔀 重新洗牌","shuffleCards","outline wide")+btn(chinese?"切換一般單字卡":"切換中文聽力卡",chinese?"study":"studyCN","outline wide")+btn("🎯 選擇練習關卡","home","primary wide")+'</div>'
}
function listing(){
 var out='<h1 class="title">📚 永久單字庫｜'+words.length+' 字</h1><p class="muted">將來追加新單元後，這裡會保留所有學過的單字。</p>';
 wordUnits.forEach(function(u){
  out+='<section class="panel"><h2>'+safe(u.title)+'（'+u.indices.length+' 字）</h2>';
  u.indices.forEach(function(i,n){var w=words[i];out+='<div class="table-row"><div><strong>'+(n+1)+'. '+safe(w[0])+'</strong><div class="small">'+safe(w[1])+'</div></div><button class="pill" data-action="wordSound" data-index="'+i+'">🔊</button></div>'});
  out+='</section>'
 });
 out+='<section class="panel"><h2>➕ 如何新增下一課</h2><p>直接把新單字或課本照片傳給 ChatGPT，告訴我「加入英文單字闖關王」，我會追加到 GitHub 單字庫。此網站尚未提供直接編輯功能。</p></section>';
 app.innerHTML=out+'<div class="actions">'+btn("🎯 回首頁選關卡","home","primary wide")+'</div>'
}
function stageName(){return s.retry?"錯字復活賽":(["第一關｜中英配對","第二關｜拼字挑戰","第三關｜句子填空"])[s.stage]}
function current(){return words[s.order[s.q]]}
function opts(){
 var id=s.order[s.q],key=(s.retry?"retry":s.stage)+":"+s.q+":"+id;
 if(s.choiceKey===key)return s.choiceList;
 var pool=s.pool.length>=4?s.pool:allIndices();
 var others=shuffled(pool.filter(function(i){return i!==id}));
 var order=shuffled([id].concat(others.slice(0,3)));
 s.choiceKey=key;s.choiceList=order;return order
}
function question(){var w=current(),spell=s.stage===1||s.retry;var prompt=s.retry||s.stage===1?safe(w[1]):s.stage===0?w[0]:safe(w[2]).replace("____","_____");var total=s.order.length;var h='<div class="row"><div><h1 class="title">'+stageName()+'</h1><div class="muted">第 '+(s.q+1)+' / '+total+' 題</div></div><strong>⭐ '+s.score+' 分</strong></div><div class="progress"><div class="bar" style="width:'+((s.q+(s.answered?1:0))/total*100)+'%"></div></div><div class="question"><div class="muted">'+(spell?"看到中文，拼出正確的英文":s.stage===0?"選出單字的中文意思":"先聽整句英文，再選出填空單字")+'</div><h2 class="'+(s.stage===2&&!s.retry?"sentence":"")+'">'+prompt+'</h2>'+(!spell?'<div><button class="pill" data-action="sound">'+(s.stage===2?"🔊 整句朗讀":"🔊 聽單字")+'</button> <button class="pill" data-action="slow">'+(s.stage===2?"🐢 整句慢速":"🐢 單字慢速")+'</button></div>':'')+'</div>';
if(spell){h+='<input class="input" id="spelling" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在這裡輸入英文" aria-label="輸入英文拼字" '+(s.answered?"disabled":"")+' value="'+safe(s.typed)+'"><div class="flex">'+btn("💡 提示","hint","outline",s.clue||s.answered?"disabled":"")+btn("確認拼字","submit","primary",s.answered?"disabled":"")+'</div>'+(s.clue?'<div class="help">提示：字首 '+w[0][0].toUpperCase()+'，共 '+w[0].length+' 個英文字母。</div>':'')}else{h+='<div class="grid2">'+opts().map(function(i){var c=s.answered?(i===s.order[s.q]?"good":s.selected===i?"bad":""):"";return '<button class="option '+c+'" data-action="choose" data-index="'+i+'" '+(s.answered?"disabled":"")+'>'+(s.stage===0?safe(words[i][1]):words[i][0])+'</button>'}).join("")+'</div>'}
if(s.answered){h+='<div class="feedback '+(s.correct?"":"wrong")+'"><strong>'+(s.correct?"✅ 答對了，繼續加油！":"🌱 答錯了，這個字再記一次！")+'</strong><p><b>'+w[0]+'</b> ＝ '+safe(w[1])+'</p><p>'+safe(w[3])+'</p><div class="flex"><button class="pill" data-action="sound">🔊 再聽一次</button></div></div><div class="actions">'+btn(s.q===total-1?(s.retry||s.challengeMode==="single"||s.stage===2?"🏆 查看成績":"前往下一關 →"):"下一題 →","advance","primary wide")+'</div>'}
if(s.stage===2&&!s.retry)h+='<p class="muted center" id="audio-status" role="status">按「整句朗讀」聽完整英文句子</p>';
app.innerHTML=h;
}
function report(){var a=s.attempts,n=a.length,c=a.filter(function(x){return x.good}).length;var names=["中英配對","英文拼字","句子填空"];var h='<h1 class="title">📊 '+(s.challengeMode==="single"?"本關成績表":"三關成績表")+'</h1><div class="stats"><div class="stat"><b>'+n+'</b><small>作答題數</small></div><div class="stat"><b>'+c+'</b><small>答對題數</small></div><div class="stat"><b>'+(n?Math.round(c/n*100)+"%":"—")+'</b><small>正確率</small></div></div><section class="panel"><h2>各關卡成績</h2>';names.forEach(function(name,j){if(s.challengeMode==="single"&&j!==s.selectedStage)return;var z=a.filter(function(x){return x.stage===j}),t=z.filter(function(x){return x.good}).length;h+='<div class="table-row"><span>'+name+'</span><strong>'+t+' / '+z.length+'</strong></div>'});h+='</section><section class="panel"><h2>🧠 本次錯字本（'+s.missed.length+' 字）</h2>';if(!s.missed.length)h+='<p>目前沒有錯字，請繼續練習。</p>';s.missed.forEach(function(i){h+='<div class="table-row"><b>'+words[i][0]+'</b><span class="small">'+safe(words[i][1])+'</span></div>'});h+='</section><div class="notice">☁️ 這是本次試玩成績，尚未寫入雲端，刷新網頁會清空。雲端版完成後才會支援永久保存與跨裝置查詢。</div><div class="actions">'+(s.missed.length?btn("🔁 錯字復活賽","retry","primary wide"):"")+btn("再挑戰相同關卡","replay","secondary wide")+btn("選擇其他關卡","home","outline wide")+'</div>';if(s.sessionRuns.length){h+='<section class="panel"><h2>📋 本頁完成紀錄</h2><p>只在這次開啟的網頁中暫時顯示，重新整理或關閉後會消失。</p>';
s.sessionRuns.forEach(function(r,i){h+='<div class="table-row"><span><b>'+safe(r.label||'測驗')+'</b><br><span class="small">'+r.date+'</span></span><strong>'+r.correct+' / '+r.total+'</strong></div>'});h+='</section>'}
h+='<section class="panel"><h2>☁️ 雲端歷史成績尚未啟用</h2><p>先前關閉頁面的測驗沒有傳上雲端，無法復原。雲端資料庫連線完成後，才能跨裝置永久查詢。</p></section>';
app.innerHTML=h}
function start(retry,whichStage){s.view="game";s.retry=!!retry;s.challengeMode=retry?s.challengeMode:(typeof whichStage==="number"?"single":"all");if(!retry)s.selectedStage=s.challengeMode==="single"?whichStage:0;s.q=0;s.stage=retry?1:(s.challengeMode==="single"?s.selectedStage:0);s.pool=retry?s.pool.slice():currentPool();s.order=shuffled(retry?s.missed:s.pool);s.choiceKey="";s.choiceList=[];s.selected=null;s.typed="";s.answered=false;s.correct=false;s.clue=false;if(!retry){s.score=0;s.attempts=[];s.missed=[];s.lastRecorded=false}question()}
function answer(val){if(s.answered)return;var idx=s.order[s.q],correct=(s.retry||s.stage===1)?String(val).trim().toLowerCase()===words[idx][0]:Number(val)===idx;s.answered=true;s.correct=correct;s.selected=s.retry||s.stage===1?null:Number(val);s.score+=correct?(s.clue?7:10):0;if(s.retry){if(correct)s.missed=s.missed.filter(function(i){return i!==idx})}else{s.attempts.push({stage:s.stage,index:idx,good:correct});if(!correct&&s.missed.indexOf(idx)<0)s.missed.push(idx)}question()}
function next(){
 s.q++;s.answered=false;s.typed="";s.clue=false;s.selected=null;s.choiceKey="";s.choiceList=[];
 if(s.q>=s.order.length){
  if(s.retry||s.challengeMode==="single"||s.stage===2){
   s.view="report";
   if(!s.retry&&!s.lastRecorded&&s.attempts.length){
    var done=s.attempts.filter(function(x){return x.good}).length;
    var label=s.challengeMode==="single"?["第一關｜中英配對","第二關｜英文拼字","第三關｜句子填空"][s.stage]:"三關連續挑戰";
    s.sessionRuns.push({correct:done,total:s.attempts.length,label:label,date:new Date().toLocaleString("zh-TW")});
    s.lastRecorded=true
   }
   report();return
  }
  s.stage++;s.q=0;s.order=shuffled(s.pool);s.choiceKey="";s.choiceList=[]
 }
 s.view="game";question()
}
function render(){window.scrollTo(0,0);if(s.view==="home")frame();else if(s.view==="study"||s.view==="studyCN")cards();else if(s.view==="list")listing();else if(s.view==="game")question();else report()}
app.addEventListener("input",function(e){if(e.target.id==="spelling")s.typed=e.target.value});
app.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="spelling"&&!s.answered&&s.typed.trim())answer(s.typed)});
app.addEventListener("click",function(e){var t=e.target.closest("[data-action]");if(!t)return;var act=t.dataset.action;if(act==="testTone")testTone();else if(act==="stage0"||act==="stage1"||act==="stage2")start(false,Number(act.slice(-1)));else if(act==="start")start(false);else if(act==="retry")start(true);else if(act==="replay")start(false,s.challengeMode==="single"?s.selectedStage:undefined);else if(act==="home"){s.view="home";render()}else if(act==="scopeUnit"){s.scope=Number(t.dataset.index);render()}else if(act==="scopeAll"){s.scope=-1;render()}else if(act==="study"||act==="studyCN"){s.view=act;s.cardOrder=shuffled(currentPool());s.card=0;s.flipped=false;render()}else if(act==="shuffleCards"){s.cardOrder=shuffled(currentPool());s.card=0;s.flipped=false;render()}else if(act==="flip"){s.flipped=!s.flipped;render()}else if(act==="prev"||act==="nextcard"){s.card=Math.max(0,Math.min(s.cardOrder.length-1,s.card+(act==="prev"?-1:1)));s.flipped=false;render()}else if(act==="sound"||act==="slow"){if(s.view==="game"&&s.stage===2&&!s.retry)sentenceSound(current(),act==="slow");else say(currentIfStudy(),act==="slow")}else if(act==="wordSound"){say(words[Number(t.dataset.index)][0],false)}else if(act==="list"){s.view="list";render()}else if(act==="report"){s.view="report";render()}else if(act==="choose"){answer(t.dataset.index)}else if(act==="hint"){s.clue=true;question()}else if(act==="submit"){if(s.typed.trim())answer(s.typed);else{var el=document.getElementById("spelling");if(el)el.focus()}}else if(act==="advance"){next()}});
function currentIfStudy(){return (s.view==="study"||s.view==="studyCN")?words[s.cardOrder[s.card]][0]:current()[0]}
document.getElementById("homebtn").addEventListener("click",function(){s.view="home";render()});render();warmAudio();warmSentences();
})();
</script></body></html>
