<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f4f6ff"><title>英文單字闖關王｜12字試玩</title>
<style>
:root{--bg:#f4f6ff;--ink:#263554;--muted:#697a94;--line:#e0e6f4;--blue:#5165d8;--blue2:#7a57d7;--white:#fff;--green:#1d8a68;--red:#ca4e66;--gold:#d4a032}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:radial-gradient(ellipse at top left,#e2edff,transparent 44%),radial-gradient(ellipse at top right,#fff0e1,transparent 40%),var(--bg);font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.5;cursor:default}.shell{margin:auto;max-width:760px;padding:21px 18px 65px;min-height:100dvh}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:18px}.mark{background:#e7eafe;border-radius:13px;padding:9px}.headbtn{border:1px solid var(--line);background:white;border-radius:12px;padding:9px 13px;font-weight:700;color:var(--ink)}.hero{background:linear-gradient(120deg,#506de0,#8661d0);color:white;padding:28px 24px;border-radius:24px;box-shadow:0 14px 30px #526de133}.hero h1{font-size:clamp(28px,7vw,39px);margin:0 0 8px;line-height:1.2}.hero p{margin:0;color:#eff1ff;font-size:14px}.tag{display:inline-block;background:#ffffff2b;border-radius:99px;padding:5px 11px;font-size:12px;margin-bottom:12px}.stats,.triple{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.stat,.mini{background:white;border:1px solid var(--line);padding:13px 7px;border-radius:16px;text-align:center}.stat b{display:block;font-size:23px}.stat small,.mini small{display:block;font-size:11px;color:var(--muted)}.panel{background:white;border-radius:23px;border:1px solid var(--line);padding:21px;margin-top:16px;box-shadow:0 9px 24px #3049680e}.panel h2{font-size:19px;margin:0 0 10px}.panel p{color:var(--muted);font-size:13px;margin:3px 0 13px}.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:800;min-height:49px;display:inline-flex;align-items:center;justify-content:center;gap:7px}.wide{width:100%}.primary{color:#fff;background:var(--blue)}.secondary{background:#e9edff;color:#3a4aa2}.outline{background:white;border:1px solid var(--line);color:var(--ink)}.actions{display:grid;gap:10px;margin-top:14px}.notice{font-size:12px;color:#7b6570;background:#fff5f1;border:1px solid #f9dfd3;border-radius:12px;padding:11px 13px;margin-top:16px}.muted{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:24px;line-height:1.3;margin:0}.progress{background:#e7ebf6;height:9px;border-radius:9px;margin:16px 0;overflow:hidden}.bar{background:linear-gradient(90deg,#6d8cec,#8365d3);height:100%;border-radius:9px;transition:width .2s}.question{background:linear-gradient(135deg,#f0f5ff,#fff);border:1px solid #e0e8ff;border-radius:21px;text-align:center;padding:26px 17px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.question h2{font-size:clamp(27px,6vw,38px);margin:0;overflow-wrap:anywhere}.question h2.sentence{font-size:clamp(19px,4.4vw,27px)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}.option{min-height:75px;border:1.5px solid #dee5f3;border-radius:15px;background:white;padding:12px 8px;font-size:15px;font-weight:700;color:var(--ink);overflow-wrap:anywhere}.option:hover{border-color:#98ace7;background:#f7f9ff}.option.good{background:#e7f8ee;border-color:#4fb68d}.option.bad{background:#fff0f1;border-color:#e69bab}.pill{border:1px solid #dce4f9;background:white;color:var(--blue);border-radius:99px;padding:8px 15px;font-size:13px;font-weight:800}.input{width:100%;border:2px solid #dfe5f5;border-radius:14px;padding:14px;font-size:22px;color:var(--ink);text-align:center;margin:15px 0 10px}.help{background:#fff6e6;border-radius:12px;padding:11px;font-size:13px;margin:8px 0;color:#86631f}.feedback{background:#eaf9f2;border:1px solid #c3e7d4;border-radius:15px;padding:14px;margin-top:15px}.feedback.wrong{background:#fff2f3;border-color:#f1d4da}.feedback strong{display:block;font-size:17px}.feedback p{margin:8px 0 0;font-size:13px;color:#4c6077}.card{width:100%;background:linear-gradient(145deg,#eef3ff,#fff);border:1px solid #dfe7fb;border-radius:24px;min-height:270px;padding:30px 15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--ink)}.card b{font-size:clamp(30px,8vw,45px)}.card .trans{font-size:23px;font-weight:800}.flex{display:flex;gap:9px;justify-content:space-between;align-items:center;margin-top:14px}.flex>.btn{flex:1}.table-row{border-bottom:1px solid #edf0f7;padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.table-row:last-child{border:0}.small{font-size:12px;color:var(--muted)}.success{color:var(--green)}.danger{color:var(--red)}.trophy{font-size:56px;text-align:center}.star{color:var(--gold);font-size:24px}.center{text-align:center}button:focus-visible,input:focus-visible{outline:3px solid #89a0f2;outline-offset:2px}
@media(max-width:380px){.shell{padding:17px 12px 55px}.option{font-size:14px}.panel{padding:17px}.hero{padding:22px 17px}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><span class="mark">🎮</span><span>單字闖關王</span></div><button class="headbtn" id="homebtn">⌂ 首頁</button></header><div id="app" aria-live="polite"></div></main>
<script>
(function(){
"use strict";
var words=[
["origin","來源；起源","Do you know the ____ of this festival?","可聯想 original（原本的）。","ˈɔːrɪdʒɪn"],
["tale","（尤指誇大的）陳述；描述","Steven's ____ sounded hard to believe.","也可以指故事。","teɪl"],
["proper","像樣的；適當的","Ryan finally bought a ____ bed.","proper bed：像樣的床。","ˈprɑːpər"],
["interrupt","中斷；暫停","Heavy rain ____ the baseball game.","下雨讓球賽中斷。","ˌɪntəˈrʌpt"],
["request","要求；請求","Mel decided to ____ an afternoon off.","request time off：請假。","rɪˈkwest"],
["slice","（食物的）片；薄片","Mary cut a ____ of cheese.","a slice of cheese：一片起司。","slaɪs"],
["specific","特定的","The doctor asked about the patient's ____ needs.","specific needs：特定需求。","spəˈsɪfɪk"],
["familiar","熟悉的；常見的","This is a ____ birthday song.","familiar song：熟悉的歌曲。","fəˈmɪliər"],
["broad","概括的；粗略的","Jim has a ____ idea of the meeting.","broad idea：大概了解。","brɔːd"],
["bacon","培根","My dog always begs for ____.","早餐常見的培根。","ˈbeɪkən"],
["press","壓；壓平","The cook will ____ the meat flat.","press the meat flat：把肉壓平。","pres"],
["combine","混合；結合；組合","We can ____ A with B.","combine A with B：把 A 和 B 結合。","kəmˈbaɪn"]
];
var app=document.getElementById("app");var s={view:"home",card:0,flipped:false,stage:0,q:0,order:[],selected:null,typed:"",answered:false,correct:false,clue:false,score:0,attempts:[],missed:[],retry:false};
function safe(x){return String(x).replace(/[&<>"]/g,function(a){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[a]})}
function say(txt,slow){if(!("speechSynthesis" in window)){alert("這個瀏覽器不支援語音朗讀");return;}try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(txt);u.lang="en-US";u.rate=slow?.62:.87;u.pitch=1;var v=speechSynthesis.getVoices().filter(function(v){return v.lang.toLowerCase().indexOf("en-us")===0})[0];if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){alert("語音播放失敗，請確認聲音設定。")}}
function btn(label,act,cls,attr){return '<button class="btn '+(cls||"outline")+'" data-action="'+act+'" '+(attr||"")+'>'+label+'</button>'}
function frame(){var a=s.attempts,c=a.filter(function(x){return x.good}).length;app.innerHTML='<section class="hero"><span class="tag">VOCABULARY QUEST</span><h1>英文單字闖關王 🏆</h1><p>12 個課本單字 · 聽發音 · 記意思 · 練拼寫</p></section><div class="stats"><div class="stat"><b>12</b><small>學習單字</small></div><div class="stat"><b>36</b><small>三關題數</small></div><div class="stat"><b>'+ (a.length?Math.round(c/a.length*100)+"%":"—") +'</b><small>本次正確率</small></div></div><section class="panel"><h2>🎯 開始今天的挑戰</h2><p>先複習，再進行三個難度的測驗，答錯的字最後會集中複習。</p><div class="actions">'+btn("🚀 開始 36 題闖關","start","primary wide")+btn("📖 先看 12 張單字卡","study","secondary wide")+btn("📚 查看 12 個單字","list","outline wide")+btn("📊 本次成績（家長檢視）","report","outline wide")+'</div></section><div class="notice">☁️ 雲端成績尚未連線。本版本可直接線上試玩，答題成績僅暫存在當前網頁執行期間，不會寫入手機 localStorage；重新整理就會清除。語音需在瀏覽器點按播放。</div>'}
function cards(){var w=words[s.card];app.innerHTML='<div class="row"><h1 class="title">📖 單字學習卡</h1><span class="muted">'+(s.card+1)+' / 12</span></div><div class="progress"><div class="bar" style="width:'+((s.card+1)/12*100)+'%"></div></div><button class="card" data-action="flip"><span class="muted">'+(s.flipped?"點一下回到正面":"點一下翻面看中文")+'</span>'+(s.flipped?'<span class="trans">'+safe(w[1])+'</span><span class="muted">'+safe(w[3])+'</span>':'<b>'+w[0]+'</b><span class="muted">/'+w[4]+'/</span>')+'<span class="small">'+(s.card>5?"第 3 頁":"第 2 頁")+(s.card===6||s.card===7?" · ⭐ 大考字彙":"")+'</span></button><div class="flex">'+btn("🔊 發音","sound","secondary")+btn("🐢 慢速","slow","secondary")+'</div><div class="flex">'+btn("← 上一張","prev","outline",s.card===0?"disabled":"")+btn("下一張 →","nextcard","outline",s.card===11?"disabled":"")+'</div><div class="actions">'+btn("🚀 開始闖關","start","primary wide")+'</div>'}
function listing(){var out='<h1 class="title">📚 課本 12 個單字</h1><section class="panel">';words.forEach(function(w,i){out+='<div class="table-row"><div><strong>'+(i+1)+'. '+w[0]+'</strong><div class="small">'+safe(w[1])+'</div></div><button class="pill" data-action="wordSound" data-index="'+i+'" aria-label="發音 '+w[0]+'">🔊</button></div>'});app.innerHTML=out+'</section><div class="actions">'+btn("開始單字闖關","start","primary wide")+'</div>'}
function stageName(){return s.retry?"錯字復活賽":(["第一關｜中英配對","第二關｜拼字挑戰","第三關｜句子填空"])[s.stage]}
function current(){return words[s.order[s.q]]}
function opts(){var id=s.order[s.q],o=[id,(id+3)%12,(id+7)%12,(id+9)%12];var shift=(s.q*3+s.stage)%4;return o.map(function(_,i){return o[(i+shift)%4]})}
function question(){var w=current(),spell=s.stage===1||s.retry;var prompt=s.retry||s.stage===1?safe(w[1]):s.stage===0?w[0]:safe(w[2]).replace("____","_____");var total=s.order.length;var h='<div class="row"><div><h1 class="title">'+stageName()+'</h1><div class="muted">第 '+(s.q+1)+' / '+total+' 題</div></div><strong>⭐ '+s.score+' 分</strong></div><div class="progress"><div class="bar" style="width:'+((s.q+(s.answered?1:0))/total*100)+'%"></div></div><div class="question"><div class="muted">'+(spell?"看到中文，拼出正確的英文":s.stage===0?"選出單字的中文意思":"選出最適合填入句子的單字")+'</div><h2 class="'+(s.stage===2&&!s.retry?"sentence":"")+'">'+prompt+'</h2>'+(!spell?'<div><button class="pill" data-action="sound">🔊 聽發音</button> <button class="pill" data-action="slow">🐢 慢速</button></div>':'')+'</div>';
if(spell){h+='<input class="input" id="spelling" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在這裡輸入英文" aria-label="輸入英文拼字" '+(s.answered?"disabled":"")+' value="'+safe(s.typed)+'"><div class="flex">'+btn("💡 提示","hint","outline",s.clue||s.answered?"disabled":"")+btn("確認拼字","submit","primary",s.answered?"disabled":"")+'</div>'+(s.clue?'<div class="help">提示：字首 '+w[0][0].toUpperCase()+'，共 '+w[0].length+' 個英文字母。</div>':'')}else{h+='<div class="grid2">'+opts().map(function(i){var c=s.answered?(i===s.order[s.q]?"good":s.selected===i?"bad":""):"";return '<button class="option '+c+'" data-action="choose" data-index="'+i+'" '+(s.answered?"disabled":"")+'>'+(s.stage===0?safe(words[i][1]):words[i][0])+'</button>'}).join("")+'</div>'}
if(s.answered){h+='<div class="feedback '+(s.correct?"":"wrong")+'"><strong>'+(s.correct?"✅ 答對了，繼續加油！":"🌱 答錯了，這個字再記一次！")+'</strong><p><b>'+w[0]+'</b> ＝ '+safe(w[1])+'</p><p>'+safe(w[3])+'</p><div class="flex"><button class="pill" data-action="sound">🔊 再聽一次</button></div></div><div class="actions">'+btn(s.q===total-1?(s.retry||s.stage===2?"🏆 查看成績":"前往下一關 →"):"下一題 →","advance","primary wide")+'</div>'}
app.innerHTML=h;
}
function report(){var a=s.attempts,n=a.length,c=a.filter(function(x){return x.good}).length;var names=["中英配對","英文拼字","句子填空"];var h='<h1 class="title">📊 本次家長成績表</h1><div class="stats"><div class="stat"><b>'+n+'</b><small>作答題數</small></div><div class="stat"><b>'+c+'</b><small>答對題數</small></div><div class="stat"><b>'+(n?Math.round(c/n*100)+"%":"—")+'</b><small>正確率</small></div></div><section class="panel"><h2>各關卡成績</h2>';names.forEach(function(name,j){var z=a.filter(function(x){return x.stage===j}),t=z.filter(function(x){return x.good}).length;h+='<div class="table-row"><span>'+name+'</span><strong>'+t+' / '+z.length+'</strong></div>'});h+='</section><section class="panel"><h2>🧠 本次錯字本（'+s.missed.length+' 字）</h2>';if(!s.missed.length)h+='<p>目前沒有錯字，請繼續練習。</p>';s.missed.forEach(function(i){h+='<div class="table-row"><b>'+words[i][0]+'</b><span class="small">'+safe(words[i][1])+'</span></div>'});h+='</section><div class="notice">☁️ 這是本次試玩成績，尚未寫入雲端，刷新網頁會清空。雲端版完成後才會支援永久保存與跨裝置查詢。</div><div class="actions">'+(s.missed.length?btn("🔁 錯字復活賽","retry","primary wide"):"")+btn("再挑戰一次","start","secondary wide")+btn("回首頁","home","outline wide")+'</div>';app.innerHTML=h}
function start(retry){s.view="game";s.retry=!!retry;s.q=0;s.stage=retry?1:0;s.order=retry?s.missed.slice():words.map(function(_,i){return i});s.selected=null;s.typed="";s.answered=false;s.correct=false;s.clue=false;if(!retry){s.score=0;s.attempts=[];s.missed=[]}question()}
function answer(val){if(s.answered)return;var idx=s.order[s.q],correct=(s.retry||s.stage===1)?String(val).trim().toLowerCase()===words[idx][0]:Number(val)===idx;s.answered=true;s.correct=correct;s.selected=s.retry||s.stage===1?null:Number(val);s.score+=correct?(s.clue?7:10):0;if(s.retry){if(correct)s.missed=s.missed.filter(function(i){return i!==idx})}else{s.attempts.push({stage:s.stage,index:idx,good:correct});if(!correct&&s.missed.indexOf(idx)<0)s.missed.push(idx)}question()}
function next(){s.q++;s.answered=false;s.typed="";s.clue=false;s.selected=null;if(s.q>=s.order.length){if(s.retry||s.stage===2){s.view="report";report();return;}s.stage++;s.q=0}s.view="game";question()}
function render(){window.scrollTo(0,0);if(s.view==="home")frame();else if(s.view==="study")cards();else if(s.view==="list")listing();else if(s.view==="game")question();else report()}
app.addEventListener("input",function(e){if(e.target.id==="spelling")s.typed=e.target.value});
app.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="spelling"&&!s.answered&&s.typed.trim())answer(s.typed)});
app.addEventListener("click",function(e){var t=e.target.closest("[data-action]");if(!t)return;var act=t.dataset.action;if(act==="start")start(false);else if(act==="retry")start(true);else if(act==="home"){s.view="home";render()}else if(act==="study"){s.view="study";s.card=0;s.flipped=false;render()}else if(act==="flip"){s.flipped=!s.flipped;render()}else if(act==="prev"||act==="nextcard"){s.card=Math.max(0,Math.min(11,s.card+(act==="prev"?-1:1)));s.flipped=false;render()}else if(act==="sound"||act==="slow"){say(currentIfStudy(),act==="slow")}else if(act==="wordSound"){say(words[Number(t.dataset.index)][0],false)}else if(act==="list"){s.view="list";render()}else if(act==="report"){s.view="report";render()}else if(act==="choose"){answer(t.dataset.index)}else if(act==="hint"){s.clue=true;question()}else if(act==="submit"){if(s.typed.trim())answer(s.typed);else{var el=document.getElementById("spelling");if(el)el.focus()}}else if(act==="advance"){next()}});
function currentIfStudy(){return s.view==="study"?words[s.card][0]:current()[0]}
document.getElementById("homebtn").addEventListener("click",function(){s.view="home";render()});render();
})();
</script></body></html>
