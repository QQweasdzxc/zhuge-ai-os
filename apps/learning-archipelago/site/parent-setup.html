<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>學習冒險島｜家長 PIN 設定</title><style>body{margin:0;background:#142249;color:#263658;font:16px/1.7 system-ui,-apple-system,sans-serif}main{max-width:480px;margin:7vh auto;padding:24px;background:#fffbed;border-radius:16px}h1{font-size:25px;margin:0 0 12px}p{margin:12px 0}input,button{box-sizing:border-box;font:inherit;min-height:46px;padding:10px;width:100%;border:1px solid #8795b8;border-radius:8px}label{display:block;margin:15px 0}button{background:#ffe09a;font-weight:700;cursor:pointer}button:disabled{background:#ddd;color:#777}a{color:#3854a2}@media(max-width:530px){main{margin:24px 14px;padding:22px}}</style></head><body><main><h1>設定家長 PIN</h1><p>家長驗證與孩子的家庭遊戲連結分開。這個一次性設定連結只供已核實的家長使用，請勿轉傳。</p><div id="status" role="status"></div><form id="setupForm" hidden><label>新的家長 PIN（6 至 12 位數字）<input name="pin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{6,12}" minlength="6" maxlength="12" required></label><label>再輸入一次 PIN<input name="confirmPin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{6,12}" minlength="6" maxlength="12" required></label><button type="submit">儲存家長 PIN</button></form><p>PIN 不會顯示在遊戲頁，也不會因為有人拿到家庭連結就能重設。</p><p><a href="./">回學習總部</a></p></main><script>
(()=>{'use strict';let token=new URLSearchParams(location.hash.slice(1)).get('s')||'';history.replaceState(null,'',location.pathname+location.search);const form=document.querySelector('#setupForm'),status=document.querySelector('#status');if(!/^[0-9a-f]{64}$/.test(token)){status.textContent='請使用家長專用的一次性設定連結。一般家庭遊戲連結不能設定或重設家長 PIN。';return}form.hidden=false;status.textContent='設定連結有效期為 30 分鐘，完成後即失效。';let busy=false;form.onsubmit=async e=>{e.preventDefault();if(busy)return;if(form.elements.pin.value!==form.elements.confirmPin.value){status.textContent='兩次 PIN 不相同，請再確認。';form.elements.pin.value='';form.elements.confirmPin.value='';return}busy=true;form.querySelector('button').disabled=true;try{const r=await fetch('https://lenpbbhwxyyfwgvjcozf.supabase.co/functions/v1/learning-adventure-cloud',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({action:'setupParent',setupToken:token,pin:form.elements.pin.value})});const data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||'設定尚未完成');token='';form.hidden=true;status.textContent='家長 PIN 已設定。請用原本的家庭遊戲連結進總部，在金幣與禮物商店的家長設定調整獎品。孩子送出兌換會先保留金幣，家長確認提供獎勵；取消會退回。';}catch(e){status.textContent=e.message||'暫時無法設定，請稍後再試。';}finally{form.elements.pin.value='';form.elements.confirmPin.value='';busy=false;form.querySelector('button').disabled=false;}};})();
</script></body></html>
