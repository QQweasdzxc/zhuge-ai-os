<main class="main">
 <div id="zhugeSharedHeader" class="top workspace-shell-header" data-zhuge-shared-header data-title="AI Board" data-description="工程協作工作平台｜查看正式工作、驗收清單與目前交接狀態" data-action-label="↻" data-action-id="refreshBoardBtn"></div>
 <div class="workspace-tabs workspace-subnav" aria-label="AI Board 子功能導覽">

 </div>

  <div data-board-main-view data-golden-master-surface></div>

   <header class="subview-header"><div><span class="subview-kicker">AI Board／工程準則</span><h2>📘 最高原則</h2><p>工程協作必須遵守的正式原則；固定區不參與 TASK Status 流轉。</p></div><span class="subview-source">來源：Supabase engineering_knowledge</span></header>
   <div id="principlesCards" class="principles-card-grid"></div>
  </section>
  <section class="board-subview system-map-view" data-board-view="system-map" hidden>
   <header class="subview-header"><div><span class="subview-kicker">AI Board／系統藍圖</span><h2>🗺️ 系統藍圖</h2><p>目前 Zhuge AI OS 的組成、模組關係與資料流。</p></div><span class="subview-source">來源：Supabase engineering_knowledge</span></header>
   <div id="systemMapCards" class="system-map-grid"></div>
  </section>
 </div>
