<script>
(function(){
  const buttons=[...document.querySelectorAll('[data-procurement-nav]')];
  const panels=[...document.querySelectorAll('[data-procurement-panel]')];
  buttons.forEach(btn=>btn.addEventListener('click',()=>{
    const key=btn.dataset.procurementNav;
    buttons.forEach(b=>{const on=b===btn;b.classList.toggle('active',on);b.setAttribute('aria-selected',String(on));});
    panels.forEach(panel=>panel.hidden=panel.dataset.procurementPanel!==key);
  }));
})();
</script>
