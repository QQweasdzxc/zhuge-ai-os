<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全站存取管理 · TRQN OS</title>
<style>body{margin:0;padding:24px;font:16px/1.6 system-ui;background:#101820;color:#edf4fa}button,a{font:inherit;color:inherit}button{padding:8px 16px;border:1px solid #668899;border-radius:8px;background:#223744;cursor:pointer}button:disabled{opacity:.5;cursor:wait}[hidden]{display:none!important}main{max-width:1120px;margin:auto}a{display:inline-block;margin:12px 0}#message{white-space:pre-wrap}label{display:flex;align-items:center;gap:12px}input{width:24px;height:24px}.global-setting{padding:24px;border:1px solid #536674;border-radius:18px;margin:20px 0 32px;background:#182632}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}.card{border:1px solid #536674;border-radius:20px;padding:22px;background:#192833;overflow-wrap:anywhere}.card.pending{border:3px solid #f6bb4b;padding:20px}.identity{display:flex;align-items:center;gap:12px}.identity h3,.identity p{margin:0}.avatar{border-radius:50%;background:#344b5b;min-width:48px;height:48px;display:grid;place-items:center;font-weight:700}.email,.meta{font-size:13px;color:#bacbd6}.badge{display:inline-block;margin-top:18px;font-size:13px}.pending .badge{color:#ffd588;font-weight:700}.note,details p{white-space:pre-wrap}.switch-line{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px}.apple-switch{position:relative;width:52px;height:32px;padding:0;border:0;border-radius:20px;background:#65717c;flex:none}.apple-switch:before{content:'';position:absolute;width:26px;height:26px;top:3px;left:3px;background:white;border-radius:50%;box-shadow:0 2px 4px #0004;transition:transform .18s}.apple-switch[aria-checked=true]{background:#30d158}.apple-switch[aria-checked=true]:before{transform:translateX(20px)}button:focus-visible,textarea:focus-visible{outline:3px solid #7fcaff;outline-offset:4px}#filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}#filters [aria-pressed=true]{background:#375a70;border-color:#9edaff}dialog{width:min(460px,calc(100% - 64px));border:1px solid #637e90;border-radius:20px;padding:24px;background:#182632;color:#edf4fa}dialog::backdrop{background:#0009}dialog label{display:block}textarea{box-sizing:border-box;width:100%;margin:10px 0;background:#101820;color:inherit;border:1px solid #637e90;padding:12px;font:inherit;border-radius:10px}.dialog-actions{display:flex;justify-content:flex-end;gap:12px}#confirm-error{color:#ffd588}@media(max-width:600px){body{padding:16px}.cards{grid-template-columns:1fr}h1{font-size:27px}}@media(prefers-reduced-motion:reduce){.apple-switch:before{transition:none}}</style></head>
<body><main><h1>全站存取管理</h1><p>每人一張名片，管理 App 使用權。此開關管制已接入 App 存取檢查的路徑。</p>
<p id="message" role="status" aria-live="polite">正在確認權限…</p>
<div id="login" hidden><button id="google" type="button">使用 Google 登入</button></div>
<section id="controls" hidden><section class="global-setting" aria-label="全站人工審核"><h2>全站人工審核</h2><p id="state"></p><label><input id="paused" type="checkbox" role="switch" aria-checked="false">暫停人工審核</label><p id="pause-note"></p></section><h2>App 成員與申請紀錄</h2><div id="filters" role="group" aria-label="篩選名片"><button data-filter="all" type="button">全部</button><button data-filter="pending" type="button">待審核</button><button data-filter="enabled" type="button">已允許</button><button data-filter="disabled" type="button">已禁止</button></div><div id="cards" class="cards" aria-live="polite"></div></section>
<dialog id="confirmation" aria-labelledby="confirm-title"><form id="confirm-form"><h2 id="confirm-title"></h2><label for="review-note">備註（選填，最多 2000 字）</label><textarea id="review-note" rows="4" maxlength="2000"></textarea><p id="confirm-error" role="alert"></p><div class="dialog-actions"><button id="confirm-cancel" type="button">取消</button><button id="confirm-submit" type="submit">確認變更</button></div></form></dialog>
<button id="reload" type="button">重新確認</button>
</main><script>var session = null;</script><script src="../../../shared/app-config.js"></script><script src="../../../shared/utils/shared-utils.js"></script><script src="../../../shared/auth/auth-service.js"></script><script src="panel.js"></script></body></html>
