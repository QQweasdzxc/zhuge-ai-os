  <div class="zhuge-module-shell investment-lab-shell">
    <div id="zhugeSharedNavigation" data-external-root="../../" data-active-workspace="labs"></div>
    <main class="app main-area zhuge-functional-tabs-layout">
      <header class="topbar zhuge-functional-tabs-header">
        <div class="topbar-context"><span class="eyebrow">Zhuge AI OS · Lab_投資</span><span>台股與美股研究 · Portfolio 唯讀</span></div>
        <form class="lab-global-search" data-symbol-search-form role="search">
          <label class="sr-only" for="lab-symbol-query">搜尋股票代號或名稱</label>
          <select data-market-select aria-label="搜尋市場"><option value="TW">台股</option><option value="US">美股</option></select>
          <input id="lab-symbol-query" name="symbol" type="search" maxlength="80" placeholder="搜尋代號或名稱" autocomplete="off">
          <button type="submit" class="secondary-button">研究</button>
        </form>
        <div class="topbar-right"><span class="read-only-chip">唯讀研究 · 不下單</span><button class="icon-button" type="button" data-refresh aria-label="重新整理目前資料" title="重新整理">↻</button></div>
      </header>
      <nav class="lab-content-nav zhuge-functional-tabs" aria-label="Investment Lab 功能" role="tablist">
        <button type="button" class="zhuge-functional-tab is-active" role="tab" aria-selected="true" data-view="overview"><span class="zhuge-functional-tab-icon" aria-hidden="true">⌂</span><span class="zhuge-functional-tab-label">總覽</span></button>
        <button type="button" class="zhuge-functional-tab" role="tab" aria-selected="false" data-view="scanner"><span class="zhuge-functional-tab-icon" aria-hidden="true">⌕</span><span class="zhuge-functional-tab-label">選股雷達</span></button>
        <button type="button" class="zhuge-functional-tab" role="tab" aria-selected="false" data-view="market"><span class="zhuge-functional-tab-icon" aria-hidden="true">▦</span><span class="zhuge-functional-tab-label">市場</span></button>
        <button type="button" class="zhuge-functional-tab" role="tab" aria-selected="false" data-view="holdings"><span class="zhuge-functional-tab-icon" aria-hidden="true">▣</span><span class="zhuge-functional-tab-label">我的持股</span></button>
        <button type="button" class="zhuge-functional-tab" role="tab" aria-selected="false" data-view="watchlist"><span class="zhuge-functional-tab-icon" aria-hidden="true">☆</span><span class="zhuge-functional-tab-label">觀察名單</span></button>
        <button type="button" class="zhuge-functional-tab" role="tab" aria-selected="false" data-view="research"><span class="zhuge-functional-tab-icon" aria-hidden="true">⌖</span><span class="zhuge-functional-tab-label">個股研究</span></button>
        <button type="button" class="zhuge-functional-tab" role="tab" aria-selected="false" data-view="chips"><span class="zhuge-functional-tab-icon" aria-hidden="true">▤</span><span class="zhuge-functional-tab-label">籌碼</span></button>
        <button type="button" class="zhuge-functional-tab" role="tab" aria-selected="false" data-view="technical"><span class="zhuge-functional-tab-icon" aria-hidden="true">⌁</span><span class="zhuge-functional-tab-label">技術分析</span></button>
        <button type="button" class="zhuge-functional-tab" role="tab" aria-selected="false" data-view="backtest"><span class="zhuge-functional-tab-icon" aria-hidden="true">▧</span><span class="zhuge-functional-tab-label">策略回測</span></button>
        <button type="button" class="zhuge-functional-tab" role="tab" aria-selected="false" data-view="history"><span class="zhuge-functional-tab-icon" aria-hidden="true">◷</span><span class="zhuge-functional-tab-label">平倉歷史</span></button>
        <div class="zhuge-functional-tabs-actions"><span class="runtime-indicator"><i></i><span data-runtime-status>準備讀取 Lab</span></span></div>
      </nav>
      <section id="view-root" class="view-root zhuge-functional-tabs-content" aria-live="polite">
        <div class="loading-state"><span class="spinner"></span><p>正在讀取官方來源…</p></div>
      </section>
      <footer class="app-footer"><span>使用 AIOS 登入與既有 Investment Access；估值、研究行情與資料 freshness 分開標示。</span><span>研究用途，不構成投資建議。</span></footer>
    </main>
  </div>
  <dialog class="detail-dialog" data-dialog>
    <div class="dialog-head"><div><p class="eyebrow">EVIDENCE DETAIL</p><h2 data-dialog-title>資料來源</h2></div><button class="icon-button" data-dialog-close aria-label="關閉">×</button></div>

  </dialog>
